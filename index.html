<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Highway Escape</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#050510;--fg:#e0e8ff;--mt:#4a5580;--ac:#00fff0;--ac2:#ff0066;--card:rgba(10,12,30,0.92);--bdr:rgba(0,255,240,0.15);--gold:#ffaa00;--xp:#00ff88}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Rajdhani',sans-serif;overflow:hidden;width:100vw;height:100vh;touch-action:none;user-select:none}
canvas#gc{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.ov{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;display:none}
.ov.on{pointer-events:auto;display:block}
.sc{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;position:absolute;top:0;left:0}
.sc.on{display:flex}
#menuSc{background:radial-gradient(ellipse at 50% 80%,rgba(0,255,240,0.05),transparent 60%),linear-gradient(180deg,rgba(5,5,16,0.97),rgba(5,5,16,0.99))}
.gt{font-family:'Orbitron',monospace;font-size:clamp(2.2rem,7vw,4.5rem);font-weight:900;letter-spacing:0.08em;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.15em;animation:gp 3s ease-in-out infinite}
@keyframes gp{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.gs{font-family:'Orbitron',monospace;font-size:clamp(0.6rem,1.8vw,0.9rem);color:var(--mt);letter-spacing:0.3em;margin-bottom:2em;text-transform:uppercase}
.bt{font-family:'Orbitron',monospace;font-size:clamp(0.75rem,1.8vw,1rem);font-weight:700;padding:0.7em 2.2em;border:2px solid var(--ac);background:rgba(0,255,240,0.07);color:var(--ac);cursor:pointer;letter-spacing:0.1em;transition:all 0.2s;min-width:180px;text-align:center;margin:0.35em}
.bt:hover,.bt:active{background:rgba(0,255,240,0.18);box-shadow:0 0 25px rgba(0,255,240,0.25);transform:scale(1.03)}
.bt.r{border-color:var(--ac2);color:var(--ac2);background:rgba(255,0,102,0.07)}
.bt.r:hover{background:rgba(255,0,102,0.18);box-shadow:0 0 25px rgba(255,0,102,0.25)}
.bt.g{border-color:var(--gold);color:var(--gold);background:rgba(255,170,0,0.07)}
.bt.g:hover{background:rgba(255,170,0,0.18);box-shadow:0 0 25px rgba(255,170,0,0.25)}
.bt.s{font-size:0.7rem;padding:0.45em 1.2em;min-width:auto}
.hs{font-family:'Orbitron',monospace;font-size:0.8rem;color:var(--gold);margin-top:0.8em;letter-spacing:0.1em}
#hudOv{z-index:20;pointer-events:none;padding:8px}
.ht{display:flex;justify-content:space-between;align-items:flex-start;padding:0 3px;gap:6px;flex-wrap:wrap}
.hl{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.hr{display:flex;gap:5px;align-items:center}
.st{font-family:'Orbitron',monospace;font-size:clamp(0.55rem,1.3vw,0.75rem);color:var(--fg);display:flex;align-items:center;gap:4px;background:var(--card);padding:3px 8px;border-radius:3px;border:1px solid var(--bdr);white-space:nowrap}
.st i{color:var(--ac);font-size:0.75em}
.st .v{color:var(--ac);font-weight:700}
.hst{display:flex;gap:1px}
.hst i{font-size:0.6em;color:#222}
.hst i.a{color:var(--ac2);text-shadow:0 0 6px var(--ac2)}
.lb{font-family:'Orbitron',monospace;font-size:0.6rem;color:var(--xp);background:var(--card);padding:2px 8px;border-radius:3px;border:1px solid rgba(0,255,136,0.2)}
.hb{position:absolute;bottom:8px;left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 8px}
.gw{display:flex;flex-direction:column;align-items:center;gap:3px}
#spdC{width:130px;height:80px}
.brs{display:flex;flex-direction:column;gap:4px;min-width:130px}
.bw{position:relative;height:12px;background:rgba(255,255,255,0.05);border-radius:6px;overflow:hidden;border:1px solid var(--bdr)}
.bf{height:100%;border-radius:6px;transition:width 0.15s}
.bf.hp{background:linear-gradient(90deg,#ff0044,#ff4477)}
.bf.ni{background:linear-gradient(90deg,#0066ff,#00fff0)}
.bf.xp{background:linear-gradient(90deg,#00cc66,#00ff88)}
.bl{position:absolute;top:0;left:6px;font-size:0.5rem;line-height:12px;font-family:'Orbitron',monospace;color:#fff;text-shadow:0 0 3px #000}
#mmC{width:100px;height:100px;border-radius:6px;border:1px solid var(--bdr);background:rgba(0,0,0,0.5)}
#nArea{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:25}
.nf{font-family:'Orbitron',monospace;font-size:clamp(0.8rem,2vw,1.2rem);font-weight:700;opacity:0;transform:translateY(10px) scale(0.9);transition:all 0.25s ease-out;text-shadow:0 0 15px currentColor;white-space:nowrap}
.nf.sh{opacity:1;transform:translateY(0) scale(1)}
.nf.fd{opacity:0;transform:translateY(-20px) scale(1.1)}
#cdB{position:absolute;top:33%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-weight:900;pointer-events:none;text-align:center;opacity:0;transition:opacity 0.3s}
#cdB.sh{opacity:1}
.cm{font-size:clamp(2rem,6vw,3.5rem);color:var(--ac2);text-shadow:0 0 30px rgba(255,0,102,0.6)}
.cl{font-size:clamp(0.6rem,1.5vw,0.9rem);color:var(--fg);letter-spacing:0.2em;opacity:0.7}
#drB{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-size:clamp(0.8rem,2vw,1.1rem);color:var(--gold);text-shadow:0 0 15px rgba(255,170,0,0.5);pointer-events:none;opacity:0;transition:opacity 0.2s}
#drB.sh{opacity:1}
.df{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse,transparent 30%,rgba(255,0,50,0.35));z-index:15;pointer-events:none;opacity:0;transition:opacity 0.12s}
.df.sh{opacity:1}
.nv{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse,transparent 50%,rgba(0,100,255,0.2));z-index:14;pointer-events:none;opacity:0;transition:opacity 0.2s}
.nv.sh{opacity:1}
.sm{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse,transparent 60%,rgba(255,100,0,0.15));z-index:16;pointer-events:none;opacity:0;transition:opacity 0.15s;filter:blur(1px)}
.sm.sh{opacity:1}
.fc{position:fixed;top:4px;left:4px;font-family:'Orbitron',monospace;font-size:0.55rem;color:var(--mt);z-index:30;pointer-events:none;display:none}
.fc.sh{display:block}
#grSc{background:rgba(5,5,16,0.96);padding:16px;overflow-y:auto}
.grt{font-family:'Orbitron',monospace;font-size:1.5rem;font-weight:900;color:var(--ac);margin-bottom:0.4em;letter-spacing:0.1em}
.gri{display:flex;gap:20px;margin-bottom:1.2em;font-family:'Orbitron',monospace;font-size:0.85rem;flex-wrap:wrap;justify-content:center}
.gri span{display:flex;align-items:center;gap:4px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;width:100%;max-width:800px;margin-bottom:1.2em}
.cc{background:var(--card);border:2px solid var(--bdr);border-radius:10px;padding:14px;transition:all 0.2s;cursor:pointer}
.cc:hover{border-color:var(--ac);box-shadow:0 0 15px rgba(0,255,240,0.12)}
.cc.sel{border-color:var(--ac);box-shadow:0 0 20px rgba(0,255,240,0.2)}
.cc.lk{opacity:0.45}
.cn{font-family:'Orbitron',monospace;font-size:0.9rem;font-weight:700;margin-bottom:6px}
.cs{height:5px;border-radius:3px;margin-bottom:8px}
.sr{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:0.65rem}
.sl{width:55px;color:var(--mt);font-family:'Orbitron',monospace}
.sb{flex:1;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden}
.sf{height:100%;border-radius:3px}
.cco{font-family:'Orbitron',monospace;font-size:0.75rem;color:var(--gold);margin-top:8px}
.ceq{font-family:'Orbitron',monospace;font-size:0.65rem;color:var(--ac);margin-top:4px}
#stSc{background:rgba(5,5,16,0.95)}
.stt{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:var(--ac);margin-bottom:1em}
.str{display:flex;align-items:center;gap:12px;margin:0.5em 0;font-family:'Orbitron',monospace;font-size:0.8rem}
.str label{width:100px;color:var(--mt);text-align:right}
.bg{display:flex;gap:4px}
.bo{padding:4px 12px;font-family:'Orbitron',monospace;font-size:0.65rem;border:1px solid var(--bdr);background:transparent;color:var(--mt);cursor:pointer;transition:all 0.15s}
.bo.av{border-color:var(--ac);color:var(--ac);background:rgba(0,255,240,0.1)}
#paSc{background:rgba(5,5,16,0.85);backdrop-filter:blur(4px)}
.pat{font-family:'Orbitron',monospace;font-size:2.2rem;font-weight:900;color:var(--ac);margin-bottom:1em}
#goSc{background:rgba(5,5,16,0.94)}
.got{font-family:'Orbitron',monospace;font-size:clamp(1.8rem,5vw,3rem);font-weight:900;color:var(--ac2);margin-bottom:0.4em}
.gos{display:flex;flex-direction:column;gap:6px;margin-bottom:1.5em;align-items:center}
.goi{font-family:'Orbitron',monospace;font-size:0.9rem;color:var(--fg)}
.goi span{color:var(--ac);font-weight:700}
.tc{position:fixed;bottom:0;left:0;right:0;z-index:22;display:none;justify-content:space-between;align-items:flex-end;padding:8px 12px;pointer-events:none}
.tc.on{display:flex}
.tz{pointer-events:auto;display:flex;gap:6px;align-items:flex-end}
.tb{width:54px;height:54px;border-radius:50%;border:2px solid rgba(0,255,240,0.35);background:rgba(0,255,240,0.08);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.1rem;-webkit-tap-highlight-color:transparent}
.tb:active{background:rgba(0,255,240,0.25)}
.tb.nt{border-color:rgba(0,100,255,0.4);color:#0088ff;background:rgba(0,100,255,0.08)}
.tb.nt:active{background:rgba(0,100,255,0.25)}
.tb.dt{border-color:rgba(255,170,0,0.4);color:var(--gold);background:rgba(255,170,0,0.08)}
.tb.dt:active{background:rgba(255,170,0,0.25)}
.sz{display:flex;gap:4px;pointer-events:auto}
.sbb{width:62px;height:62px;border-radius:10px;border:2px solid rgba(0,255,240,0.25);background:rgba(0,255,240,0.05);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.5rem;-webkit-tap-highlight-color:transparent}
.sbb:active{background:rgba(0,255,240,0.18)}
@media(max-width:600px){.cg{grid-template-columns:1fr}.bt{min-width:150px;padding:0.55em 1.6em}}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div class="df" id="dFlash"></div>

<div class="sm" id="smOv"></div>

<div class="ov on" id="menuOv">

<div class="ov" id="hudOv">

<div class="ov" id="garOv">

<script type="module">
import*as THREE from'three';
import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';
import{RenderPass}from'three/addons/postprocessing/RenderPass.js';
import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';

/* ===== QUALITY PRESETS ===== */
const QP=[
{name:'LOW',bloom:0,bStr:0,maxPol:2,maxTrf:5,spdL:false,rainP:0,maxPt:30,skid:false,heli:false,bld:2},
{name:'MED',bloom:1,bStr:0.5,maxPol:4,maxTrf:8,spdL:true,rainP:1500,maxPt:70,skid:true,heli:false,bld:3},
{name:'HIGH',bloom:1,bStr:0.8,maxPol:8,maxTrf:12,spdL:true,rainP:3000,maxPt:140,skid:true,heli:true,bld:4}
];
let QL=2;
const Q=()=>QP[QL];
if('ontouchstart'in window&&window.innerWidth<768)QL=1;

/* ===== CONFIG ===== */
const CFG={
road:{seg:200,w:22,lanes:4},
pl:{maxSpd:90,acc:30,brk:50,str:20,drag:0.4,latD:5,dLatD:2.2,dStrM:1.9},
ni:{boost:38,drain:32,regen:7},
hp:{max:100,pol:10,trf:14,bar:8,rblk:25},
pol:{baseSpd:40,acc:24,spawn:70},
trf:{baseSpd:18},
coin:{val:10,heal:15,xp:5},
heat:{rate:0.015,max:5},
combo:{delay:2.5,decay:0.25,nmB:0.5,nmS:100,dftS:50},
xp:{base:100,scale:1.4}
};
const CARS=[
{id:0,name:'Street Runner',col:0xff2244,spd:1,han:1,arm:1,nit:1,cost:0},
{id:1,name:'Night Stalker',col:0x2266ff,spd:1.15,han:0.95,arm:0.85,nit:1.1,cost:500},
{id:2,name:'Phantom X',col:0xaa00ff,spd:1.1,han:1.25,arm:0.8,nit:1.15,cost:800},
{id:3,name:'Iron Beast',col:0x556677,spd:0.9,han:0.75,arm:1.5,nit:0.85,cost:600},
{id:4,name:'Neon Viper',col:0x00ff88,spd:1.3,han:1.2,arm:0.65,nit:1.25,cost:1500},
{id:5,name:'Apex GT',col:0xffaa00,spd:1.45,han:1.35,arm:1,nit:1.4,cost:3000}
];
const TCOLS=[0xcc3333,0x3366cc,0x33aa55,0xccaa33,0x8833aa,0xcc6633,0x666677,0xaa2266];

/* ===== STATE ===== */
const S={
scr:'menu',score:0,dist:0,coins:0,tCoins:0,
hp:100,ni:100,heat:1,spd:0,lv:0,topSpd:0,
time:0,wTimer:0,weather:'clear',
selCar:0,unlocked:[0],upg:{spd:0,han:0,arm:0,nit:0},
inv:0,shake:0,
combo:1,comboT:0,maxCombo:1,dftT:0,drifting:false,
xp:0,level:1,sessXP:0,
tScale:1,tScaleT:1,smT:0,
vol:1,showFps:true
};

/* ===== SAVE/LOAD ===== */
function load(){try{const d=JSON.parse(localStorage.getItem('hwyE4'));if(d){S.tCoins=d.tc||0;S.unlocked=d.uc||[0];S.upg=d.u||{spd:0,han:0,arm:0,nit:0};S.selCar=d.sc||0;S.level=d.lv||1;S.xp=d.xp||0;S.vol=d.v??1;S.showFps=d.f??true;QL=d.q??2}}catch(e){}}
function save(){try{localStorage.setItem('hwyE4',JSON.stringify({tc:S.tCoins,uc:S.unlocked,u:S.upg,sc:S.selCar,lv:S.level,xp:S.xp,v:S.vol,f:S.showFps,q:QL}))}catch(e){}}
function getHS(){return parseInt(localStorage.getItem('hwyHS4')||'0')}
function setHS(s){const o=getHS();if(s>o)localStorage.setItem('hwyHS4',s.toString())}
load();

function cStat(k){const c=CARS[S.selCar];const u=[1,1.1,1.2,1.35,1.5][S.upg[k]]||1;return c[k]*u}
function xpFor(lv){return Math.floor(CFG.xp.base*Math.pow(CFG.xp.scale,lv-1))}
function addXP(a){S.xp+=a;S.sessXP+=a;while(S.xp>=xpFor(S.level)){S.xp-=xpFor(S.level);S.level++;S.tCoins+=50*S.level;notify('LEVEL UP! LV'+S.level,'#00ff88')}}

/* ===== THREE.JS SETUP ===== */
const cvs=document.getElementById('gc');
const R=new THREE.WebGLRenderer({canvas:cvs,antialias:QL>0});
R.setSize(window.innerWidth,window.innerHeight);

/* ===== HELPER: add mesh with position ===== */
function addM(parent,geo,mat,x,y,z){
  const m=new THREE.Mesh(geo,mat);

/* ===== CAR FACTORY ===== */
function mkCar(color,type){
  const g=new THREE.Group();
  const bm=new THREE.MeshStandardMaterial({color,metalness:0.8,roughness:0.2});
  // Body
  addM(g,cbGeo,bm,0,0.55,0);
  // Hood
  const hood=addM(g,chGeo,bm,0,0.85,1.2);
  hood.rotation.x=-0.2;
  // Cabin
  addM(g,ccGeo,MT.gl,0,1.1,-0.15);
  // Wheels
  [[-1.05,0.32,1.3],[1.05,0.32,1.3],[-1.05,0.32,-1.3],[1.05,0.32,-1.3]].forEach(p=>{
    const w=new THREE.Mesh(cwGeo,MT.wh);
    w.position.set(p[0],p[1],p[2]);
    w.rotation.z=Math.PI/2;
    g.add(w);
  });
  // Headlights
  addM(g,chlGeo,MT.hl,-0.7,0.6,2.2);
  addM(g,chlGeo,MT.hl,0.7,0.6,2.2);
  // Taillights
  addM(g,ctlGeo,MT.tl,-0.7,0.6,-2.2);
  addM(g,ctlGeo,MT.tl,0.7,0.6,-2.2);

  if(type==='police'){
    addM(g,new THREE.BoxGeometry(1.5,0.12,0.35),MT.bar,0,1.48,-0.15);
    const rl=addM(g,new THREE.BoxGeometry(0.35,0.18,0.25),MT.sr.clone(),-0.35,1.58,-0.15);
    const bl=addM(g,new THREE.BoxGeometry(0.35,0.18,0.25),MT.sb.clone(),0.35,1.58,-0.15);
    g.userData={rl,bl,type:'police'};
  }

  if(type==='player'){
    const um=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.5});
    addM(g,new THREE.BoxGeometry(1.8,0.04,3.8),um,0,0.2,0);
    const spot=new THREE.SpotLight(0xffffcc,4,45,0.4,0.5);
    spot.position.set(0,0.8,2.3);
    spot.target.position.set(0,0,25);
    g.add(spot);g.add(spot.target);
    const exL=addM(g,GE.exh,MT.ex,-0.5,0.35,-2.4);
    exL.rotation.x=Math.PI/2;exL.visible=false;
    const exR=addM(g,GE.exh,MT.ex,0.5,0.35,-2.4);
    exR.rotation.x=Math.PI/2;exR.visible=false;
    g.userData={exL,exR,type:'player'};
  }

  if(type==='traffic'){
    g.userData={type:'traffic'};
  }

  return g;
}

/* ===== OBJECT POOL ===== */
function mkPool(factory,n){
  const av=[],act=new Set();
  for(let i=0;i<n;i++){const o=factory();o.visible=false;av.push(o)}
  return{
    get(){let o=av.pop();if(!o)o=factory();o.visible=true;act.add(o);return o},
    rel(o){if(act.has(o)){act.delete(o);o.visible=false;av.push(o)}},
    relAll(){for(const o of act){o.visible=false;av.push(o)}act.clear()},
    sz(){return act.size},
    each(fn){act.forEach(fn)},
    clear(){act.forEach(o=>{o.visible=false;av.push(o)});act.clear()}
  };
}

/* ===== ROAD GENERATION ===== */
function mkRoad(zS){
  const seg=new THREE.Group();
  const L=CFG.road.seg,W=CFG.road.w;
  const isWet=S.weather==='rain'||S.weather==='storm';

  // Road surface
  const road=new THREE.Mesh(new THREE.PlaneGeometry(W,L),isWet?MT.wet:MT.road);
  road.rotation.x=-Math.PI/2;road.position.set(0,0,zS+L/2);seg.add(road);

  // Lane dashes
  const lW=W/CFG.road.lanes;
  for(let i=1;i<CFG.road.lanes;i++){
    const x=-W/2+i*lW;
    for(let d=0;d<L;d+=12){
      const ds=new THREE.Mesh(new THREE.PlaneGeometry(0.1,3),MT.ln);
      ds.rotation.x=-Math.PI/2;ds.position.set(x,0.01,zS+d+1.5);seg.add(ds);
    }
  }

  // Neon edge lines
  [-W/2+0.1,W/2-0.1].forEach(x=>{
    const e=new THREE.Mesh(new THREE.PlaneGeometry(0.12,L),MT.nc);
    e.rotation.x=-Math.PI/2;e.position.set(x,0.01,zS+L/2);seg.add(e);
  });

  // Barriers
  const bG=new THREE.BoxGeometry(0.4,0.8,L);
  [-W/2-0.3,W/2+0.3].forEach(x=>{
    const b=new THREE.Mesh(bG,MT.bar);b.position.set(x,0.4,zS+L/2);seg.add(b);
  });

  // Reflectors
  for(let d=0;d<L;d+=20){
    [-W/2-0.3,W/2+0.3].forEach(x=>{
      addM(seg,new THREE.BoxGeometry(0.08,0.12,0.08),MT.no,x,0.9,zS+d);
    });
  }

  // Buildings
  const bps=Q().bld;
  for(let side=-1;side<=1;side+=2){
    for(let b=0;b<bps;b++){
      const bx=side*(W/2+8+Math.random()*22);
      const bw=5+Math.random()*12,bh=8+Math.random()*40,bd=8+Math.random()*18;
      const bz=zS+Math.random()*L;
      const bMat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.6+Math.random()*0.1,0.12,0.04+Math.random()*0.04),roughness:0.7,metalness:0.3});
      const building=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),bMat);
      building.position.set(bx,bh/2,bz);seg.add(building);

      // Neon window strips
      const wM=nArr[Math.floor(Math.random()*nArr.length)];
      const nS=Math.min(Math.floor(bh/5),4);
      for(let s=0;s<nS;s++){
        if(Math.random()>0.55)continue;
        const yp=2+s*5;if(yp>bh-1)continue;
        const strip=new THREE.Mesh(new THREE.PlaneGeometry(bw*0.75,0.3),wM);
        strip.position.set(bx,yp,bz+(side>0?-bd/2-0.05:bd/2+0.05));
        strip.rotation.y=side>0?Math.PI:0;seg.add(strip);
      }

      // Neon sign
      if(Math.random()>0.55){
        const sW=2+Math.random()*3,sH=0.6+Math.random()*1.2;
        const sM=nArr[Math.floor(Math.random()*nArr.length)];
        const sign=new THREE.Mesh(new THREE.PlaneGeometry(sW,sH),sM);
        sign.position.set(bx,bh*0.35+Math.random()*bh*0.3,bz+(side>0?-bd/2-0.05:bd/2+0.05));
        sign.rotation.y=side>0?Math.PI:0;seg.add(sign);
      }
    }
  }

  // Street lights (emissive only, no PointLights)
  for(let d=25;d<L;d+=50){
    [-1,1].forEach(side=>{
      const x=side*(W/2+2);
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,6,6),MT.bar);
      pole.position.set(x,3,zS+d);seg.add(pole);
      const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.18,6,6),MT.nc);
      lamp.position.set(x,6.1,zS+d);seg.add(lamp);
    });
  }

  rdGrp.add(seg);rdSegs.set(zS,seg);
}

function updRoad(){
  const sZ=pZ-100,eZ=pZ+CFG.road.seg*5;
  const first=Math.floor(sZ/CFG.road.seg)*CFG.road.seg;
  for(let z=first;z<eZ;z+=CFG.road.seg){if(!rdSegs.has(z))mkRoad(z)}
  for(const[z,seg]of rdSegs){
    if(z<first-CFG.road.seg){rdGrp.remove(seg);seg.traverse(c=>{if(c.geometry)c.geometry.dispose()});rdSegs.delete(z)}
  }
}

/* ===== PARTICLES ===== */
function spawnPt(pos,col,cnt,sp,spd){
  cnt=cnt||8;sp=sp||2;spd=spd||5;
  for(let i=0;i<cnt;i++){
    let m;try{m=ptPool.get()}catch(e){return}if(!m)return;
    m.material.color.setHex(col);m.material.emissive.setHex(col);
    m.position.copy(pos);
    const v=new THREE.Vector3((Math.random()-0.5)*sp*spd,Math.random()*spd*0.7,(Math.random()-0.5)*sp*spd);
    m.material.opacity=1;m.scale.setScalar(0.5+Math.random()*0.7);
    ptD.set(m,{v,life:0.3+Math.random()*0.4,age:0});
  }
}

function updPt(dt){
  for(const[m,d]of ptD){
    d.age+=dt;if(d.age>=d.life){ptD.delete(m);ptPool.rel(m);continue}
    m.position.addScaledVector(d.v,dt);d.v.y-=9.8*dt;
    const a=1-d.age/d.life;m.material.opacity=a;m.scale.setScalar(Math.max(0.01,a*0.7));
  }
}

/* ===== SKID MARKS ===== */
let skT=0;
function updSk(dt){
  skT+=dt;
  if(S.drifting&&skT>0.1){
    skT=0;
    [-1,1].forEach(side=>{
      let m;try{m=skPool.get()}catch(e){return}if(!m)return;
      m.position.set(pX+side*0.9,0.015,pZ-1.3);
      m.rotation.x=-Math.PI/2;m.rotation.z=pMesh?pMesh.rotation.y:0;
      m.material.opacity=0.4;skD.set(m,{age:0,life:5});
    });
  }
  for(const[m,d]of skD){
    d.age+=dt;if(d.age>=d.life){skD.delete(m);skPool.rel(m);continue}
    m.material.opacity=Math.max(0,0.4*(1-d.age/d.life));
  }
}

/* ===== SPEED LINES UPDATE ===== */
function updSL(){
  if(!slGrp)return;
  const mx=CFG.pl.maxSpd*cStat('spd');const r=S.spd/mx;
  if(r<0.4){slGrp.visible=false;return}slGrp.visible=true;
  const a=(r-0.4)/0.6;
  slD.forEach(s=>{
    s.m.material.opacity=a*0.2;s.m.scale.y=3+r*10;
    const rz=s.m.position.z-pZ;
    if(rz<-5||rz>50){
      s.m.position.z=pZ+15+Math.random()*35;
      s.m.position.x=pX+(Math.random()-0.5)*14;
      s.m.position.y=0.3+Math.random()*5;
    }
  });
}

/* ===== PLAYER PHYSICS ===== */
const smI={l:0,r:0,u:0,d:0};
let nitroWasOff=true;

function updPlayer(dt){
  const ss=cStat('spd'),hs=cStat('han'),as=cStat('arm');
  const ms=CFG.pl.maxSpd*ss;
  const r=dt*10;
  smI.l=THREE.MathUtils.lerp(smI.l,input.l?1:0,r);
  smI.r=THREE.MathUtils.lerp(smI.r,input.r?1:0,r);
  smI.u=THREE.MathUtils.lerp(smI.u,input.u?1:0,r*0.8);
  smI.d=THREE.MathUtils.lerp(smI.d,input.d?1:0,r);

  S.spd+=(smI.u*CFG.pl.acc*ss+(1-smI.u)*CFG.pl.acc*0.25*ss-CFG.pl.drag*S.spd*0.1)*dt;
  if(smI.d>0.1)S.spd-=CFG.pl.brk*smI.d*dt;
  S.spd=Math.max(0,Math.min(S.spd,ms));

  // Nitro
  const nA=input.n&&S.ni>0;
  if(nA){
    S.spd+=CFG.ni.boost*cStat('nit')*dt;
    S.spd=Math.min(S.spd,ms*1.4);
    S.ni-=CFG.ni.drain*dt;S.ni=Math.max(0,S.ni);
    if(Math.random()<0.3)spawnPt(new THREE.Vector3(pX+(Math.random()-0.5)*0.6,0.3,pZ-2.5),0x0088ff,1,0.3,2);
    if(nitroWasOff){playNitro();nitroWasOff=false}
  }else{S.ni=Math.min(100,S.ni+CFG.ni.regen*dt);nitroWasOff=true}

  // Exhaust flames
  if(pMesh&&pMesh.userData.exL){
    pMesh.userData.exL.visible=nA;pMesh.userData.exR.visible=nA;
    if(nA){const fl=0.8+Math.random()*0.5;pMesh.userData.exL.scale.set(fl,fl*1.5,fl);pMesh.userData.exR.scale.set(fl,fl*1.5,fl)}
  }

  // Steering
  const isD=input.dr;
  const sF=CFG.pl.str*hs*(isD?CFG.pl.dStrM:1);
  S.lv+=(smI.r-smI.l)*sF*dt;
  const ld=isD?CFG.pl.dLatD:CFG.pl.latD;
  S.lv-=S.lv*ld*dt;S.lv=Math.max(-28,Math.min(28,S.lv));

  // Drift state
  S.drifting=isD&&Math.abs(S.lv)>2.5&&S.spd>20;
  if(S.drifting){S.dftT+=dt;addXP(dt*3);S.score+=Math.floor(CFG.combo.dftS*S.combo*dt)}
  else{if(S.dftT>0.5)notify('DRIFT '+S.dftT.toFixed(1)+'s','#ff6600');S.dftT=0}

  // Position
  pX+=S.lv*dt;pZ+=S.spd*dt;
  const hw=CFG.road.w/2-1.2;
  if(pX<-hw){pX=-hw;S.lv*=-0.3;dmg(CFG.hp.bar*dt*5/as);S.shake=0.3}
  if(pX>hw){pX=hw;S.lv*=-0.3;dmg(CFG.hp.bar*dt*5/as);S.shake=0.3}

  // Update mesh
  if(pMesh){
    pMesh.position.set(pX,Math.sin(S.time*12)*0.02*(S.spd/Math.max(1,ms)),pZ);
    pMesh.rotation.y=THREE.MathUtils.lerp(pMesh.rotation.y,-S.lv*0.03,dt*6);
    pMesh.rotation.z=THREE.MathUtils.lerp(pMesh.rotation.z,S.drifting?S.lv*0.012:0,dt*5);
  }

  S.dist=Math.floor(pZ);S.score=Math.floor(S.dist*0.1+S.coins*CFG.coin.val);
  if(S.spd>S.topSpd)S.topSpd=S.spd;if(S.inv>0)S.inv-=dt;
  S.score+=Math.floor(S.spd*0.01*S.combo*dt);
}

function dmg(amt){
  const as=cStat('arm');S.hp-=amt/as;S.inv=0.4;
  if(amt>6){
    S.shake=Math.min(0.8,amt*0.04);showDF();playCrash();
    spawnPt(new THREE.Vector3(pX,1,pZ),0xff4400,10,2,5);
    if(amt>15){S.tScaleT=0.25;S.smT=0.7;document.getElementById('smOv').classList.add('sh')}
  }
  if(S.hp<=0){S.hp=0;gameOver()}
}

/* ===== POLICE AI ===== */
let polST=0;
function updPol(dt){
  polST+=dt;const q=Q();
  const tc=Math.min(q.maxPol,Math.floor(S.heat)+1);
  if(polPool.sz()<tc&&polST>1.5){
    polST=0;const m=polPool.get();
    const lane=Math.floor(Math.random()*CFG.road.lanes);
    const lW=CFG.road.w/CFG.road.lanes;const x=-CFG.road.w/2+lW/2+lane*lW;
    m.position.set(x,0,pZ-CFG.pol.spawn-Math.random()*30);
    const roles=['chaser','chaser','blocker','flanker'];
    const role=S.heat>=3?roles[Math.floor(Math.random()*roles.length)]:'chaser';
    polD.set(m,{spd:CFG.pol.baseSpd,agg:0.3+S.heat*0.13,role,cd:0,nmCD:0});
  }

  for(const[m,d]of polD){
    const tS=S.spd*(0.65+d.agg*0.55)+5;
    d.spd+=(tS-d.spd)*dt*1.8;d.spd=Math.max(8,d.spd);
    m.position.z+=d.spd*dt;
    const dx=pX-m.position.x;

    if(d.role==='blocker'&&m.position.z<pZ+30&&m.position.z>pZ){
      d.spd=Math.max(d.spd,S.spd*1.1);
      if(m.position.z>pZ+5)m.position.x+=dx*dt*3;else m.position.x+=dx*dt*1.5;
    }else if(d.role==='flanker'){
      const fX=pX+(dx>0?4:-4);m.position.x+=(fX-m.position.x)*dt*2;m.position.z+=d.spd*dt;
    }else{m.position.x+=dx*d.agg*dt*2.5}

    const hw2=CFG.road.w/2-1;m.position.x=Math.max(-hw2,Math.min(hw2,m.position.x));

    if(m.userData.rl&&m.userData.bl){
      const f=Math.sin(S.time*10)>0;
      m.userData.rl.material.emissiveIntensity=f?5:0.3;
      m.userData.bl.material.emissiveIntensity=f?0.3:5;
    }
    m.rotation.y=-dx*0.02;
    if(d.cd>0)d.cd-=dt;if(d.nmCD>0)d.nmCD-=0.016;
    if(m.position.z<pZ-130||m.position.z>pZ+80){polD.delete(m);polPool.rel(m)}
  }
}

/* ===== TRAFFIC ===== */
let trfST=0;
function updTrf(dt){
  trfST+=dt;
  if(trfPool.sz()<Q().maxTrf&&trfST>0.7){
    trfST=0;const m=trfPool.get();
    const lane=Math.floor(Math.random()*CFG.road.lanes);
    const lW=CFG.road.w/CFG.road.lanes;const x=-CFG.road.w/2+lW/2+lane*lW;
    const ahead=Math.random()>0.3;
    m.position.set(x,0,ahead?pZ+50+Math.random()*100:pZ-25-Math.random()*30);
    trfD.set(m,{spd:CFG.trf.baseSpd*(0.5+Math.random()*0.7),lane,timer:3+Math.random()*8,nmCD:0});
  }
  for(const[m,d]of trfD){
    m.position.z+=d.spd*dt;d.timer-=dt;
    if(d.timer<=0&&Math.random()<0.15){d.timer=5+Math.random()*8;d.lane=Math.max(0,Math.min(CFG.road.lanes-1,d.lane+(Math.random()>0.5?1:-1)))}
    const lW=CFG.road.w/CFG.road.lanes;const tX=-CFG.road.w/2+lW/2+d.lane*lW;
    m.position.x+=(tX-m.position.x)*dt*2;
    if(d.nmCD>0)d.nmCD-=0.016;
    if(m.position.z<pZ-70||m.position.z>pZ+180){trfD.delete(m);trfPool.rel(m)}
  }
}

/* ===== COINS & REPAIRS ===== */
let cnST=0,rpST=0;
function updCR(dt){
  cnST+=dt;rpST+=dt;
  if(cnST>0.5&&cnPool.size()<15){
    cnST=0;const m=cnPool.get();
    const lane=Math.floor(Math.random()*CFG.road.lanes);const lW=CFG.road.w/CFG.road.lanes;
    m.position.set(-CFG.road.w/2+lW/2+lane*lW,1,pZ+70+Math.random()*100);cnD.set(m,{});
  }
  if(rpST>8&&rpPool.size()<3&&S.hp<80){
    rpST=0;const m=rpPool.get();
    const lane=Math.floor(Math.random()*CFG.road.lanes);const lW=CFG.road.w/CFG.road.lanes;
    m.position.set(-CFG.road.w/2+lW/2+lane*lW,0.8,pZ+90+Math.random()*80);rpD.set(m,{});
  }
  for(const[m]of cnD){
    m.rotation.y+=dt*3;m.position.y=1+Math.sin(S.time*3+m.position.z)*0.2;
    if(m.position.z<pZ-30){cnD.delete(m);cnPool.rel(m)}
  }
  for(const[m]of rpD){
    m.rotation.y+=dt*2;m.position.y=0.8+Math.sin(S.time*2+m.position.z)*0.15;
    if(m.position.z<pZ-30){rpD.delete(m);rpPool.rel(m)}
  }
}

/* ===== ROADBLOCKS ===== */
let rbST=0;
function updRB(dt){
  rbST+=dt;const intv=Math.max(8,30-S.heat*4);
  if(rbST>intv&&S.heat>=2&&rbPool.size()<8){
    rbST=0;const nb=2+Math.floor(Math.random()*2);
    const sl2=Math.floor(Math.random()*(CFG.road.lanes-nb+1));
    const lW=CFG.road.w/CFG.road.lanes;const bz=pZ+80+Math.random()*60;
    for(let i=0;i<nb;i++){
      const m=rbPool.get();const lane=sl2+i;

      rbD.set(m,{hp:1});

  }
  for(const[m]of rbD){if(m.position.z<pZ-40){rbD.delete(m);rbPool.rel(m)}}

/* ===== HELICOPTER ===== */
function updHeli(dt){
  if(!Q().heli||S.heat<4){if(heliM)heliM.visible=false;return}
  if(!heliM)heliM=mkHeli();heliM.visible=true;

/* ===== COMBO & NEAR MISS ===== */
function updCombo(dt){
  S.comboT+=dt;if(S.comboT>CFG.combo.delay){S.combo=Math.max(1,S.combo-CFG.combo.decay*dt)}
  if(S.combo>S.maxCombo)S.maxCombo=S.combo;
  const cdB=document.getElementById('cdB');
  if(S.combo>1.1){cdB.classList.add('sh');document.getElementById('cdM').textContent='x'+S.combo.toFixed(1)}
  else cdB.classList.remove('sh');
  const drB=document.getElementById('drB');
  if(S.drifting){drB.classList.add('sh');drB.textContent='DRIFT '+S.dftT.toFixed(1)+'s'}
  else drB.classList.remove('sh');
}

function chkNM(){
  const nD=3.2,cD=1.8,zR=3.5;
  const all=[...polD.entries()].concat([...trfD.entries()]);
  all.forEach(([m,d])=>{
    const dx=Math.abs(pX-m.position.x);const dz=Math.abs(pZ-m.position.z);
    if(dz<zR&&dx>cD&&dx<nD){
      if(!d.nmCD||d.nmCD<=0){
        S.combo+=CFG.combo.nmB;S.comboT=0;
        const bn=Math.floor(CFG.combo.nmS*S.combo);S.score+=bn;addXP(15);
        notify('NEAR MISS +'+bn,'#00fff0');
        spawnPt(new THREE.Vector3(pX,1.5,pZ),0x00fff0,5,1,3);
        d.nmCD=2;
      }
    }
  });
}

/* ===== COLLISIONS ===== */
function chkColl(){
  if(S.inv>0)return;
  // Police
  for(const[m,d]of polD){
    if(Math.abs(pX-m.position.x)<1.8&&Math.abs(pZ-m.position.z)<2.2){
      dmg(CFG.hp.pol);S.spd*=0.82;m.position.x+=(m.position.x-pX)*0.5;d.spd*=0.6;
    }
  }
  // Traffic
  for(const[m,d]of trfD){
    if(Math.abs(pX-m.position.x)<1.8&&Math.abs(pZ-m.position.z)<2.2){
      dmg(CFG.hp.trf);S.spd*=0.78;m.position.z+=4;d.spd*=0.4;
      spawnPt(new THREE.Vector3(pX,1,pZ),0xff8800,8,1.5,4);
    }
  }
  // Roadblocks
  for(const[m,d]of rbD){
    if(Math.abs(pX-m.position.x)<1.5&&Math.abs(pZ-m.position.z)<1.2){
      if(input.n&&S.ni>5){
        spawnPt(m.position.clone(),0xff4400,12,2,6);rbD.delete(m);rbPool.rel(m);
        S.score+=200;addXP(25);notify('SMASHED +200','#ff6600');
      }else{
        dmg(CFG.hp.rblk);S.spd*=0.4;S.lv*=-0.5;
        spawnPt(m.position.clone(),0xff4400,8,1.5,4);rbD.delete(m);rbPool.rel(m);
      }
    }
  }
  // Coins
  for(const[m]of cnD){
    if(Math.abs(pX-m.position.x)<2&&Math.abs(pZ-m.position.z)<2.5){
      S.coins++;S.tCoins++;addXP(CFG.coin.xp);playCoin();
      spawnPt(m.position.clone(),0xffaa00,5,1,3);cnD.delete(m);cnPool.rel(m);
    }
  }
  // Repairs
  for(const[m]of rpD){
    if(Math.abs(pX-m.position.x)<2&&Math.abs(pZ-m.position.z)<2.5){
      S.hp=Math.min(100,S.hp+CFG.coin.heal);addXP(10);
      notify('REPAIRED +'+CFG.coin.heal+' HP','#00ff44');
      spawnPt(m.position.clone(),0x00ff44,8,1,4);rpD.delete(m);rpPool.rel(m);
    }
  }
}

/* ===== WEATHER ===== */
let ltT=10,ltF=0;
function updWeath(dt){
  S.wTimer+=dt;if(S.wTimer>25){
    S.wTimer=0;
    const w=['clear','clear','clear','rain','rain','storm','fog'];
    S.weather=w[Math.floor(Math.random()*w.length)];
    if(S.weather!=='clear')notify(S.weather.toUpperCase()+' INCOMING','#8888bb');
  }
  let fd=0.008;
  if(S.weather==='fog')fd=0.022;else if(S.weather==='rain')fd=0.011;else if(S.weather==='storm')fd=0.014;
  scene.fog.density=THREE.MathUtils.lerp(scene.fog.density,fd,dt*0.5);
  const ai=S.weather==='fog'?0.4:S.weather==='storm'?0.3:0.7;
  aL.intensity=THREE.MathUtils.lerp(aL.intensity,ai+ltF*3,dt*4);
  dL.intensity=THREE.MathUtils.lerp(dL.intensity,0.5+ltF*5,dt*4);
  if(S.weather==='storm'){ltT-=dt;if(ltT<=0){ltT=4+Math.random()*12;ltF=1}}
  if(ltF>0)ltF=Math.max(0,ltF-dt*5);
  S.heat=Math.min(CFG.heat.max,S.heat+CFG.heat.rate*dt);S.time+=dt;
}

function updRain(dt){
  if(!rainM)return;const ir=S.weather==='rain'||S.weather==='storm';rainM.visible=ir;if(!ir)return;
  const arr=rainM.geometry.attributes.position.array;const cnt=arr.length/3;
  const it=S.weather==='storm'?2:1;
  for(let i=0;i<cnt;i++){
    arr[i*3+1]-=(25+it*15)*dt;
    if(arr[i*3+1]<0){arr[i*3]=pX+(Math.random()-0.5)*80;arr[i*3+1]=35+Math.random()*10;arr[i*3+2]=pZ+(Math.random()-0.5)*80}
  }
  rainM.geometry.attributes.position.needsUpdate=true;rainM.position.set(pX,0,pZ);
}

/* ===== AUDIO ===== */
let aCtx=null,eO=null,eG=null,s1=null,s2=null,sG=null;
function initAud(){
  if(aCtx)return;
  try{
    aCtx=new(window.AudioContext||window.webkitAudioContext)();
    eO=aCtx.createOscillator();eO.type='sawtooth';eO.frequency.value=80;
    eG=aCtx.createGain();eG.gain.value=0;
    const ef=aCtx.createBiquadFilter();ef.type='lowpass';ef.frequency.value=400;
    eO.connect(ef);ef.connect(eG);eG.connect(aCtx.destination);eO.start();
    s1=aCtx.createOscillator();s1.type='sine';s1.frequency.value=600;
    s2=aCtx.createOscillator();s2.type='sine';s2.frequency.value=800;
    sG=aCtx.createGain();sG.gain.value=0;
    s1.connect(sG);s2.connect(sG);sG.connect(aCtx.destination);s1.start();s2.start();
  }catch(e){}
}

function updAud(){
  if(!aCtx||S.vol<=0)return;const v=S.vol;
  const mx=CFG.pl.maxSpd*cStat('spd');const r=S.spd/Math.max(1,mx);
  eO.frequency.value=60+r*220;eG.gain.value=Math.min(0.07,r*0.09)*v;
  let cd=999;polD.forEach((d,m)=>{const ds=Math.hypot(m.position.x-pX,m.position.z-pZ);if(ds<cd)cd=ds});
  sG.gain.value=Math.max(0,1-cd/60)*0.05*v;
  const w=Math.sin(S.time*3)*200;s1.frequency.value=600+w;s2.frequency.value=800-w;
}

function playCrash(){
  if(!aCtx||S.vol<=0)return;
  const b=aCtx.createBuffer(1,aCtx.sampleRate*0.15,aCtx.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(aCtx.sampleRate*0.04));
  const s=aCtx.createBufferSource();s.buffer=b;const g=aCtx.createGain();g.gain.value=0.12*S.vol;
  s.connect(g);g.connect(aCtx.destination);s.start();
}

function playCoin(){
  if(!aCtx||S.vol<=0)return;
  const o=aCtx.createOscillator();o.type='sine';o.frequency.value=1200;
  const g=aCtx.createGain();g.gain.value=0.06*S.vol;
  g.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+0.12);
  o.connect(g);g.connect(aCtx.destination);o.start();o.stop(aCtx.currentTime+0.12);
}

function playNitro(){
  if(!aCtx||S.vol<=0)return;
  const b=aCtx.createBuffer(1,aCtx.sampleRate*0.3,aCtx.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.2*Math.exp(-i/(aCtx.sampleRate*0.12));
  const s=aCtx.createBufferSource();s.buffer=b;
  const f=aCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=700;
  const g=aCtx.createGain();g.gain.value=0.08*S.vol;
  s.connect(f);f.connect(g);g.connect(aCtx.destination);s.start();
}

/* ===== CAMERA ===== */
function updCam(dt){
  const mx=CFG.pl.maxSpd*cStat('spd');const r=S.spd/Math.max(1,mx);
  const dist=13+r*5;const h=5+r*3;
  const tp=new THREE.Vector3(pX*0.35,h,pZ-dist);
  cam.position.lerp(tp,dt*3.5);
  if(S.shake>0.01){cam.position.x+=(Math.random()-0.5)*S.shake;cam.position.y+=(Math.random()-0.5)*S.shake*0.4;S.shake*=0.88}else S.shake=0;
  cam.lookAt(pX*0.6,1,pZ+6+r*5);
  const tF=65+r*22;cam.fov=THREE.MathUtils.lerp(cam.fov,tF,dt*3);cam.updateProjectionMatrix();
}

const spC=document.getElementById('spdC').getContext('2d');
const mmC=document.getElementById('mmC').getContext('2d');

function updHUD(){

function drSpd(){
  const c=spC,w=130,h=80;c.clearRect(0,0,w,h);
  const cx=w/2,cy=h-4,r=56,sa=Math.PI,ea=2*Math.PI;
  const km=Math.floor(S.spd*3.6);const mK=Math.floor(CFG.pl.maxSpd*cStat('spd')*3.6);
  const rt=Math.min(1,km/Math.max(1,mK));
  c.beginPath();c.arc(cx,cy,r,sa,ea);c.strokeStyle='rgba(255,255,255,0.06)';c.lineWidth=5;c.stroke();
  const gr=c.createLinearGradient(cx-r,cy,cx+r,cy);
  gr.addColorStop(0,'#00fff0');gr.addColorStop(0.55,'#ffaa00');gr.addColorStop(1,'#ff0044');
  c.beginPath();c.arc(cx,cy,r,sa,sa+(ea-sa)*rt);c.strokeStyle=gr;c.lineWidth=5;c.stroke();
  const na=sa+(ea-sa)*rt;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(na)*(r-8),cy+Math.sin(na)*(r-8));
  c.strokeStyle='#ff0066';c.lineWidth=2;c.stroke();
  c.fillStyle='#00fff0';c.font='900 20px Orbitron';c.textAlign='center';c.fillText(km,cx,cy-16);
  c.fillStyle='rgba(255,255,255,0.35)';c.font='600 8px Orbitron';c.fillText('KM/H',cx,cy-5);
}

function drMM(){
  const c=mmC,w=100,h=100;c.clearRect(0,0,w,h);
  c.fillStyle='rgba(5,5,20,0.75)';c.fillRect(0,0,w,h);
  const cx=w/2,cy=h/2,rw=28;
  c.fillStyle='rgba(30,30,50,0.5)';c.fillRect(cx-rw/2,0,rw,h);
  const px=cx+(pX/(CFG.road.w/2))*(rw/2);
  c.fillStyle='#00ff88';c.beginPath();c.arc(px,cy,3.5,0,Math.PI*2);c.fill();
  polD.forEach((d,m)=>{
    const rx=cx+(m.position.x/(CFG.road.w/2))*(rw/2);
    const rz=cy-(m.position.z-pZ)*0.25;
    if(rz>2&&rz<h-2){c.fillStyle='#ff0044';c.beginPath();c.arc(rx,rz,2.5,0,Math.PI*2);c.fill()}
  });
  trfD.forEach((d,m)=>{
    const rx=cx+(m.position.x/(CFG.road.w/2))*(rw/2);
    const rz=cy-(m.position.z-pZ)*0.25;
    if(rz>2&&rz<h-2){c.fillStyle='#ffaa00';c.beginPath();c.arc(rx,rz,1.8,0,Math.PI*2);c.fill()}
  });
  rbD.forEach((d,m)=>{
    const rx=cx+(m.position.x/(CFG.road.w/2))*(rw/2);
    const rz=cy-(m.position.z-pZ)*0.25;
    if(rz>2&&rz<h-2){c.fillStyle='#ff4400';c.fillRect(rx-2,rz-1,4,2)}
  });
  c.strokeStyle='rgba(0,255,240,0.2)';c.lineWidth=1;c.strokeRect(0,0,w,h);
}

/* ===== INPUT ===== */
const input={l:false,r:false,u:false,d:false,dr:false,n:false};

document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')input.l=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')input.r=true;
  if(e.code==='ArrowUp'||e.code==='KeyW')input.u=true;
  if(e.code==='ArrowDown'||e.code==='KeyS')input.d=true;
  if(e.code==='Space'){input.dr=true;e.preventDefault()}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')input.n=true;
  if(e.code==='Escape')togglePause();
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')input.l=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')input.r=false;
  if(e.code==='ArrowUp'||e.code==='KeyW')input.u=false;
  if(e.code==='ArrowDown'||e.code==='KeyS')input.d=false;
  if(e.code==='Space')input.dr=false;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')input.n=false;
});

function setupTouch(id,key){
  const el=document.getElementById(id);if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();input[key]=true});
  el.addEventListener('touchend',e=>{e.preventDefault();input[key]=false});
  el.addEventListener('touchcancel',()=>{input[key]=false});
}
setupTouch('sL','l');setupTouch('sR','r');setupTouch('bBr','d');setupTouch('dBr','dr');setupTouch('nBr','n');

if(sLEl){
  sLEl.addEventListener('touchstart',()=>{input.u=true});

}
if(sREl){
  sREl.addEventListener('touchstart',()=>{input.u=true});
  sREl.addEventListener('touchend',()=>{if(!input.l)input.u=false});
}

/* ===== SCREEN MANAGEMENT ===== */
function showOv(id){
  ['menuOv','hudOv','garOv','setOv','paOv','goOv'].forEach(oid=>{
    const e=document.getElementById(oid);e.classList.remove('on');
    const sc=e.querySelector('.sc');if(sc)sc.classList.remove('on');
  });
  const e=document.getElementById(id);if(e){e.classList.add('on');
  const sc=e.querySelector('.sc');if(sc)sc.classList.add('on')}
  const tCtrl=document.getElementById('tCtrl');
  if(id==='hudOv'&&('ontouchstart'in window))tCtrl.classList.add('on');
  else tCtrl.classList.remove('on');
}

function startGame(){initAud();resetGame();S.scr='playing';showOv('hudOv')}

function resetGame(){
  S.score=0;S.dist=0;S.coins=0;S.hp=100;S.ni=100;S.heat=1;S.spd=0;S.lv=0;S.topSpd=0;
  S.time=0;S.wTimer=0;S.weather='clear';S.inv=0;S.shake=0;
  S.combo=1;S.comboT=0;S.maxCombo=1;S.dftT=0;S.drifting=false;
  S.sessXP=0;S.tScale=1;S.tScaleT=1;S.smT=0;
  pX=0;pZ=0;

  // Clear all pools
  polD.forEach((d,m)=>polPool.rel(m));polD.clear();
  trfD.forEach((d,m)=>trfPool.rel(m));trfD.clear();
  cnD.forEach((d,m)=>cnPool.rel(m));cnD.clear();
  rpD.forEach((d,m)=>rpPool.rel(m));rpD.clear();
  ptD.forEach((d,m)=>ptPool.rel(m));ptD.clear();
  skD.forEach((d,m)=>skPool.rel(m));skD.clear();
  rbD.forEach((d,m)=>rbPool.rel(m));rbD.clear();

  rdSegs.forEach((seg)=>{rdGrp.remove(seg);seg.traverse(c=>{if(c.geometry)c.geometry.dispose()})});rdSegs.clear();
  if(pMesh)scene.remove(pMesh);

  const car=CARS[S.selCar];pMesh=mkCar(car.col,'player');pMesh.position.set(0,0,0);scene.add(pMesh);

  for(let z=-CFG.road.seg;z<CFG.road.seg*4;z+=CFG.road.seg)mkRoad(z);
  cam.position.set(0,8,-15);scene.fog.density=0.008;

  // Initial coins
  for(let i=0;i<5;i++){
    const m=cnPool.get();const lane=Math.floor(Math.random()*CFG.road.lanes);
    const lW=CFG.road.w/CFG.road.lanes;m.position.set(-CFG.road.w/2+lW/2+lane*lW,1,20+i*25);cnD.set(m,{});
  }

  polST=0;trfST=0;cnST=0;rpST=0;rbST=0;ltT=10;ltF=0;
}

function gameOver(){
  S.scr='gameover';
  document.getElementById('tCtrl').classList.remove('on');
  setHS(S.score);
  document.getElementById('goD').textContent=S.dist;
  document.getElementById('goS').textContent=S.score;
  document.getElementById('goC').textContent=S.coins;
  document.getElementById('goSp').textContent=Math.floor(S.topSpd*3.6);
  document.getElementById('goCo').textContent='x'+S.maxCombo.toFixed(1);
  document.getElementById('goX').textContent=S.sessXP;
  showOv('goOv');
  spawnPt(new THREE.Vector3(pX,1,pZ),0xff4400,30,3,8);
  spawnPt(new THREE.Vector3(pX,1.5,pZ),0xffaa00,20,2,6);
  save();
}

function togglePause(){
  if(S.scr==='playing'){S.scr='paused';showOv('paOv')}
  else if(S.scr==='paused'){S.scr='playing';showOv('hudOv')}
}

function goMenu(){
  S.scr='menu';
  document.getElementById('tCtrl').classList.remove('on');
  document.getElementById('hsD').textContent='BEST: '+getHS();
  showOv('menuOv');
}

function openGar(){
  S.scr='garage';
  document.getElementById('gCn').textContent=S.tCoins;
  document.getElementById('gLv').textContent=S.level;
  renderGar();showOv('garOv');
}

function renderGar(){
  const grid=document.getElementById('cGrd');grid.innerHTML='';
  CARS.forEach(car=>{
    const ul=S.unlocked.includes(car.id);const eq=S.selCar===car.id;
    const card=document.createElement('div');card.className='cc'+(eq?' sel':'')+(!ul?' lk':'');
    const ch='#'+car.col.toString(16).padStart(6,'0');
    const sts=[{l:'SPEED',v:car.spd,c:'#00fff0'},{l:'HANDLE',v:car.han,c:'#ffaa00'},{l:'ARMOR',v:car.arm,c:'#ff4477'},{l:'NITRO',v:car.nit,c:'#0088ff'}];
    card.innerHTML='<div class="cn" style="color:'+ch+'">'+car.name+'</div>'+
      '<div class="cs" style="background:'+ch+'"></div>'+
      sts.map(s=>'<div class="sr"><span class="sl">'+s.l+'</span><div class="sb"><div class="sf" style="width:'+Math.min(100,s.v*66)+'%;background:'+s.c+'"></div></div></div>').join('')+
      (!ul?'<div class="cco"><i class="fas fa-lock"></i> '+car.cost+' coins</div>':'')+
      (ul&&!eq?'<button class="bt s eqb" data-id="'+car.id+'">EQUIP</button>':'')+
      (eq?'<div class="ceq">EQUIPPED</div>':'')+
      (!ul?'<button class="bt s g byb" data-id="'+car.id+'">BUY ('+car.cost+')</button>':'');
    grid.appendChild(card);
  });
  grid.querySelectorAll('.eqb').forEach(b=>b.addEventListener('click',()=>{
    S.selCar=parseInt(b.dataset.id);save();renderGar();
  }));
  grid.querySelectorAll('.byb').forEach(b=>b.addEventListener('click',()=>{
    const id=parseInt(b.dataset.id);const car=CARS.find(c=>c.id===id);
    if(S.tCoins>=car.cost){S.tCoins-=car.cost;S.unlocked.push(id);S.selCar=id;save();
    document.getElementById('gCn').textContent=S.tCoins;renderGar()}
  }));
}

function openSet(){S.scr='settings';showOv('setOv');updSetUI()}

function updSetUI(){
  document.querySelectorAll('#qBg .bo').forEach(b=>{b.classList.toggle('av',parseInt(b.dataset.q)===QL)});
  document.querySelectorAll('#vBg .bo').forEach(b=>{b.classList.toggle('av',parseFloat(b.dataset.v)===S.vol)});
  document.querySelectorAll('#fBg .bo').forEach(b=>{b.classList.toggle('av',parseInt(b.dataset.f)===(S.showFps?1:0))});
}

document.querySelectorAll('#qBg .bo').forEach(b=>b.addEventListener('click',()=>{
  QL=parseInt(b.dataset.q);bloom.strength=Q().bStr;bloom.enabled=Q().bloom>0;save();updSetUI();notify('Quality: '+Q().name,'#00fff0');
}));
document.querySelectorAll('#vBg .bo').forEach(b=>b.addEventListener('click',()=>{
  S.vol=parseFloat(b.dataset.v);save();updSetUI();
}));
document.querySelectorAll('#fBg .bo').forEach(b=>b.addEventListener('click',()=>{
  S.showFps=parseInt(b.dataset.f)===1;document.getElementById('fpsC').classList.toggle('sh',S.showFps);save();updSetUI();
}));

/* ===== UI BUTTONS ===== */
document.getElementById('playB').addEventListener('click',startGame);
document.getElementById('garB').addEventListener('click',openGar);
document.getElementById('setB').addEventListener('click',openSet);
document.getElementById('gBk').addEventListener('click',goMenu);
document.getElementById('sBk').addEventListener('click',goMenu);
document.getElementById('paB').addEventListener('click',togglePause);
document.getElementById('rsB').addEventListener('click',togglePause);
document.getElementById('qtB').addEventListener('click',goMenu);
document.getElementById('rtB').addEventListener('click',startGame);
document.getElementById('gmB').addEventListener('click',goMenu);

/* ===== SLOW-MO ===== */
function updSlowMo(dt){
  if(S.smT>0){S.smT-=dt;if(S.smT<=0){S.tScaleT=1;document.getElementById('smOv').classList.remove('sh')}}
  S.tScale=THREE.MathUtils.lerp(S.tScale,S.tScaleT,dt*5);
}

/* ===== FPS COUNTER ===== */
const fpsArr=[];let fpsT=0;
function updFPS(dt){
  fpsT+=dt;fpsArr.push(dt);
  if(fpsT>0.5){
    fpsT=0;while(fpsArr.length>30)fpsArr.shift();
    const avg=fpsArr.reduce((a,b)=>a+b,0)/fpsArr.length;
    document.getElementById('fpsC').textContent=Math.round(1/Math.max(0.001,avg))+' FPS';
    document.getElementById('fpsC').classList.toggle('sh',S.showFps);
  }
}

/* ===== INIT POOLS ===== */
initPools();mkRain();mkSpdL();
document.getElementById('fpsC').classList.toggle('sh',S.showFps);

/* ===== GAME LOOP ===== */
let lastT=0;

function loop(ts){
  requestAnimationFrame(loop);
  const rawDt=Math.min((ts-lastT)/1000,0.05);lastT=ts;
  const dt=rawDt*S.tScale;

  updFPS(rawDt);

  if(S.scr==='playing'){
    updPlayer(dt);updPol(dt);updTrf(dt);updCR(dt);updRB(dt);
    updPt(dt);updSk(dt);updSL();updHeli(dt);updRoad();
    updWeath(dt);updRain(dt);updCam(dt);chkColl();chkNM();
    updCombo(dt);updSlowMo(rawDt);updHUD();updAud();
  }else if(S.scr==='gameover'){
    updPt(rawDt);updCam(rawDt);updSlowMo(rawDt);
  }

  comp.render();
}

/* ===== START ===== */
document.getElementById('hsD').textContent='BEST: '+getHS();
showOv('menuOv');
requestAnimationFrame(loop);

document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.scr==='playing')togglePause()});
</script>
