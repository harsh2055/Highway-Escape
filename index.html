<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Highway Escape</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050510;--fg:#e0e8ff;--ac:#00fff0;--ac2:#ff0066;
  --gold:#ffaa00;--xp:#00ff88;--card:rgba(8,10,25,0.92);
  --bdr:rgba(0,255,240,0.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Rajdhani',sans-serif;overflow:hidden;width:100vw;height:100vh;touch-action:none;user-select:none}
canvas#gc{position:fixed;inset:0;width:100%;height:100%;z-index:1}

/* ── OVERLAYS ── */
.ov{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
.ov.on{pointer-events:auto;display:block}
.sc{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;position:absolute;inset:0}
.sc.on{display:flex}

/* ── MENU ── */
#menuSc{background:radial-gradient(ellipse at 50% 80%,rgba(0,255,240,0.06),transparent 65%),linear-gradient(180deg,rgba(5,5,16,.97),rgba(5,5,16,.99))}
.gt{font-family:'Orbitron',monospace;font-size:clamp(2rem,7vw,4.5rem);font-weight:900;letter-spacing:.08em;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.15em;animation:gp 3s ease-in-out infinite}
@keyframes gp{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.gs{font-family:'Orbitron',monospace;font-size:clamp(.55rem,1.6vw,.85rem);color:#4a5580;letter-spacing:.3em;margin-bottom:2em;text-transform:uppercase}
.bt{font-family:'Orbitron',monospace;font-size:clamp(.7rem,1.6vw,.95rem);font-weight:700;padding:.65em 2em;border:2px solid var(--ac);background:rgba(0,255,240,.07);color:var(--ac);cursor:pointer;letter-spacing:.1em;transition:all .18s;min-width:175px;text-align:center;margin:.3em}
.bt:hover,.bt:active{background:rgba(0,255,240,.18);box-shadow:0 0 22px rgba(0,255,240,.28);transform:scale(1.03)}
.bt.r{border-color:var(--ac2);color:var(--ac2);background:rgba(255,0,102,.07)}
.bt.r:hover{background:rgba(255,0,102,.18);box-shadow:0 0 22px rgba(255,0,102,.28)}
.bt.g{border-color:var(--gold);color:var(--gold);background:rgba(255,170,0,.07)}
.bt.g:hover{background:rgba(255,170,0,.18);box-shadow:0 0 22px rgba(255,170,0,.28)}
.bt.s{font-size:.65rem;padding:.4em 1em;min-width:auto}
.hs{font-family:'Orbitron',monospace;font-size:.78rem;color:var(--gold);margin-top:.8em;letter-spacing:.1em}

/* ── HUD ── */
#hudOv{z-index:20;pointer-events:none;padding:8px}
.ht{display:flex;justify-content:space-between;align-items:flex-start;padding:0 3px;gap:6px;flex-wrap:wrap}
.hl{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.hr{display:flex;gap:5px;align-items:center}
.st{font-family:'Orbitron',monospace;font-size:clamp(.5rem,1.2vw,.72rem);color:var(--fg);display:flex;align-items:center;gap:4px;background:var(--card);padding:3px 7px;border-radius:3px;border:1px solid var(--bdr);white-space:nowrap}
.st .v{color:var(--ac);font-weight:700}
.hst{display:flex;gap:1px}
.hst span{font-size:.55rem;color:#222;display:inline-block;width:10px;text-align:center}
.hst span.a{color:var(--ac2);text-shadow:0 0 6px var(--ac2)}
.lb{font-family:'Orbitron',monospace;font-size:.58rem;color:var(--xp);background:var(--card);padding:2px 7px;border-radius:3px;border:1px solid rgba(0,255,136,.2)}
.hb{position:absolute;bottom:8px;left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 8px}
.gw{display:flex;flex-direction:column;align-items:center;gap:3px}
#spdC{width:130px;height:80px}
.brs{display:flex;flex-direction:column;gap:4px;min-width:130px}
.bw{position:relative;height:12px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden;border:1px solid var(--bdr)}
.bf{height:100%;border-radius:6px;transition:width .15s}
.bf.hp{background:linear-gradient(90deg,#ff0044,#ff4477)}
.bf.ni{background:linear-gradient(90deg,#0066ff,#00fff0)}
.bf.xp{background:linear-gradient(90deg,#00cc66,#00ff88)}
.bl{position:absolute;top:0;left:6px;font-size:.48rem;line-height:12px;font-family:'Orbitron',monospace;color:#fff;text-shadow:0 0 3px #000}
#mmC{width:100px;height:100px;border-radius:6px;border:1px solid var(--bdr);background:rgba(0,0,0,.5)}
#nArea{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:25}
.nf{font-family:'Orbitron',monospace;font-size:clamp(.75rem,1.8vw,1.1rem);font-weight:700;opacity:0;transform:translateY(10px) scale(.9);transition:all .22s ease-out;text-shadow:0 0 12px currentColor;white-space:nowrap}
.nf.sh{opacity:1;transform:translateY(0) scale(1)}
.nf.fd{opacity:0;transform:translateY(-20px) scale(1.08)}
#cdB{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-weight:900;pointer-events:none;text-align:center;opacity:0;transition:opacity .25s}
#cdB.sh{opacity:1}
.cm{font-size:clamp(1.8rem,5vw,3rem);color:var(--ac2);text-shadow:0 0 25px rgba(255,0,102,.6)}
.cl{font-size:clamp(.55rem,1.3vw,.8rem);color:var(--fg);letter-spacing:.2em;opacity:.7}
#drB{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-size:clamp(.75rem,1.8vw,1rem);color:var(--gold);text-shadow:0 0 12px rgba(255,170,0,.5);pointer-events:none;opacity:0;transition:opacity .18s}
#drB.sh{opacity:1}

/* ── EFFECTS ── */
.df{position:fixed;inset:0;background:radial-gradient(ellipse,transparent 30%,rgba(255,0,50,.32));z-index:15;pointer-events:none;opacity:0;transition:opacity .1s}
.df.sh{opacity:1}
.nv{position:fixed;inset:0;background:radial-gradient(ellipse,transparent 50%,rgba(0,80,255,.18));z-index:14;pointer-events:none;opacity:0;transition:opacity .18s}
.nv.sh{opacity:1}
.sm{position:fixed;inset:0;background:radial-gradient(ellipse,transparent 55%,rgba(255,100,0,.12));z-index:16;pointer-events:none;opacity:0;transition:opacity .14s}
.sm.sh{opacity:1}
.fc{position:fixed;top:4px;left:4px;font-family:'Orbitron',monospace;font-size:.52rem;color:#4a5580;z-index:30;pointer-events:none;opacity:0}
.fc.sh{opacity:1}

/* ── GARAGE ── */
#grSc{background:rgba(5,5,16,.96);padding:16px;overflow-y:auto}
.grt{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:900;color:var(--ac);margin-bottom:.4em;letter-spacing:.1em}
.gri{display:flex;gap:20px;margin-bottom:1.2em;font-family:'Orbitron',monospace;font-size:.82rem;flex-wrap:wrap;justify-content:center}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:100%;max-width:760px;margin-bottom:1.2em}
.cc{background:var(--card);border:2px solid var(--bdr);border-radius:10px;padding:13px;transition:all .18s;cursor:pointer}
.cc:hover{border-color:var(--ac);box-shadow:0 0 14px rgba(0,255,240,.12)}
.cc.sel{border-color:var(--ac);box-shadow:0 0 18px rgba(0,255,240,.2)}
.cc.lk{opacity:.45}
.cn{font-family:'Orbitron',monospace;font-size:.88rem;font-weight:700;margin-bottom:6px}
.cs{height:4px;border-radius:2px;margin-bottom:8px}
.sr{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:.62rem}
.sl{width:52px;color:#4a5580;font-family:'Orbitron',monospace}
.sb{flex:1;height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.sf{height:100%;border-radius:2px}
.cco{font-family:'Orbitron',monospace;font-size:.72rem;color:var(--gold);margin-top:8px}
.ceq{font-family:'Orbitron',monospace;font-size:.62rem;color:var(--ac);margin-top:4px}

/* ── SETTINGS ── */
#stSc{background:rgba(5,5,16,.96)}
.stt{font-family:'Orbitron',monospace;font-size:1.6rem;font-weight:900;color:var(--ac);margin-bottom:1em}
.str{display:flex;align-items:center;gap:12px;margin:.5em 0;font-family:'Orbitron',monospace;font-size:.78rem}
.str label{width:95px;color:#4a5580;text-align:right}
.bg{display:flex;gap:4px}
.bo{padding:4px 10px;font-family:'Orbitron',monospace;font-size:.62rem;border:1px solid var(--bdr);background:transparent;color:#4a5580;cursor:pointer;transition:all .14s}
.bo.av{border-color:var(--ac);color:var(--ac);background:rgba(0,255,240,.1)}

/* ── PAUSE / GAME OVER ── */
#paSc{background:rgba(5,5,16,.82);backdrop-filter:blur(6px)}
.pat{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;color:var(--ac);margin-bottom:1em}
#goSc{background:rgba(5,5,16,.95)}
.got{font-family:'Orbitron',monospace;font-size:clamp(1.6rem,5vw,2.8rem);font-weight:900;color:var(--ac2);margin-bottom:.4em}
.gos{display:flex;flex-direction:column;gap:5px;margin-bottom:1.4em;align-items:center}
.goi{font-family:'Orbitron',monospace;font-size:.88rem;color:var(--fg)}
.goi span{color:var(--ac);font-weight:700}

/* ── TOUCH CONTROLS ── */
.tc{position:fixed;bottom:0;left:0;right:0;z-index:22;display:none;justify-content:space-between;align-items:flex-end;padding:8px 12px;pointer-events:none}
.tc.on{display:flex}
.tz{pointer-events:auto;display:flex;gap:6px;align-items:flex-end}
.tb{width:52px;height:52px;border-radius:50%;border:2px solid rgba(0,255,240,.3);background:rgba(0,255,240,.06);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.1rem;-webkit-tap-highlight-color:transparent;pointer-events:auto;font-family:'Rajdhani',sans-serif;font-weight:700}
.tb:active{background:rgba(0,255,240,.22)}
.tb.nt{border-color:rgba(0,100,255,.4);color:#0088ff;background:rgba(0,100,255,.07)}
.tb.nt:active{background:rgba(0,100,255,.22)}
.tb.dt{border-color:rgba(255,170,0,.4);color:var(--gold);background:rgba(255,170,0,.07)}
.tb.dt:active{background:rgba(255,170,0,.22)}
.sz{display:flex;gap:4px;pointer-events:auto}
.sbb{width:60px;height:60px;border-radius:10px;border:2px solid rgba(0,255,240,.22);background:rgba(0,255,240,.04);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.4rem;-webkit-tap-highlight-color:transparent;pointer-events:auto;font-family:'Rajdhani',sans-serif;font-weight:700}
.sbb:active{background:rgba(0,255,240,.16)}

@media(max-width:600px){.cg{grid-template-columns:1fr}.bt{min-width:148px;padding:.5em 1.4em}}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div class="df" id="dFlash"></div>
<div class="nv" id="nVig"></div>
<div class="sm" id="smOv"></div>
<div class="fc" id="fpsC">60 FPS</div>

<!-- MENU -->
<div class="ov on" id="menuOv">
<div class="sc on" id="menuSc">
  <div class="gt">HIGHWAY ESCAPE</div>
  <div class="gs">Outrun the law</div>
  <button class="bt" id="playB">▶ DRIVE</button>
  <button class="bt g" id="garB">⬡ GARAGE</button>
  <button class="bt r" id="setB">⚙ SETTINGS</button>
  <div class="hs" id="hsD">BEST: 0</div>
</div></div>

<!-- HUD -->
<div class="ov" id="hudOv">
<div class="ht">
  <div class="hl">
    <div class="st">🛣 <span class="v" id="hDst">0</span>m</div>
    <div class="st">★ <span class="v" id="hScr">0</span></div>
    <div class="st">◈ <span class="v" id="hCns">0</span></div>
    <div class="lb">LV <span id="hLv">1</span></div>
  </div>
  <div class="hr">
    <div class="st">HEAT <span class="hst" id="hHt"></span></div>
    <button class="bt s" id="paB" style="margin:0;pointer-events:auto">⏸</button>
  </div>
</div>
<div id="nArea"></div>
<div id="cdB"><div class="cm" id="cdM">x1.0</div><div class="cl">COMBO</div></div>
<div id="drB">DRIFT 0.0s</div>
<div class="hb">
  <canvas id="mmC" width="100" height="100"></canvas>
  <div class="gw">
    <canvas id="spdC" width="130" height="80"></canvas>
    <div class="brs">
      <div class="bw"><div class="bf hp" id="hpB" style="width:100%"></div><span class="bl">HP</span></div>
      <div class="bw"><div class="bf ni" id="niB" style="width:100%"></div><span class="bl">N2O</span></div>
      <div class="bw"><div class="bf xp" id="xpB" style="width:0%"></div><span class="bl">XP</span></div>
    </div>
  </div>
  <div style="width:100px"></div>
</div></div>

<!-- GARAGE -->
<div class="ov" id="garOv">
<div class="sc on" id="grSc">
  <div class="grt">GARAGE</div>
  <div class="gri">
    <span>◈ <span id="gCn">0</span></span>
    <span>★ LV <span id="gLv">1</span></span>
  </div>
  <div class="cg" id="cGrd"></div>
  <button class="bt r" id="gBk">← BACK</button>
</div></div>

<!-- SETTINGS -->
<div class="ov" id="setOv">
<div class="sc on" id="stSc">
  <div class="stt">SETTINGS</div>
  <div class="str"><label>Quality</label><div class="bg" id="qBg"><button class="bo" data-q="0">LOW</button><button class="bo" data-q="1">MED</button><button class="bo av" data-q="2">HIGH</button></div></div>
  <div class="str"><label>Volume</label><div class="bg" id="vBg"><button class="bo" data-v="0">OFF</button><button class="bo" data-v="0.5">LOW</button><button class="bo av" data-v="1">HIGH</button></div></div>
  <div class="str"><label>Show FPS</label><div class="bg" id="fBg"><button class="bo" data-f="0">OFF</button><button class="bo av" data-f="1">ON</button></div></div>
  <div style="margin-top:1.5em"><button class="bt" id="sBk">← BACK</button></div>
</div></div>

<!-- PAUSE -->
<div class="ov" id="paOv">
<div class="sc on" id="paSc">
  <div class="pat">PAUSED</div>
  <button class="bt" id="rsB">▶ RESUME</button>
  <button class="bt r" id="qtB">⌂ QUIT</button>
</div></div>

<!-- GAME OVER -->
<div class="ov" id="goOv">
<div class="sc on" id="goSc">
  <div class="got">BUSTED</div>
  <div class="gos">
    <div class="goi">Distance: <span id="goD">0</span>m</div>
    <div class="goi">Score: <span id="goS">0</span></div>
    <div class="goi">Coins: <span id="goC">0</span></div>
    <div class="goi">Top Speed: <span id="goSp">0</span> km/h</div>
    <div class="goi">Max Combo: <span id="goCo">x1.0</span></div>
    <div class="goi">XP Earned: <span id="goX">0</span></div>
  </div>
  <button class="bt" id="rtB">↺ RETRY</button>
  <button class="bt r" id="gmB">⌂ MENU</button>
</div></div>

<!-- TOUCH CONTROLS -->
<div class="tc" id="tCtrl">
  <div class="sz">
    <button class="sbb" id="sL">◀</button>
    <button class="sbb" id="sR">▶</button>
  </div>
  <div class="tz">
    <button class="tb dt" id="dBr">~</button>
    <button class="tb nt" id="nBr">⚡</button>
    <button class="tb" id="bBr">■</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const CFG = {
  road: { segLen: 180, width: 22, lanes: 4 },
  player: { maxSpd: 70, acc: 22, brk: 45, steer: 18, drag: 0.38, latDamp: 5, driftLatDamp: 2.1, driftSteerMul: 1.85 },
  nitro: { boost: 35, drain: 30, regen: 6 },
  hp: { max: 100, polHit: 9, trfHit: 13, barrierHit: 7, roadblockHit: 22 },
  police: { baseSpd: 38, spawnDist: 68 },
  traffic: { baseSpd: 16 },
  coin: { healAmt: 14, xpAmt: 4 },
  heat: { rate: 0.013, max: 5 },
  combo: { resetDelay: 2.4, decay: 0.22, nearMissBonus: 0.45, nearMissScore: 90, driftScore: 45 },
  xp: { base: 100, scale: 1.4 },
};

const QUALITY = [
  { bloom: false, bloomStr: 0, maxPol: 2, maxTrf: 5, rain: false, rainPts: 0, maxPt: 25, skid: false, bldPerSeg: 2 },
  { bloom: true,  bloomStr: 0.45, maxPol: 4, maxTrf: 8, rain: true, rainPts: 1400, maxPt: 65, skid: true, bldPerSeg: 3 },
  { bloom: true,  bloomStr: 0.75, maxPol: 7, maxTrf: 11, rain: true, rainPts: 2600, maxPt: 120, skid: true, bldPerSeg: 5 },
];

const CARS = [
  { id:0, name:'Street Runner', col:0xff2244, spd:1,   han:1,    arm:1,   nit:1,   cost:0 },
  { id:1, name:'Night Stalker', col:0x2266ff, spd:1.15, han:0.95, arm:0.85, nit:1.1, cost:500 },
  { id:2, name:'Phantom X',     col:0xaa00ff, spd:1.1,  han:1.25, arm:0.8,  nit:1.15, cost:800 },
  { id:3, name:'Iron Beast',    col:0x556677, spd:0.9,  han:0.75, arm:1.5,  nit:0.85, cost:600 },
  { id:4, name:'Neon Viper',    col:0x00ff88, spd:1.3,  han:1.2,  arm:0.65, nit:1.25, cost:1500 },
  { id:5, name:'Apex GT',       col:0xffaa00, spd:1.45, han:1.35, arm:1,    nit:1.4,  cost:3000 },
];

const NEON_COLORS = [0x00fff0, 0xff0066, 0xaa00ff, 0xff6600, 0x00ff88];
const TRAFFIC_COLS = [0xcc3333, 0x3366cc, 0x33aa55, 0xccaa33, 0x8833aa, 0xcc6633, 0x667788, 0xaa2266];

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let QL = ('ontouchstart' in window && window.innerWidth < 768) ? 1 : 2;
const Q = () => QUALITY[QL];

const S = {
  screen: 'menu',
  score: 0, dist: 0, coins: 0, totalCoins: 0,
  hp: 100, nitro: 100, heat: 1, speed: 0, lateralV: 0,
  topSpeed: 0, time: 0, weatherTimer: 0, weather: 'clear',
  invTimer: 0, shakeAmt: 0,
  combo: 1, comboTimer: 0, maxCombo: 1, driftTimer: 0, drifting: false,
  xp: 0, level: 1, sessionXP: 0,
  slowScale: 1, slowTarget: 1, slowTimer: 0,
  selectedCar: 0, unlocked: [0],
  vol: 1, showFps: true,
  paused: false,
};

/* ═══════════════════════════════════════════
   SAVE / LOAD
═══════════════════════════════════════════ */
function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem('hwyE5') || 'null');
    if (d) {
      S.totalCoins = d.tc || 0;
      S.unlocked = d.uc || [0];
      S.selectedCar = d.sc || 0;
      S.level = d.lv || 1;
      S.xp = d.xp || 0;
      S.vol = d.v ?? 1;
      S.showFps = d.f ?? true;
      QL = d.q ?? QL;
    }
  } catch(e) {}
}

function saveSave() {
  try {
    localStorage.setItem('hwyE5', JSON.stringify({
      tc: S.totalCoins, uc: S.unlocked, sc: S.selectedCar,
      lv: S.level, xp: S.xp, v: S.vol, f: S.showFps, q: QL
    }));
  } catch(e) {}
}

function getHighScore() { return parseInt(localStorage.getItem('hwyHS5') || '0'); }
function setHighScore(s) { if (s > getHighScore()) localStorage.setItem('hwyHS5', String(s)); }

loadSave();

function carStat(k) {
  const c = CARS[S.selectedCar];
  return c[k];
}
function xpForLevel(lv) { return Math.floor(CFG.xp.base * Math.pow(CFG.xp.scale, lv - 1)); }
function addXP(a) {
  S.xp += a; S.sessionXP += a;
  while (S.xp >= xpForLevel(S.level)) {
    S.xp -= xpForLevel(S.level);
    S.level++;
    S.totalCoins += 60 * S.level;
    notify('LEVEL UP! LV' + S.level, '#00ff88');
  }
}

/* ═══════════════════════════════════════════
   RENDERER SETUP — Fixed for visibility
═══════════════════════════════════════════ */
const canvas = document.getElementById('gc');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: QL > 0,
  powerPreference: 'high-performance',
  alpha: false,
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, QL > 1 ? 2 : 1.5));

function createCar(color, type) {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color });
  const trimMat = new THREE.MeshLambertMaterial({ color: new THREE.Color(color).multiplyScalar(0.6) });

  // Body
  const body = new THREE.Mesh(GEO.carBody, bodyMat);
  body.position.set(0, 0.52, 0);
  group.add(body);

  // Hood slope
  const hood = new THREE.Mesh(GEO.carHood, bodyMat);
  hood.position.set(0, 0.82, 1.15);
  hood.rotation.x = -0.22;
  group.add(hood);

  // Cabin
  const cabin = new THREE.Mesh(GEO.carCabin, MAT.glass);
  cabin.position.set(0, 1.1, -0.12);
  group.add(cabin);

  // Cabin roof
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.12, 1.5), trimMat);
  roof.position.set(0, 1.4, -0.12);
  group.add(roof);

  // Wheels — four corners
  const wPos = [[-1.08, 0.31, 1.3], [1.08, 0.31, 1.3], [-1.08, 0.31, -1.3], [1.08, 0.31, -1.3]];
  wPos.forEach(p => {
    const w = new THREE.Mesh(GEO.wheel, MAT.wheel);
    w.position.set(...p);
    w.rotation.z = Math.PI / 2;
    group.add(w);
    // Rim
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.27, 6), new THREE.MeshLambertMaterial({ color: 0x444444 }));
    rim.position.set(...p);
    rim.rotation.z = Math.PI / 2;
    group.add(rim);
  });

  // Headlights
  const hl1 = new THREE.Mesh(GEO.headlight, MAT.headlight);
  hl1.position.set(-0.68, 0.6, 2.12);
  group.add(hl1);
  const hl2 = new THREE.Mesh(GEO.headlight, MAT.headlight);
  hl2.position.set(0.68, 0.6, 2.12);
  group.add(hl2);

  // Taillights
  const tl1 = new THREE.Mesh(GEO.taillight, MAT.taillight);
  tl1.position.set(-0.68, 0.6, -2.12);
  group.add(tl1);
  const tl2 = new THREE.Mesh(GEO.taillight, MAT.taillight);
  tl2.position.set(0.68, 0.6, -2.12);
  group.add(tl2);

  // Underline glow strip
  if (type === 'player') {
    const glowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 });
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 3.8), glowMat);
    glow.rotation.x = -Math.PI / 2;
    glow.position.set(0, 0.04, 0);
    group.add(glow);

    // Exhaust flames
    const exL = new THREE.Mesh(GEO.exhaust, MAT.exhaust.clone());
    exL.position.set(-0.5, 0.32, -2.35);
    exL.rotation.x = Math.PI / 2;
    exL.visible = false;
    group.add(exL);
    const exR = new THREE.Mesh(GEO.exhaust, MAT.exhaust.clone());
    exR.position.set(0.5, 0.32, -2.35);
    exR.rotation.x = Math.PI / 2;
    exR.visible = false;
    group.add(exR);

    group.userData = { type: 'player', exL, exR };
  }

  if (type === 'police') {
    // Police light bar
    const bar = new THREE.Mesh(GEO.sirenBar, MAT.barrier);
    bar.position.set(0, 1.48, -0.12);
    group.add(bar);
    const sr = new THREE.Mesh(GEO.siren, new THREE.MeshBasicMaterial({ color: 0xff0000 }));
    sr.position.set(-0.35, 1.58, -0.12);
    group.add(sr);
    const sb = new THREE.Mesh(GEO.siren, new THREE.MeshBasicMaterial({ color: 0x0044ff }));
    sb.position.set(0.35, 1.58, -0.12);
    group.add(sb);
    group.userData = { type: 'police', sr, sb };
  }

  if (type === 'traffic') {
    group.userData = { type: 'traffic' };
  }

  return group;
}

/* ═══════════════════════════════════════════
   OBJECT POOL
═══════════════════════════════════════════ */
function createPool(factory, count) {
  const available = [];
  const active = new Set();
  for (let i = 0; i < count; i++) {
    const obj = factory();
    obj.visible = false;
    available.push(obj);
  }
  return {
    get() {
      let obj = available.pop();
      if (!obj) { obj = factory(); }
      obj.visible = true;
      active.add(obj);
      return obj;
    },
    release(obj) {
      if (active.has(obj)) {
        active.delete(obj);
        obj.visible = false;
        available.push(obj);
      }
    },
    releaseAll() {
      for (const obj of active) { obj.visible = false; available.push(obj); }
      active.clear();
    },
    size() { return active.size; },
    forEach(fn) { active.forEach(fn); },
    entries() { return active; }
  };
}

/* ═══════════════════════════════════════════
   ROAD GENERATION
═══════════════════════════════════════════ */
const roadGroup = new THREE.Group();
scene.add(roadGroup);
const roadSegments = new Map(); // z → group

function buildRoadSegment(startZ) {
  const seg = new THREE.Group();
  const L = CFG.road.segLen;
  const W = CFG.road.width;
  const isWet = S.weather === 'rain' || S.weather === 'storm';

  // Road surface
  const road = new THREE.Mesh(new THREE.PlaneGeometry(W, L), isWet ? MAT.roadWet : MAT.road);
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0, startZ + L / 2);
  seg.add(road);

  // Lane dashes
  const laneW = W / CFG.road.lanes;
  for (let i = 1; i < CFG.road.lanes; i++) {
    const x = -W / 2 + i * laneW;
    for (let d = 0; d < L; d += 14) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 3.2), MAT.laneLine);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(x, 0.01, startZ + d + 1.6);
      seg.add(dash);
    }
  }

  // Neon edge lines (always bright)
  [-W / 2 + 0.1, W / 2 - 0.1].forEach(x => {
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.15, L), MAT.neonCyan);
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(x, 0.02, startZ + L / 2);
    seg.add(edge);
  });

  // Side barriers
  const barrierGeo = new THREE.BoxGeometry(0.38, 0.75, L);
  [-W / 2 - 0.28, W / 2 + 0.28].forEach(x => {
    const b = new THREE.Mesh(barrierGeo, MAT.barrier);
    b.position.set(x, 0.375, startZ + L / 2);
    seg.add(b);
  });

  // Buildings
  for (let side = -1; side <= 1; side += 2) {
    for (let b = 0; b < Q().bldPerSeg; b++) {
      const bx = side * (W / 2 + 7 + Math.random() * 20);
      const bw = 5 + Math.random() * 11;
      const bh = 8 + Math.random() * 38;
      const bd = 7 + Math.random() * 16;
      const bz = startZ + Math.random() * L;
      const bMat = new THREE.MeshLambertMaterial({
        color: new THREE.Color().setHSL(0.58 + Math.random() * 0.08, 0.1, 0.035 + Math.random() * 0.035)
      });
      const building = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), bMat);
      building.position.set(bx, bh / 2, bz);
      seg.add(building);

      // Neon strips
      const nMat = NEON_MATS[Math.floor(Math.random() * NEON_MATS.length)];
      const strips = Math.min(3, Math.floor(bh / 7));
      for (let s = 0; s < strips; s++) {
        if (Math.random() > 0.5) continue;
        const yp = 2 + s * 7;
        if (yp >= bh - 1) continue;
        const strip = new THREE.Mesh(new THREE.PlaneGeometry(bw * 0.7, 0.28), nMat);
        strip.position.set(bx, yp, bz + (side > 0 ? -bd / 2 - 0.04 : bd / 2 + 0.04));
        strip.rotation.y = side > 0 ? Math.PI : 0;
        seg.add(strip);
      }
    }
  }

  // Street lights
  for (let d = 20; d < L; d += 45) {
    [-1, 1].forEach(side => {
      const x = side * (W / 2 + 2);
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 6, 6), MAT.barrier);
      pole.position.set(x, 3, startZ + d);
      seg.add(pole);
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 6), MAT.neonCyan);
      lamp.position.set(x, 6.1, startZ + d);
      seg.add(lamp);
    });
  }

  roadGroup.add(seg);
  roadSegments.set(startZ, seg);
}

function updateRoad() {
  const segLen = CFG.road.segLen;
  const startZ = Math.floor((playerZ - 100) / segLen) * segLen;
  const endZ = playerZ + segLen * 5;

  for (let z = startZ; z < endZ; z += segLen) {
    if (!roadSegments.has(z)) buildRoadSegment(z);
  }

  for (const [z, seg] of roadSegments) {
    if (z < startZ - segLen) {
      roadGroup.remove(seg);
      seg.traverse(c => { if (c.isMesh) { c.geometry.dispose(); if (c.material && !isSharedMat(c.material)) c.material.dispose(); } });
      roadSegments.delete(z);
    }
  }
}

function isSharedMat(mat) {
  return Object.values(MAT).includes(mat);
}

/* ═══════════════════════════════════════════
   PARTICLES
═══════════════════════════════════════════ */
function spawnParticles(pos, color, count = 8, spread = 2, speed = 5) {
  const available = Math.max(0, Q().maxPt - particleData.size);
  const n = Math.min(count, available);
  for (let i = 0; i < n; i++) {
    let m;
    try { m = particlePool.get(); } catch(e) { break; }
    m.material.color.setHex(color);
    m.position.copy(pos);
    const v = new THREE.Vector3(
      (Math.random() - 0.5) * spread * speed,
      Math.random() * speed * 0.6,
      (Math.random() - 0.5) * spread * speed
    );
    m.material.opacity = 1;
    m.scale.setScalar(0.5 + Math.random() * 0.6);
    const life = 0.28 + Math.random() * 0.38;
    particleData.set(m, { v, life, age: 0 });
  }
}

function updateParticles(dt) {
  for (const [m, d] of particleData) {
    d.age += dt;
    if (d.age >= d.life) { particleData.delete(m); particlePool.release(m); continue; }
    m.position.addScaledVector(d.v, dt);
    d.v.y -= 9.8 * dt;
    const a = 1 - d.age / d.life;
    m.material.opacity = a;
    m.scale.setScalar(Math.max(0.01, a * 0.6));
  }
}

/* ═══════════════════════════════════════════
   SKID MARKS
═══════════════════════════════════════════ */
let skidTimer = 0;

function updateSkids(dt) {
  if (!Q().skid) return;
  skidTimer += dt;
  if (S.drifting && skidTimer > 0.1) {
    skidTimer = 0;
    for (let side of [-1, 1]) {
      let m;
      try { m = skidPool.get(); } catch(e) { continue; }
      m.position.set(playerX + side * 0.88, 0.012, playerZ - 1.2);
      m.rotation.z = playerMesh ? playerMesh.rotation.y : 0;
      m.material.opacity = 0.38;
      skidData.set(m, { age: 0, life: 4.5 });
    }
  }
  for (const [m, d] of skidData) {
    d.age += dt;
    if (d.age >= d.life) { skidData.delete(m); skidPool.release(m); continue; }
    m.material.opacity = Math.max(0, 0.38 * (1 - d.age / d.life));
  }
}

   RAIN
═══════════════════════════════════════════ */
let rainMesh = null;

function initRain() {
  if (rainMesh) { scene.remove(rainMesh); rainMesh.geometry.dispose(); rainMesh = null; }
  const cnt = Q().rainPts;
  if (!cnt) return;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(cnt * 3);
  for (let i = 0; i < cnt; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 80;
    pos[i * 3 + 1] = Math.random() * 42;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 80;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  rainMesh = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x8899bb, size: 0.08, transparent: true, opacity: 0.4 }));
  scene.add(rainMesh);
}

function updateRain(dt) {
  if (!rainMesh) return;
  const active = S.weather === 'rain' || S.weather === 'storm';
  rainMesh.visible = active;
  if (!active) return;
  const arr = rainMesh.geometry.attributes.position.array;
  const cnt = arr.length / 3;
  const speed = S.weather === 'storm' ? 40 : 26;
  for (let i = 0; i < cnt; i++) {
    arr[i * 3 + 1] -= speed * dt;
    if (arr[i * 3 + 1] < 0) {
      arr[i * 3] = playerX + (Math.random() - 0.5) * 80;
      arr[i * 3 + 1] = 38 + Math.random() * 8;
      arr[i * 3 + 2] = playerZ + (Math.random() - 0.5) * 80;
    }
  }
  rainMesh.geometry.attributes.position.needsUpdate = true;
}

const input = { left: false, right: false, gas: false, brake: false, drift: false, nitro: false };

document.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') input.left  = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  if (e.code === 'ArrowUp'    || e.code === 'KeyW') input.gas   = true;
  if (e.code === 'ArrowDown'  || e.code === 'KeyS') input.brake = true;
  if (e.code === 'Space') { input.drift = true; e.preventDefault(); }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.nitro = true;
  if (e.code === 'Escape') togglePause();
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') input.left  = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
  if (e.code === 'ArrowUp'    || e.code === 'KeyW') input.gas   = false;
  if (e.code === 'ArrowDown'  || e.code === 'KeyS') input.brake = false;
  if (e.code === 'Space') input.drift = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.nitro = false;
});

function bindTouch(id, key) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', e => { e.preventDefault(); input[key] = true; }, { passive: false });
  el.addEventListener('touchend',   e => { e.preventDefault(); input[key] = false; }, { passive: false });
  el.addEventListener('touchcancel', () => { input[key] = false; });
}
bindTouch('sL', 'left');
bindTouch('sR', 'right');
bindTouch('bBr', 'brake');
bindTouch('dBr', 'drift');
bindTouch('nBr', 'nitro');

// Left/right also provides gas on touch
['sL', 'sR'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', () => { input.gas = true; });
  el.addEventListener('touchend',   () => { if (!input.left && !input.right) input.gas = false; });
});

/* ═══════════════════════════════════════════
   SMOOTH INPUT STATE
═══════════════════════════════════════════ */
const SI = { left: 0, right: 0, gas: 0, brake: 0 };

/* ═══════════════════════════════════════════
   PLAYER PHYSICS
═══════════════════════════════════════════ */
let nitroWasOff = true;

function updatePlayer(dt) {
  const speedStat = carStat('spd');
  const hanStat = carStat('han');
  const armStat = carStat('arm');
  const nitStat = carStat('nit');
  const maxSpd = CFG.player.maxSpd * speedStat;

  // Smooth input
  const r = dt * 9;
  SI.left  = THREE.MathUtils.lerp(SI.left,  input.left  ? 1 : 0, r);
  SI.right = THREE.MathUtils.lerp(SI.right, input.right ? 1 : 0, r);
  SI.gas   = THREE.MathUtils.lerp(SI.gas,   input.gas   ? 1 : 0, r * 0.75);
  SI.brake = THREE.MathUtils.lerp(SI.brake, input.brake ? 1 : 0, r);

  // Acceleration
  S.speed += (SI.gas * CFG.player.acc * speedStat - CFG.player.drag * S.speed * 0.12) * dt;
  if (SI.brake > 0.08) S.speed -= CFG.player.brk * SI.brake * dt;
  S.speed = Math.max(0, Math.min(S.speed, maxSpd));

  // Nitro
  const nitroOn = input.nitro && S.nitro > 0;
  if (nitroOn) {
    S.speed += CFG.nitro.boost * nitStat * dt;
    S.speed = Math.min(S.speed, maxSpd * 1.4);
    S.nitro -= CFG.nitro.drain * dt;
    S.nitro = Math.max(0, S.nitro);
    if (Math.random() < 0.3) {
      spawnParticles(new THREE.Vector3(playerX + (Math.random() - 0.5) * 0.5, 0.3, playerZ - 2.3), 0x0066ff, 1, 0.3, 2);
    }
    if (nitroWasOff) { playNitroSound(); nitroWasOff = false; }
  } else {
    S.nitro = Math.min(100, S.nitro + CFG.nitro.regen * dt);
    nitroWasOff = true;
  }

  // Exhaust flames
  if (playerMesh && playerMesh.userData.exL) {
    playerMesh.userData.exL.visible = nitroOn;
    playerMesh.userData.exR.visible = nitroOn;
    if (nitroOn) {
      const f = 0.75 + Math.random() * 0.55;
      playerMesh.userData.exL.scale.set(f, f * 1.4, f);
      playerMesh.userData.exR.scale.set(f, f * 1.4, f);
    }
  }

  // Steering
  const isDrifting = input.drift;
  const steerStr = CFG.player.steer * hanStat * (isDrifting ? CFG.player.driftSteerMul : 1);
  S.lateralV += (SI.right - SI.left) * steerStr * dt;
  const latDamp = isDrifting ? CFG.player.driftLatDamp : CFG.player.latDamp;
  S.lateralV -= S.lateralV * latDamp * dt;
  S.lateralV = Math.max(-26, Math.min(26, S.lateralV));

  // Drift scoring
  S.drifting = isDrifting && Math.abs(S.lateralV) > 2.2 && S.speed > 18;
  if (S.drifting) {
    S.driftTimer += dt;
    addXP(dt * 2.5);
    S.score += Math.floor(CFG.combo.driftScore * S.combo * dt);
  } else {
    if (S.driftTimer > 0.5) notify('DRIFT ' + S.driftTimer.toFixed(1) + 's', '#ff6600');
    S.driftTimer = 0;
  }

  // Move player
  playerX += S.lateralV * dt;
  playerZ += S.speed * dt;

  // Wall collisions
  const halfW = CFG.road.width / 2 - 1.1;
  if (playerX < -halfW) {
    playerX = -halfW;
    S.lateralV *= -0.25;
    dealDamage(CFG.hp.barrierHit * dt * 5 / armStat, true);
    S.shakeAmt = 0.28;
  }
  if (playerX > halfW) {
    playerX = halfW;
    S.lateralV *= -0.25;
    dealDamage(CFG.hp.barrierHit * dt * 5 / armStat, true);
    S.shakeAmt = 0.28;
  }

  // Update mesh transform
  if (playerMesh) {
    playerMesh.position.set(
      playerX,
      Math.sin(S.time * 11) * 0.018 * (S.speed / Math.max(1, maxSpd)),
      playerZ
    );
    playerMesh.rotation.y = THREE.MathUtils.lerp(playerMesh.rotation.y, -S.lateralV * 0.028, dt * 7);
    playerMesh.rotation.z = THREE.MathUtils.lerp(playerMesh.rotation.z, S.drifting ? S.lateralV * 0.011 : 0, dt * 5);
  }

  // Stats
  S.dist = Math.floor(playerZ);
  if (S.speed > S.topSpeed) S.topSpeed = S.speed;
  if (S.invTimer > 0) S.invTimer -= dt;

  // Score from driving
  S.score += Math.floor(S.speed * 0.008 * S.combo * dt);
}

function dealDamage(amt, isBarrier = false) {
  const arm = carStat('arm');
  S.hp -= amt / arm;
  S.invTimer = 0.35;
  if (amt > 5) {
    S.shakeAmt = Math.min(0.75, amt * 0.035);
    showDamageFlash();
    playCrashSound();
    spawnParticles(new THREE.Vector3(playerX, 1, playerZ), 0xff4400, 8, 2, 4);
    if (amt > 14) {
      S.slowTarget = 0.28;
      S.slowTimer = 0.6;
      document.getElementById('smOv').classList.add('sh');
    }
  }
  if (S.hp <= 0) { S.hp = 0; triggerGameOver(); }
}

/* ═══════════════════════════════════════════
   POLICE AI
═══════════════════════════════════════════ */
let policeSpawnTimer = 0;

function updatePolice(dt) {
  policeSpawnTimer += dt;
  const maxCars = Math.min(Q().maxPol, Math.floor(S.heat) + 1);

  if (policePool.size() < maxCars && policeSpawnTimer > 1.4) {
    policeSpawnTimer = 0;
    const m = policePool.get();
    const lane = Math.floor(Math.random() * CFG.road.lanes);
    const laneW = CFG.road.width / CFG.road.lanes;
    const x = -CFG.road.width / 2 + laneW / 2 + lane * laneW;
    m.position.set(x, 0, playerZ - CFG.police.spawnDist - Math.random() * 28);

    const roles = ['chaser', 'chaser', 'blocker', 'flanker'];
    const role = S.heat >= 3 ? roles[Math.floor(Math.random() * roles.length)] : 'chaser';
    policeData.set(m, { speed: CFG.police.baseSpd, aggression: 0.28 + S.heat * 0.12, role, nmCooldown: 0 });
  }

  for (const [m, d] of policeData) {
    const targetSpeed = S.speed * (0.62 + d.aggression * 0.52) + 4;
    d.speed = THREE.MathUtils.lerp(d.speed, targetSpeed, dt * 1.6);
    d.speed = Math.max(6, d.speed);

    m.position.z += d.speed * dt;
    const dx = playerX - m.position.x;

    if (d.role === 'blocker' && m.position.z < playerZ + 28 && m.position.z > playerZ) {
      d.speed = Math.max(d.speed, S.speed * 1.05);
      m.position.x += dx * dt * 2.8;
    } else if (d.role === 'flanker') {
      const targetX = playerX + (dx > 0 ? 4 : -4);
      m.position.x += (targetX - m.position.x) * dt * 1.8;
    } else {
      m.position.x += dx * d.aggression * dt * 2.2;
    }

    const halfW = CFG.road.width / 2 - 1.1;
    m.position.x = Math.max(-halfW, Math.min(halfW, m.position.x));
    m.rotation.y = -dx * 0.018;

    // Siren flash
    if (m.userData.sr && m.userData.sb) {
      const flash = Math.sin(S.time * 10) > 0;
      m.userData.sr.material.color.setHex(flash ? 0xff0000 : 0x330000);
      m.userData.sb.material.color.setHex(flash ? 0x0000ff : 0x000033);
    }

    if (d.nmCooldown > 0) d.nmCooldown -= dt;

    // Despawn
    if (m.position.z < playerZ - 140 || m.position.z > playerZ + 90) {
      policeData.delete(m);
      policePool.release(m);
    }
  }
}

/* ═══════════════════════════════════════════
   TRAFFIC AI
═══════════════════════════════════════════ */
let trafficSpawnTimer = 0;

function updateTraffic(dt) {
  trafficSpawnTimer += dt;
  if (trafficPool.size() < Q().maxTrf && trafficSpawnTimer > 0.65) {
    trafficSpawnTimer = 0;
    const m = trafficPool.get();
    const lane = Math.floor(Math.random() * CFG.road.lanes);
    const laneW = CFG.road.width / CFG.road.lanes;
    const x = -CFG.road.width / 2 + laneW / 2 + lane * laneW;
    const ahead = Math.random() > 0.3;
    m.position.set(x, 0, ahead ? playerZ + 50 + Math.random() * 95 : playerZ - 22 - Math.random() * 28);
    trafficData.set(m, { speed: CFG.traffic.baseSpd * (0.5 + Math.random() * 0.65), lane, laneTimer: 4 + Math.random() * 7, nmCooldown: 0 });
  }

  for (const [m, d] of trafficData) {
    m.position.z += d.speed * dt;
    d.laneTimer -= dt;
    if (d.laneTimer <= 0 && Math.random() < 0.14) {
      d.laneTimer = 5 + Math.random() * 8;
      d.lane = Math.max(0, Math.min(CFG.road.lanes - 1, d.lane + (Math.random() > 0.5 ? 1 : -1)));
    }
    const laneW = CFG.road.width / CFG.road.lanes;
    const targetX = -CFG.road.width / 2 + laneW / 2 + d.lane * laneW;
    m.position.x += (targetX - m.position.x) * dt * 1.8;

    if (d.nmCooldown > 0) d.nmCooldown -= dt;

    if (m.position.z < playerZ - 75 || m.position.z > playerZ + 185) {
      trafficData.delete(m);
      trafficPool.release(m);
    }
  }
}

/* ═══════════════════════════════════════════
   COINS & REPAIRS
═══════════════════════════════════════════ */
let coinSpawnTimer = 0, repairSpawnTimer = 0;

function updatePickups(dt) {
  coinSpawnTimer += dt;
  repairSpawnTimer += dt;

  if (coinSpawnTimer > 0.45 && coinPool.size() < 14) {
    coinSpawnTimer = 0;
    const m = coinPool.get();
    const lane = Math.floor(Math.random() * CFG.road.lanes);
    const laneW = CFG.road.width / CFG.road.lanes;
    m.position.set(-CFG.road.width / 2 + laneW / 2 + lane * laneW, 1.05, playerZ + 72 + Math.random() * 95);
    coinData.set(m, {});
  }

  if (repairSpawnTimer > 9 && repairPool.size() < 3 && S.hp < 75) {
    repairSpawnTimer = 0;
    const m = repairPool.get();
    const lane = Math.floor(Math.random() * CFG.road.lanes);
    const laneW = CFG.road.width / CFG.road.lanes;
    m.position.set(-CFG.road.width / 2 + laneW / 2 + lane * laneW, 0.82, playerZ + 95 + Math.random() * 75);
    repairData.set(m, {});
  }

  for (const [m] of coinData) {
    m.rotation.y += dt * 2.8;
    m.position.y = 1.05 + Math.sin(S.time * 2.8 + m.position.z) * 0.18;
    if (m.position.z < playerZ - 32) { coinData.delete(m); coinPool.release(m); }
  }

  for (const [m] of repairData) {
    m.rotation.y += dt * 2.2;
    m.position.y = 0.82 + Math.sin(S.time * 2.1 + m.position.z) * 0.14;
    if (m.position.z < playerZ - 32) { repairData.delete(m); repairPool.release(m); }
  }
}

/* ═══════════════════════════════════════════
   ROADBLOCKS
═══════════════════════════════════════════ */
let roadblockTimer = 0;

function updateRoadblocks(dt) {
  roadblockTimer += dt;
  const interval = Math.max(9, 32 - S.heat * 4);

  if (roadblockTimer > interval && S.heat >= 2 && roadblockPool.size() < 8) {
    roadblockTimer = 0;
    const nb = 2 + Math.floor(Math.random() * 2);
    const startLane = Math.floor(Math.random() * (CFG.road.lanes - nb + 1));
    const laneW = CFG.road.width / CFG.road.lanes;
    const bz = playerZ + 85 + Math.random() * 55;
    for (let i = 0; i < nb; i++) {
      const m = roadblockPool.get();
      m.position.set(-CFG.road.width / 2 + laneW / 2 + (startLane + i) * laneW, 0.58, bz);
      m.rotation.y = (Math.random() - 0.5) * 0.3;
      roadblockData.set(m, {});
    }
  }

  for (const [m] of roadblockData) {
    if (m.position.z < playerZ - 45) { roadblockData.delete(m); roadblockPool.release(m); }
  }
}

/* ═══════════════════════════════════════════
   COLLISION DETECTION
═══════════════════════════════════════════ */
function checkCollisions() {
  if (S.invTimer > 0) return;

  // Police
  for (const [m, d] of policeData) {
    if (Math.abs(playerX - m.position.x) < 1.8 && Math.abs(playerZ - m.position.z) < 2.1) {
      dealDamage(CFG.hp.polHit);
      S.speed *= 0.8;
      m.position.x += (m.position.x - playerX) * 0.5;
      d.speed *= 0.6;
    }
  }

  // Traffic
  for (const [m, d] of trafficData) {
    if (Math.abs(playerX - m.position.x) < 1.8 && Math.abs(playerZ - m.position.z) < 2.1) {
      dealDamage(CFG.hp.trfHit);
      S.speed *= 0.76;
      m.position.z += 3.5;
      d.speed *= 0.4;
      spawnParticles(new THREE.Vector3(playerX, 1, playerZ), 0xff8800, 8, 1.5, 4);
    }
  }

  // Roadblocks
  for (const [m] of roadblockData) {
    if (Math.abs(playerX - m.position.x) < 1.5 && Math.abs(playerZ - m.position.z) < 1.1) {
      if (input.nitro && S.nitro > 5) {
        spawnParticles(m.position.clone(), 0xff4400, 14, 2, 6);
        roadblockData.delete(m);
        roadblockPool.release(m);
        S.score += 220;
        addXP(28);
        notify('SMASHED! +220', '#ff6600');
      } else {
        dealDamage(CFG.hp.roadblockHit);
        S.speed *= 0.38;
        S.lateralV *= -0.45;
        spawnParticles(m.position.clone(), 0xff4400, 8, 1.5, 4);
        roadblockData.delete(m);
        roadblockPool.release(m);
      }
    }
  }

  // Coins
  for (const [m] of coinData) {
    if (Math.abs(playerX - m.position.x) < 1.95 && Math.abs(playerZ - m.position.z) < 2.2) {
      S.coins++;
      S.totalCoins++;
      addXP(CFG.coin.xpAmt);
      playCoinSound();
      spawnParticles(m.position.clone(), 0xffaa00, 5, 1, 3);
      coinData.delete(m);
      coinPool.release(m);
    }
  }

  // Repairs
  for (const [m] of repairData) {
    if (Math.abs(playerX - m.position.x) < 1.95 && Math.abs(playerZ - m.position.z) < 2.2) {
      S.hp = Math.min(100, S.hp + CFG.coin.healAmt);
      addXP(10);
      notify('REPAIRED +' + CFG.coin.healAmt + ' HP', '#00ff44');
      spawnParticles(m.position.clone(), 0x00ff44, 8, 1, 4);
      repairData.delete(m);
      repairPool.release(m);
    }
  }
}

/* ═══════════════════════════════════════════
   NEAR MISS DETECTION
═══════════════════════════════════════════ */
function checkNearMisses() {
  const nearDist = 3.1, collDist = 1.8, zRange = 3.2;
  const all = [...policeData.entries(), ...trafficData.entries()];
  for (const [m, d] of all) {
    const dx = Math.abs(playerX - m.position.x);
    const dz = Math.abs(playerZ - m.position.z);
    if (dz < zRange && dx > collDist && dx < nearDist) {
      if (!d.nmCooldown || d.nmCooldown <= 0) {
        S.combo += CFG.combo.nearMissBonus;
        S.comboTimer = 0;
        const bonus = Math.floor(CFG.combo.nearMissScore * S.combo);
        S.score += bonus;
        addXP(14);
        notify('NEAR MISS +' + bonus, '#00fff0');
        spawnParticles(new THREE.Vector3(playerX, 1.5, playerZ), 0x00fff0, 5, 1, 3);
        d.nmCooldown = 2;
      }
    }
  }
}

/* ═══════════════════════════════════════════
   COMBO SYSTEM
═══════════════════════════════════════════ */
function updateCombo(dt) {
  S.comboTimer += dt;
  if (S.comboTimer > CFG.combo.resetDelay) {
    S.combo = Math.max(1, S.combo - CFG.combo.decay * dt);
  }
  if (S.combo > S.maxCombo) S.maxCombo = S.combo;

  const cdEl = document.getElementById('cdB');
  if (S.combo > 1.1) {
    cdEl.classList.add('sh');
    document.getElementById('cdM').textContent = 'x' + S.combo.toFixed(1);
  } else {
    cdEl.classList.remove('sh');
  }

  const drEl = document.getElementById('drB');
  if (S.drifting) {
    drEl.classList.add('sh');
    drEl.textContent = 'DRIFT ' + S.driftTimer.toFixed(1) + 's';
  } else {
    drEl.classList.remove('sh');
  }
}

/* ═══════════════════════════════════════════
   WEATHER SYSTEM
═══════════════════════════════════════════ */
let lightningTimer = 10, lightningFlash = 0;

function updateWeather(dt) {
  S.weatherTimer += dt;
  if (S.weatherTimer > 28) {
    S.weatherTimer = 0;
    const weathers = ['clear', 'clear', 'clear', 'rain', 'rain', 'storm', 'fog'];
    S.weather = weathers[Math.floor(Math.random() * weathers.length)];
    if (S.weather !== 'clear') notify(S.weather.toUpperCase() + ' INCOMING', '#8899bb');
  }

  // Fog density
  let targetDensity = 0.007;
  if (S.weather === 'fog')   targetDensity = 0.020;
  if (S.weather === 'rain')  targetDensity = 0.010;
  if (S.weather === 'storm') targetDensity = 0.013;
  scene.fog.density = THREE.MathUtils.lerp(scene.fog.density, targetDensity, dt * 0.45);

  // Lighting
  const targetAmbient = S.weather === 'fog' ? 0.5 : S.weather === 'storm' ? 0.35 : 1.8;
  ambLight.intensity = THREE.MathUtils.lerp(ambLight.intensity, targetAmbient + lightningFlash * 2.5, dt * 3.5);

  // Lightning
  if (S.weather === 'storm') {
    lightningTimer -= dt;
    if (lightningTimer <= 0) {
      lightningTimer = 5 + Math.random() * 14;
      lightningFlash = 1;
    }
  }
  if (lightningFlash > 0) lightningFlash = Math.max(0, lightningFlash - dt * 6);

  // Heat increases over time
  S.heat = Math.min(CFG.heat.max, S.heat + CFG.heat.rate * dt);
  S.time += dt;
}

/* ═══════════════════════════════════════════
   CAMERA FOLLOW — always positioned behind car
═══════════════════════════════════════════ */
function updateCamera(dt) {
  const maxSpd = CFG.player.maxSpd * carStat('spd');
  const speedRatio = Math.min(1, S.speed / Math.max(1, maxSpd));

  // Follow position
  const followDist = 12 + speedRatio * 5;
  const followHeight = 4.5 + speedRatio * 2.5;

  const targetPos = new THREE.Vector3(
    playerX * 0.32,
    playerMesh ? playerMesh.position.y + followHeight : followHeight,
    playerZ - followDist
  );

  camera.position.lerp(targetPos, dt * 4);

  // Camera shake
  if (S.shakeAmt > 0.01) {
    camera.position.x += (Math.random() - 0.5) * S.shakeAmt;
    camera.position.y += (Math.random() - 0.5) * S.shakeAmt * 0.35;
    S.shakeAmt *= 0.85;
  } else {
    S.shakeAmt = 0;
  }

  // Look ahead
  const lookTarget = new THREE.Vector3(playerX * 0.5, 1.2, playerZ + 5 + speedRatio * 5);
  camera.lookAt(lookTarget);

  // FOV
  const targetFOV = 62 + speedRatio * 20;
  camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, dt * 2.5);
  camera.updateProjectionMatrix();
}

/* ═══════════════════════════════════════════
   SLOW MOTION
═══════════════════════════════════════════ */
function updateSlowMo(rawDt) {
  if (S.slowTimer > 0) {
    S.slowTimer -= rawDt;
    if (S.slowTimer <= 0) {
      S.slowTarget = 1;
      document.getElementById('smOv').classList.remove('sh');
    }
  }
  S.slowScale = THREE.MathUtils.lerp(S.slowScale, S.slowTarget, rawDt * 5);
}

/* ═══════════════════════════════════════════
   HUD UPDATE
═══════════════════════════════════════════ */
const spdCtx = document.getElementById('spdC').getContext('2d');
const mmCtx  = document.getElementById('mmC').getContext('2d');

function updateHUD() {
  document.getElementById('hDst').textContent = S.dist;
  document.getElementById('hScr').textContent = S.score;
  document.getElementById('hCns').textContent = S.coins;
  document.getElementById('hpB').style.width  = Math.max(0, S.hp) + '%';
  document.getElementById('niB').style.width  = S.nitro + '%';
  document.getElementById('xpB').style.width  = S.level > 0 ? (S.xp / xpForLevel(S.level)) * 100 + '%' : '0%';
  document.getElementById('hLv').textContent  = S.level;

  let heatHTML = '';
  for (let i = 1; i <= 5; i++) {
    heatHTML += `<span class="${i <= Math.floor(S.heat) ? 'a' : ''}">★</span>`;
  }
  document.getElementById('hHt').innerHTML = heatHTML;

  document.getElementById('nVig').classList.toggle('sh', input.nitro && S.nitro > 0);

  drawSpeedometer();
  drawMinimap();
}

function drawSpeedometer() {
  const c = spdCtx, w = 130, h = 80;
  c.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h - 4, r = 54;
  const kmh = Math.floor(S.speed * 3.6);
  const maxKmh = Math.floor(CFG.player.maxSpd * carStat('spd') * 3.6);
  const ratio = Math.min(1, kmh / Math.max(1, maxKmh));

  c.beginPath(); c.arc(cx, cy, r, Math.PI, 2 * Math.PI);
  c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 5; c.stroke();

  const grad = c.createLinearGradient(cx - r, cy, cx + r, cy);
  grad.addColorStop(0, '#00fff0'); grad.addColorStop(0.55, '#ffaa00'); grad.addColorStop(1, '#ff0044');
  const endAngle = Math.PI + Math.PI * ratio;
  c.beginPath(); c.arc(cx, cy, r, Math.PI, endAngle);
  c.strokeStyle = grad; c.lineWidth = 5; c.stroke();

  c.beginPath(); c.moveTo(cx, cy);
  c.lineTo(cx + Math.cos(endAngle) * (r - 7), cy + Math.sin(endAngle) * (r - 7));
  c.strokeStyle = '#ff0066'; c.lineWidth = 2; c.stroke();

  c.fillStyle = '#00fff0'; c.font = '900 20px Orbitron'; c.textAlign = 'center';
  c.fillText(kmh, cx, cy - 15);
  c.fillStyle = 'rgba(255,255,255,0.32)'; c.font = '600 8px Orbitron';
  c.fillText('KM/H', cx, cy - 4);
}

function drawMinimap() {
  const c = mmCtx, w = 100, h = 100;
  c.clearRect(0, 0, w, h);
  c.fillStyle = 'rgba(5,5,20,0.72)'; c.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2, rw = 26;

  // Road strip
  c.fillStyle = 'rgba(30,30,50,0.5)'; c.fillRect(cx - rw / 2, 0, rw, h);

  // Player dot
  const px = cx + (playerX / (CFG.road.width / 2)) * (rw / 2);
  c.fillStyle = '#00ff88'; c.beginPath(); c.arc(px, cy, 3.2, 0, Math.PI * 2); c.fill();

  // Police dots
  for (const [m] of policeData) {
    const rx = cx + (m.position.x / (CFG.road.width / 2)) * (rw / 2);
    const rz = cy - (m.position.z - playerZ) * 0.24;
    if (rz > 2 && rz < h - 2) {
      c.fillStyle = '#ff0044'; c.beginPath(); c.arc(rx, rz, 2.2, 0, Math.PI * 2); c.fill();
    }
  }

  // Traffic dots
  for (const [m] of trafficData) {
    const rx = cx + (m.position.x / (CFG.road.width / 2)) * (rw / 2);
    const rz = cy - (m.position.z - playerZ) * 0.24;
    if (rz > 2 && rz < h - 2) {
      c.fillStyle = '#ffaa00'; c.beginPath(); c.arc(rx, rz, 1.6, 0, Math.PI * 2); c.fill();
    }
  }

  // Roadblock marks
  for (const [m] of roadblockData) {
    const rx = cx + (m.position.x / (CFG.road.width / 2)) * (rw / 2);
    const rz = cy - (m.position.z - playerZ) * 0.24;
    if (rz > 2 && rz < h - 2) {
      c.fillStyle = '#ff4400'; c.fillRect(rx - 2, rz - 1, 4, 2);
    }
  }

  c.strokeStyle = 'rgba(0,255,240,0.18)'; c.lineWidth = 1; c.strokeRect(0, 0, w, h);
}

/* ═══════════════════════════════════════════
   NOTIFICATIONS
═══════════════════════════════════════════ */
function notify(text, color = '#00fff0') {
  const el = document.createElement('div');
  el.className = 'nf';
  el.style.color = color;
  el.textContent = text;
  const area = document.getElementById('nArea');
  area.appendChild(el);
  requestAnimationFrame(() => el.classList.add('sh'));
  setTimeout(() => {
    el.classList.add('fd');
    el.classList.remove('sh');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 280);
  }, 1200);
}

function showDamageFlash() {
  const el = document.getElementById('dFlash');
  el.classList.add('sh');
  setTimeout(() => el.classList.remove('sh'), 140);
}

/* ═══════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════ */
let audioCtx = null, engineOsc = null, engineGain = null, sirenOsc1 = null, sirenOsc2 = null, sirenGain = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 80;
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 420;
    engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
    engineOsc.start();

    sirenOsc1 = audioCtx.createOscillator(); sirenOsc1.type = 'sine'; sirenOsc1.frequency.value = 600;
    sirenOsc2 = audioCtx.createOscillator(); sirenOsc2.type = 'sine'; sirenOsc2.frequency.value = 800;
    sirenGain = audioCtx.createGain(); sirenGain.gain.value = 0;
    sirenOsc1.connect(sirenGain); sirenOsc2.connect(sirenGain); sirenGain.connect(audioCtx.destination);
    sirenOsc1.start(); sirenOsc2.start();
  } catch(e) {}
}

function updateAudio() {
  if (!audioCtx || S.vol <= 0) return;
  const ratio = S.speed / Math.max(1, CFG.player.maxSpd * carStat('spd'));
  engineOsc.frequency.value = 60 + ratio * 220;
  engineGain.gain.value = Math.min(0.065, ratio * 0.082) * S.vol;

  let closestPoliceDist = 999;
  for (const [m] of policeData) {
    const d = Math.hypot(m.position.x - playerX, m.position.z - playerZ);
    if (d < closestPoliceDist) closestPoliceDist = d;
  }
  sirenGain.gain.value = Math.max(0, 1 - closestPoliceDist / 55) * 0.045 * S.vol;
  const wave = Math.sin(S.time * 3) * 200;
  sirenOsc1.frequency.value = 600 + wave;
  sirenOsc2.frequency.value = 800 - wave;
}

function playCrashSound() {
  if (!audioCtx || S.vol <= 0) return;
  try {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.14, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.038));
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain(); g.gain.value = 0.11 * S.vol;
    src.connect(g); g.connect(audioCtx.destination); src.start();
  } catch(e) {}
}

function playCoinSound() {
  if (!audioCtx || S.vol <= 0) return;
  try {
    const o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = 1300;
    const g = audioCtx.createGain(); g.gain.value = 0.055 * S.vol;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.11);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.11);
  } catch(e) {}
}

function playNitroSound() {
  if (!audioCtx || S.vol <= 0) return;
  try {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.28, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.18 * Math.exp(-i / (audioCtx.sampleRate * 0.1));
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700;
    const g = audioCtx.createGain(); g.gain.value = 0.075 * S.vol;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start();
  } catch(e) {}
}

/* ═══════════════════════════════════════════
   SCREEN MANAGEMENT
═══════════════════════════════════════════ */
function showScreen(id) {
  ['menuOv', 'hudOv', 'garOv', 'setOv', 'paOv', 'goOv'].forEach(oid => {
    const el = document.getElementById(oid);
    el.classList.remove('on');
    const sc = el.querySelector('.sc');
    if (sc) sc.classList.remove('on');
  });
  const el = document.getElementById(id);
  if (el) {
    el.classList.add('on');
    const sc = el.querySelector('.sc');
    if (sc) sc.classList.add('on');
  }
  const touch = document.getElementById('tCtrl');
  touch.classList.toggle('on', id === 'hudOv' && ('ontouchstart' in window));
}

function startGame() {
  initAudio();
  resetGame();
  S.screen = 'playing';
  showScreen('hudOv');
}

function resetGame() {
  // Reset state
  Object.assign(S, {
    score: 0, dist: 0, coins: 0, hp: 100, nitro: 100, heat: 1,
    speed: 0, lateralV: 0, topSpeed: 0, time: 0, weatherTimer: 0,
    weather: 'clear', invTimer: 0, shakeAmt: 0,
    combo: 1, comboTimer: 0, maxCombo: 1, driftTimer: 0, drifting: false,
    sessionXP: 0, slowScale: 1, slowTarget: 1, slowTimer: 0,
  });
  SI.left = SI.right = SI.gas = SI.brake = 0;
  playerX = 0; playerZ = 0;

  // Release all pools
  for (const [m] of policeData) { policePool.release(m); } policeData.clear();
  for (const [m] of trafficData) { trafficPool.release(m); } trafficData.clear();
  for (const [m] of coinData) { coinPool.release(m); } coinData.clear();
  for (const [m] of repairData) { repairPool.release(m); } repairData.clear();
  for (const [m] of particleData) { particlePool.release(m); } particleData.clear();
  for (const [m] of skidData) { skidPool.release(m); } skidData.clear();
  for (const [m] of roadblockData) { roadblockPool.release(m); } roadblockData.clear();

  // Clear road segments
  for (const [, seg] of roadSegments) {
    roadGroup.remove(seg);
    seg.traverse(c => { if (c.isMesh) { c.geometry.dispose(); if (c.material && !isSharedMat(c.material)) c.material.dispose(); } });
  }
  roadSegments.clear();

  // Remove old player mesh
  if (playerMesh) { scene.remove(playerMesh); playerMesh = null; }

  // Create new player mesh
  const carCfg = CARS[S.selectedCar];
  playerMesh = createCar(carCfg.col, 'player');
  playerMesh.position.set(0, 0, 0);
  scene.add(playerMesh);

  // Build initial road segments
  for (let z = -CFG.road.segLen; z < CFG.road.segLen * 4; z += CFG.road.segLen) {
    buildRoadSegment(z);
  }

  // Initial coins
  for (let i = 0; i < 5; i++) {
    const m = coinPool.get();
    const lane = Math.floor(Math.random() * CFG.road.lanes);
    const laneW = CFG.road.width / CFG.road.lanes;
    m.position.set(-CFG.road.width / 2 + laneW / 2 + lane * laneW, 1.05, 22 + i * 22);
    coinData.set(m, {});
  }

  // Reset timers
  policeSpawnTimer = trafficSpawnTimer = coinSpawnTimer = repairSpawnTimer = roadblockTimer = 0;
  lightningTimer = 10; lightningFlash = 0;

  // Reset camera
  camera.position.set(0, 7, -14);
  camera.fov = 62;
  camera.updateProjectionMatrix();

  scene.fog.density = 0.007;
}

function triggerGameOver() {
  S.screen = 'gameover';
  document.getElementById('tCtrl').classList.remove('on');
  setHighScore(S.score);
  document.getElementById('goD').textContent = S.dist;
  document.getElementById('goS').textContent = S.score;
  document.getElementById('goC').textContent = S.coins;
  document.getElementById('goSp').textContent = Math.floor(S.topSpeed * 3.6);
  document.getElementById('goCo').textContent = 'x' + S.maxCombo.toFixed(1);
  document.getElementById('goX').textContent = S.sessionXP;
  showScreen('goOv');
  spawnParticles(new THREE.Vector3(playerX, 1, playerZ), 0xff4400, 28, 3, 7);
  spawnParticles(new THREE.Vector3(playerX, 1.5, playerZ), 0xffaa00, 18, 2, 5);
  saveSave();
}

function togglePause() {
  if (S.screen === 'playing') {
    S.screen = 'paused';
    showScreen('paOv');
  } else if (S.screen === 'paused') {
    S.screen = 'playing';
    showScreen('hudOv');
  }
}

function goToMenu() {
  S.screen = 'menu';
  document.getElementById('tCtrl').classList.remove('on');
  document.getElementById('hsD').textContent = 'BEST: ' + getHighScore();
  showScreen('menuOv');
}

function openGarage() {
  S.screen = 'garage';
  document.getElementById('gCn').textContent = S.totalCoins;
  document.getElementById('gLv').textContent = S.level;
  renderGarage();
  showScreen('garOv');
}

function renderGarage() {
  const grid = document.getElementById('cGrd');
  grid.innerHTML = '';
  CARS.forEach(car => {
    const unlocked = S.unlocked.includes(car.id);
    const equipped = S.selectedCar === car.id;
    const card = document.createElement('div');
    card.className = 'cc' + (equipped ? ' sel' : '') + (!unlocked ? ' lk' : '');
    const hex = '#' + car.col.toString(16).padStart(6, '0');
    const stats = [
      { l: 'SPEED', v: car.spd, c: '#00fff0' },
      { l: 'HANDLE', v: car.han, c: '#ffaa00' },
      { l: 'ARMOR', v: car.arm, c: '#ff4477' },
      { l: 'NITRO', v: car.nit, c: '#0088ff' },
    ];
    card.innerHTML =
      `<div class="cn" style="color:${hex}">${car.name}</div>` +
      `<div class="cs" style="background:${hex}"></div>` +
      stats.map(s => `<div class="sr"><span class="sl">${s.l}</span><div class="sb"><div class="sf" style="width:${Math.min(100, s.v * 64)}%;background:${s.c}"></div></div></div>`).join('') +
      (!unlocked ? `<div class="cco">🔒 ${car.cost} coins</div>` : '') +
      (unlocked && !equipped ? `<button class="bt s eqb" data-id="${car.id}">EQUIP</button>` : '') +
      (equipped ? `<div class="ceq">EQUIPPED ✓</div>` : '') +
      (!unlocked ? `<button class="bt s g byb" data-id="${car.id}">BUY (${car.cost})</button>` : '');
    grid.appendChild(card);
  });

  grid.querySelectorAll('.eqb').forEach(b => b.addEventListener('click', () => {
    S.selectedCar = parseInt(b.dataset.id);
    saveSave();
    renderGarage();
  }));
  grid.querySelectorAll('.byb').forEach(b => b.addEventListener('click', () => {
    const id = parseInt(b.dataset.id);
    const car = CARS.find(c => c.id === id);
    if (S.totalCoins >= car.cost) {
      S.totalCoins -= car.cost;
      S.unlocked.push(id);
      S.selectedCar = id;
      saveSave();
      document.getElementById('gCn').textContent = S.totalCoins;
      renderGarage();
    }
  }));
}

function openSettings() {
  S.screen = 'settings';
  showScreen('setOv');
  updateSettingsUI();
}

function updateSettingsUI() {
  document.querySelectorAll('#qBg .bo').forEach(b => b.classList.toggle('av', parseInt(b.dataset.q) === QL));
  document.querySelectorAll('#vBg .bo').forEach(b => b.classList.toggle('av', parseFloat(b.dataset.v) === S.vol));
  document.querySelectorAll('#fBg .bo').forEach(b => b.classList.toggle('av', parseInt(b.dataset.f) === (S.showFps ? 1 : 0)));
}

document.querySelectorAll('#qBg .bo').forEach(b => b.addEventListener('click', () => {
  QL = parseInt(b.dataset.q);
  bloomPass.strength = Q().bloomStr;
  bloomPass.enabled = Q().bloom;
  saveSave(); updateSettingsUI();
  notify('Quality: ' + ['LOW', 'MED', 'HIGH'][QL], '#00fff0');
}));
document.querySelectorAll('#vBg .bo').forEach(b => b.addEventListener('click', () => {
  S.vol = parseFloat(b.dataset.v); saveSave(); updateSettingsUI();
}));
document.querySelectorAll('#fBg .bo').forEach(b => b.addEventListener('click', () => {
  S.showFps = parseInt(b.dataset.f) === 1;
  document.getElementById('fpsC').classList.toggle('sh', S.showFps);
  saveSave(); updateSettingsUI();
}));

/* ═══════════════════════════════════════════
   BUTTON BINDINGS
═══════════════════════════════════════════ */
document.getElementById('playB').addEventListener('click', startGame);
document.getElementById('garB').addEventListener('click', openGarage);
document.getElementById('setB').addEventListener('click', openSettings);
document.getElementById('gBk').addEventListener('click', goToMenu);
document.getElementById('sBk').addEventListener('click', goToMenu);
document.getElementById('paB').addEventListener('click', togglePause);
document.getElementById('rsB').addEventListener('click', togglePause);
document.getElementById('qtB').addEventListener('click', goToMenu);
document.getElementById('rtB').addEventListener('click', startGame);
document.getElementById('gmB').addEventListener('click', goToMenu);

/* ═══════════════════════════════════════════
   FPS COUNTER
═══════════════════════════════════════════ */
const fpsSamples = [];
let fpsTimer = 0;

function updateFPS(rawDt) {
  fpsTimer += rawDt;
  fpsSamples.push(rawDt);
  if (fpsTimer > 0.5) {
    fpsTimer = 0;
    while (fpsSamples.length > 30) fpsSamples.shift();
    const avg = fpsSamples.reduce((a, b) => a + b, 0) / fpsSamples.length;
    document.getElementById('fpsC').textContent = Math.round(1 / Math.max(0.001, avg)) + ' FPS';
  }
  document.getElementById('fpsC').classList.toggle('sh', S.showFps);
}

/* ═══════════════════════════════════════════
   INITIALIZATION
═══════════════════════════════════════════ */
initPools();
initRain();

// Build initial road so something visible on load
for (let z = -CFG.road.segLen; z < CFG.road.segLen * 3; z += CFG.road.segLen) {
  buildRoadSegment(z);
}

document.getElementById('hsD').textContent = 'BEST: ' + getHighScore();
document.getElementById('fpsC').classList.toggle('sh', S.showFps);
showScreen('menuOv');

// Visibility change → auto pause
document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.screen === 'playing') togglePause();
});

/* ═══════════════════════════════════════════
   MAIN GAME LOOP
═══════════════════════════════════════════ */
let lastTimestamp = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  const rawDt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
  lastTimestamp = timestamp;

  updateFPS(rawDt);
  updateSlowMo(rawDt);

  const dt = rawDt * S.slowScale;

  if (S.screen === 'playing') {
    updatePlayer(dt);
    updatePolice(dt);
    updateTraffic(dt);
    updatePickups(dt);
    updateRoadblocks(dt);
    updateParticles(dt);
    updateSkids(dt);
    updateRoad();
    updateWeather(dt);
    updateRain(dt);
    updateCamera(dt);
    checkCollisions();
    checkNearMisses();
    updateCombo(dt);
    updateHUD();
    updateAudio();
  } else if (S.screen === 'gameover') {
    updateParticles(rawDt);
    updateCamera(rawDt);
  }

  composer.render();
}

requestAnimationFrame(gameLoop);
</script>
