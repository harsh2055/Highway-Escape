<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Highway Escape v2</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050510;--fg:#e0e8ff;--ac:#00fff0;--ac2:#ff0066;
  --gold:#ffaa00;--xp:#00ff88;--card:rgba(8,10,25,0.92);
  --bdr:rgba(0,255,240,0.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Rajdhani',sans-serif;overflow:hidden;width:100vw;height:100vh;touch-action:none;user-select:none}
canvas#gc{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.ov{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
.ov.on{pointer-events:auto;display:block}
.sc{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;position:absolute;inset:0}
.sc.on{display:flex}
#menuSc{background:radial-gradient(ellipse at 50% 80%,rgba(0,255,240,0.06),transparent 65%),linear-gradient(180deg,rgba(5,5,16,.97),rgba(5,5,16,.99))}
.gt{font-family:'Orbitron',monospace;font-size:clamp(2rem,7vw,4.5rem);font-weight:900;letter-spacing:.08em;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.15em;animation:gp 3s ease-in-out infinite}
@keyframes gp{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.gs{font-family:'Orbitron',monospace;font-size:clamp(.55rem,1.6vw,.85rem);color:#4a5580;letter-spacing:.3em;margin-bottom:2em;text-transform:uppercase}
.bt{font-family:'Orbitron',monospace;font-size:clamp(.7rem,1.6vw,.95rem);font-weight:700;padding:.65em 2em;border:2px solid var(--ac);background:rgba(0,255,240,.07);color:var(--ac);cursor:pointer;letter-spacing:.1em;transition:all .18s;min-width:175px;text-align:center;margin:.3em}
.bt:hover,.bt:active{background:rgba(0,255,240,.18);box-shadow:0 0 22px rgba(0,255,240,.28);transform:scale(1.03)}
.bt.r{border-color:var(--ac2);color:var(--ac2);background:rgba(255,0,102,.07)}
.bt.r:hover{background:rgba(255,0,102,.18);box-shadow:0 0 22px rgba(255,0,102,.28)}
.bt.g{border-color:var(--gold);color:var(--gold);background:rgba(255,170,0,.07)}
.bt.g:hover{background:rgba(255,170,0,.18);box-shadow:0 0 22px rgba(255,170,0,.28)}
.bt.s{font-size:.65rem;padding:.4em 1em;min-width:auto}
.hs{font-family:'Orbitron',monospace;font-size:.78rem;color:var(--gold);margin-top:.8em;letter-spacing:.1em}
#hudOv{z-index:20;pointer-events:none;padding:8px}
.ht{display:flex;justify-content:space-between;align-items:flex-start;padding:0 3px;gap:6px;flex-wrap:wrap}
.hl{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.hr{display:flex;gap:5px;align-items:center}
.st{font-family:'Orbitron',monospace;font-size:clamp(.5rem,1.2vw,.72rem);color:var(--fg);display:flex;align-items:center;gap:4px;background:var(--card);padding:3px 7px;border-radius:3px;border:1px solid var(--bdr);white-space:nowrap}
.st .v{color:var(--ac);font-weight:700}
.hst{display:flex;gap:1px}
.hst span{font-size:.55rem;color:#222;display:inline-block;width:10px;text-align:center}
.hst span.a{color:var(--ac2);text-shadow:0 0 6px var(--ac2)}
.lb{font-family:'Orbitron',monospace;font-size:.58rem;color:var(--xp);background:var(--card);padding:2px 7px;border-radius:3px;border:1px solid rgba(0,255,136,.2)}
.hb{position:absolute;bottom:8px;left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 8px}
.gw{display:flex;flex-direction:column;align-items:center;gap:3px}
#spdC{width:130px;height:80px}
.brs{display:flex;flex-direction:column;gap:4px;min-width:130px}
.bw{position:relative;height:12px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden;border:1px solid var(--bdr)}
.bf{height:100%;border-radius:6px;transition:width .15s}
.bf.hp{background:linear-gradient(90deg,#ff0044,#ff4477)}
.bf.ni{background:linear-gradient(90deg,#0066ff,#00fff0)}
.bf.xp{background:linear-gradient(90deg,#00cc66,#00ff88)}
.bf.sh{background:linear-gradient(90deg,#aa00ff,#ff00ff)}
.bl{position:absolute;top:0;left:6px;font-size:.48rem;line-height:12px;font-family:'Orbitron',monospace;color:#fff;text-shadow:0 0 3px #000}
#mmC{width:100px;height:100px;border-radius:6px;border:1px solid var(--bdr);background:rgba(0,0,0,.5)}
#nArea{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:25}
.nf{font-family:'Orbitron',monospace;font-size:clamp(.75rem,1.8vw,1.1rem);font-weight:700;opacity:0;transform:translateY(10px) scale(.9);transition:all .22s ease-out;text-shadow:0 0 12px currentColor;white-space:nowrap}
.nf.sh{opacity:1;transform:translateY(0) scale(1)}
.nf.fd{opacity:0;transform:translateY(-20px) scale(1.08)}
#cdB{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-weight:900;pointer-events:none;text-align:center;opacity:0;transition:opacity .25s}
#cdB.sh{opacity:1}
.cm{font-size:clamp(1.8rem,5vw,3rem);color:var(--ac2);text-shadow:0 0 25px rgba(255,0,102,.6)}
.cl{font-size:clamp(.55rem,1.3vw,.8rem);color:var(--fg);letter-spacing:.2em;opacity:.7}
#drB{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-size:clamp(.75rem,1.8vw,1rem);color:var(--gold);text-shadow:0 0 12px rgba(255,170,0,.5);pointer-events:none;opacity:0;transition:opacity .18s}
#drB.sh{opacity:1}
/* Mission HUD */
#msnHud{position:absolute;top:52px;right:8px;background:var(--card);border:1px solid rgba(0,255,240,.25);border-radius:6px;padding:8px 10px;font-family:'Orbitron',monospace;font-size:.6rem;min-width:160px;pointer-events:none}
#msnHud.hid{display:none}
.msnT{color:var(--gold);font-size:.65rem;font-weight:700;margin-bottom:4px}
.msnD{color:#aabbcc;margin-bottom:6px;font-size:.58rem}
.msnPW{height:6px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
.msnP{height:100%;background:linear-gradient(90deg,var(--gold),#ff6600);border-radius:3px;transition:width .3s}
/* Biome indicator */
#biomeInd{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;font-size:.65rem;color:#8899bb;opacity:0;transition:opacity 1s;letter-spacing:.2em;text-transform:uppercase}
#biomeInd.sh{opacity:1}
/* Power-up display */
#puDisp{position:absolute;top:48px;left:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.puItem{font-family:'Orbitron',monospace;font-size:.58rem;background:var(--card);border:1px solid var(--bdr);border-radius:4px;padding:3px 8px;display:flex;gap:6px;align-items:center}
.puItem .pui{font-size:.85rem}
.puItem .put{color:var(--ac)}
/* Day/night indicator */
#dnInd{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;font-size:.55rem;color:#4a5580;letter-spacing:.2em;pointer-events:none}
.df{position:fixed;inset:0;background:radial-gradient(ellipse,transparent 30%,rgba(255,0,50,.32));z-index:15;pointer-events:none;opacity:0;transition:opacity .1s}
.df.sh{opacity:1}
.nv{position:fixed;inset:0;background:radial-gradient(ellipse,transparent 50%,rgba(0,80,255,.18));z-index:14;pointer-events:none;opacity:0;transition:opacity .18s}
.nv.sh{opacity:1}
.sm{position:fixed;inset:0;background:radial-gradient(ellipse,transparent 55%,rgba(255,100,0,.12));z-index:16;pointer-events:none;opacity:0;transition:opacity .14s}
.sm.sh{opacity:1}
.fc{position:fixed;top:4px;left:4px;font-family:'Orbitron',monospace;font-size:.52rem;color:#4a5580;z-index:30;pointer-events:none;opacity:0}
.fc.sh{opacity:1}
#grSc{background:rgba(5,5,16,.96);padding:16px;overflow-y:auto}
.grt{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:900;color:var(--ac);margin-bottom:.4em;letter-spacing:.1em}
.gri{display:flex;gap:20px;margin-bottom:1.2em;font-family:'Orbitron',monospace;font-size:.82rem;flex-wrap:wrap;justify-content:center}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;width:100%;max-width:760px;margin-bottom:1.2em}
.cc{background:var(--card);border:2px solid var(--bdr);border-radius:10px;padding:13px;transition:all .18s;cursor:pointer}
.cc:hover{border-color:var(--ac);box-shadow:0 0 14px rgba(0,255,240,.12)}
.cc.sel{border-color:var(--ac);box-shadow:0 0 18px rgba(0,255,240,.2)}
.cc.lk{opacity:.45}
.cn{font-family:'Orbitron',monospace;font-size:.88rem;font-weight:700;margin-bottom:6px}
.cs{height:4px;border-radius:2px;margin-bottom:8px}
.sr{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:.62rem}
.sl{width:52px;color:#4a5580;font-family:'Orbitron',monospace}
.sb{flex:1;height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.sf{height:100%;border-radius:2px}
.cco{font-family:'Orbitron',monospace;font-size:.72rem;color:var(--gold);margin-top:8px}
.ceq{font-family:'Orbitron',monospace;font-size:.62rem;color:var(--ac);margin-top:4px}
#stSc{background:rgba(5,5,16,.96)}
.stt{font-family:'Orbitron',monospace;font-size:1.6rem;font-weight:900;color:var(--ac);margin-bottom:1em}
.str{display:flex;align-items:center;gap:12px;margin:.5em 0;font-family:'Orbitron',monospace;font-size:.78rem}
.str label{width:95px;color:#4a5580;text-align:right}
.bg{display:flex;gap:4px}
.bo{padding:4px 10px;font-family:'Orbitron',monospace;font-size:.62rem;border:1px solid var(--bdr);background:transparent;color:#4a5580;cursor:pointer;transition:all .14s}
.bo.av{border-color:var(--ac);color:var(--ac);background:rgba(0,255,240,.1)}
#paSc{background:rgba(5,5,16,.82);backdrop-filter:blur(6px)}
.pat{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;color:var(--ac);margin-bottom:1em}
#goSc{background:rgba(5,5,16,.95)}
.got{font-family:'Orbitron',monospace;font-size:clamp(1.6rem,5vw,2.8rem);font-weight:900;color:var(--ac2);margin-bottom:.4em}
.gos{display:flex;flex-direction:column;gap:5px;margin-bottom:1.4em;align-items:center}
.goi{font-family:'Orbitron',monospace;font-size:.88rem;color:var(--fg)}
.goi span{color:var(--ac);font-weight:700}
.tc{position:fixed;bottom:0;left:0;right:0;z-index:22;display:none;justify-content:space-between;align-items:flex-end;padding:8px 12px;pointer-events:none}
.tc.on{display:flex}
.tz{pointer-events:auto;display:flex;gap:6px;align-items:flex-end}
.tb{width:52px;height:52px;border-radius:50%;border:2px solid rgba(0,255,240,.3);background:rgba(0,255,240,.06);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.1rem;-webkit-tap-highlight-color:transparent;pointer-events:auto;font-family:'Rajdhani',sans-serif;font-weight:700}
.tb:active{background:rgba(0,255,240,.22)}
.tb.nt{border-color:rgba(0,100,255,.4);color:#0088ff;background:rgba(0,100,255,.07)}
.tb.nt:active{background:rgba(0,100,255,.22)}
.tb.dt{border-color:rgba(255,170,0,.4);color:var(--gold);background:rgba(255,170,0,.07)}
.tb.dt:active{background:rgba(255,170,0,.22)}
.sz{display:flex;gap:4px;pointer-events:auto}
.sbb{width:60px;height:60px;border-radius:10px;border:2px solid rgba(0,255,240,.22);background:rgba(0,255,240,.04);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:1.4rem;-webkit-tap-highlight-color:transparent;pointer-events:auto;font-family:'Rajdhani',sans-serif;font-weight:700}
.sbb:active{background:rgba(0,255,240,.16)}
/* Leaderboard */
#lbSc{background:rgba(5,5,16,.96);padding:20px;overflow-y:auto}
.lbt{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:900;color:var(--gold);margin-bottom:1em;letter-spacing:.1em}
.lbEntry{display:flex;align-items:center;gap:12px;padding:8px 12px;margin:4px 0;background:var(--card);border:1px solid var(--bdr);border-radius:6px;font-family:'Orbitron',monospace;font-size:.75rem}
.lbRank{color:var(--gold);width:24px}
.lbName{flex:1;color:var(--ac)}
.lbScore{color:var(--fg)}
@media(max-width:600px){.cg{grid-template-columns:1fr}.bt{min-width:148px;padding:.5em 1.4em}}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div class="df" id="dFlash"></div>
<div class="nv" id="nVig"></div>
<div class="sm" id="smOv"></div>
<div class="fc" id="fpsC">60 FPS</div>

<!-- MENU -->
<div class="ov on" id="menuOv">
<div class="sc on" id="menuSc">
  <div class="gt">HIGHWAY ESCAPE</div>
  <div class="gs">v2 · Outrun the law</div>
  <button class="bt" id="playB">▶ DRIVE</button>
  <button class="bt g" id="garB">⬡ GARAGE</button>
  <button class="bt" id="lbB" style="border-color:#ffaa00;color:#ffaa00;background:rgba(255,170,0,.07)">🏆 LEADERBOARD</button>
  <button class="bt r" id="setB">⚙ SETTINGS</button>
  <div class="hs" id="hsD">BEST: 0</div>
</div></div>

<!-- HUD -->
<div class="ov" id="hudOv">
<div class="ht">
  <div class="hl">
    <div class="st">🛣 <span class="v" id="hDst">0</span>m</div>
    <div class="st">★ <span class="v" id="hScr">0</span></div>
    <div class="st">◈ <span class="v" id="hCns">0</span></div>
    <div class="lb">LV <span id="hLv">1</span></div>
  </div>
  <div class="hr">
    <div id="dnInd">☀ DAY</div>
    <div class="st">HEAT <span class="hst" id="hHt"></span></div>
    <button class="bt s" id="paB" style="margin:0;pointer-events:auto">⏸</button>
  </div>
</div>
<!-- Mission HUD -->
<div id="msnHud" class="hid">
  <div class="msnT" id="msnTitle">MISSION</div>
  <div class="msnD" id="msnDesc">-</div>
  <div class="msnPW"><div class="msnP" id="msnProg" style="width:0%"></div></div>
</div>
<!-- Power-up display -->
<div id="puDisp"></div>
<div id="nArea"></div>
<div id="cdB"><div class="cm" id="cdM">x1.0</div><div class="cl">COMBO</div></div>
<div id="drB">DRIFT 0.0s</div>
<!-- Biome indicator -->
<div id="biomeInd"></div>
<div class="hb">
  <canvas id="mmC" width="100" height="100"></canvas>
  <div class="gw">
    <canvas id="spdC" width="130" height="80"></canvas>
    <div class="brs">
      <div class="bw"><div class="bf hp" id="hpB" style="width:100%"></div><span class="bl">HP</span></div>
      <div class="bw"><div class="bf ni" id="niB" style="width:100%"></div><span class="bl">N2O</span></div>
      <div class="bw"><div class="bf xp" id="xpB" style="width:0%"></div><span class="bl">XP</span></div>
      <div class="bw"><div class="bf sh" id="shB" style="width:0%"></div><span class="bl">SHD</span></div>
    </div>
  </div>
  <div style="width:100px"></div>
</div></div>

<!-- GARAGE -->
<div class="ov" id="garOv">
<div class="sc on" id="grSc">
  <div class="grt">GARAGE</div>
  <div class="gri">
    <span>◈ <span id="gCn">0</span></span>
    <span>★ LV <span id="gLv">1</span></span>
  </div>
  <div class="cg" id="cGrd"></div>
  <button class="bt r" id="gBk">← BACK</button>
</div></div>

<!-- LEADERBOARD -->
<div class="ov" id="lbOv">
<div class="sc on" id="lbSc">
  <div class="lbt">🏆 LEADERBOARD</div>
  <div id="lbList" style="width:100%;max-width:500px"></div>
  <button class="bt r" id="lbBk" style="margin-top:1.5em">← BACK</button>
</div></div>

<!-- SETTINGS -->
<div class="ov" id="setOv">
<div class="sc on" id="stSc">
  <div class="stt">SETTINGS</div>
  <div class="str"><label>Quality</label><div class="bg" id="qBg"><button class="bo" data-q="0">LOW</button><button class="bo" data-q="1">MED</button><button class="bo av" data-q="2">HIGH</button></div></div>
  <div class="str"><label>Volume</label><div class="bg" id="vBg"><button class="bo" data-v="0">OFF</button><button class="bo" data-v="0.5">LOW</button><button class="bo av" data-v="1">HIGH</button></div></div>
  <div class="str"><label>Show FPS</label><div class="bg" id="fBg"><button class="bo" data-f="0">OFF</button><button class="bo av" data-f="1">ON</button></div></div>
  <div style="margin-top:1.5em"><button class="bt" id="sBk">← BACK</button></div>
</div></div>

<!-- PAUSE -->
<div class="ov" id="paOv">
<div class="sc on" id="paSc">
  <div class="pat">PAUSED</div>
  <button class="bt" id="rsB">▶ RESUME</button>
  <button class="bt r" id="qtB">⌂ QUIT</button>
</div></div>

<!-- GAME OVER -->
<div class="ov" id="goOv">
<div class="sc on" id="goSc">
  <div class="got">BUSTED</div>
  <div class="gos">
    <div class="goi">Distance: <span id="goD">0</span>m</div>
    <div class="goi">Score: <span id="goS">0</span></div>
    <div class="goi">Coins: <span id="goC">0</span></div>
    <div class="goi">Top Speed: <span id="goSp">0</span> km/h</div>
    <div class="goi">Max Combo: <span id="goCo">x1.0</span></div>
    <div class="goi">XP Earned: <span id="goX">0</span></div>
    <div class="goi">Missions Done: <span id="goM">0</span></div>
    <div class="goi">Biome: <span id="goB">City</span></div>
  </div>
  <button class="bt" id="rtB">↺ RETRY</button>
  <button class="bt r" id="gmB">⌂ MENU</button>
</div></div>

<!-- TOUCH CONTROLS -->
<div class="tc" id="tCtrl">
  <div class="sz">
    <button class="sbb" id="sL">◀</button>
    <button class="sbb" id="sR">▶</button>
  </div>
  <div class="tz">
    <button class="tb dt" id="dBr">~</button>
    <button class="tb nt" id="nBr">⚡</button>
    <button class="tb" id="bBr">■</button>
  </div>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const CFG = {
  road: { segLen: 180, width: 22, lanes: 4 },
  player: { maxSpd: 70, acc: 22, brk: 45, steer: 18, drag: 0.38, latDamp: 5, driftLatDamp: 2.1, driftSteerMul: 1.85 },
  nitro: { boost: 35, drain: 30, regen: 6 },
  hp: { max: 100, polHit: 9, trfHit: 13, barrierHit: 7, roadblockHit: 22, helicopterHit: 18 },
  police: { baseSpd: 38, spawnDist: 68 },
  traffic: { baseSpd: 16 },
  coin: { healAmt: 14, xpAmt: 4 },
  heat: { rate: 0.013, max: 5 },
  combo: { resetDelay: 2.4, decay: 0.22, nearMissBonus: 0.45, nearMissScore: 90, driftScore: 45 },
  xp: { base: 100, scale: 1.4 },
  dayNight: { cycleDuration: 180 }, // seconds per full cycle
};

const QUALITY = [
  { bloom: false, bloomStr: 0, maxPol: 2, maxTrf: 5, rain: false, rainPts: 0, maxPt: 25, skid: false, bldPerSeg: 2 },
  { bloom: true,  bloomStr: 0.45, maxPol: 4, maxTrf: 8, rain: true, rainPts: 1400, maxPt: 65, skid: true, bldPerSeg: 3 },
  { bloom: true,  bloomStr: 0.75, maxPol: 7, maxTrf: 11, rain: true, rainPts: 2600, maxPt: 120, skid: true, bldPerSeg: 5 },
];

const CARS = [
  { id:0, name:'Street Runner', col:0xff2244, spd:1,   han:1,    arm:1,   nit:1,   cost:0 },
  { id:1, name:'Night Stalker', col:0x2266ff, spd:1.15, han:0.95, arm:0.85, nit:1.1, cost:500 },

/* ═══════════════════════════════════════════
   SPATIAL HASH GRID (O(1) collision)
═══════════════════════════════════════════ */
class SpatialHash {
  constructor(cellSize = 6) {
    this.cellSize = cellSize;
    this.cells = new Map();
  }
  _key(x, z) {
    return `${Math.floor(x / this.cellSize)},${Math.floor(z / this.cellSize)}`;
  }
  clear() { this.cells.clear(); }
  insert(obj, x, z) {
    const k = this._key(x, z);
    if (!this.cells.has(k)) this.cells.set(k, []);
    this.cells.get(k).push(obj);
  }
  query(x, z, radius = 3) {
    const results = [];
    const cells = Math.ceil(radius / this.cellSize);
    for (let dx = -cells; dx <= cells; dx++) {
      for (let dz = -cells; dz <= cells; dz++) {
        const cx = Math.floor(x / this.cellSize) + dx;
        const cz = Math.floor(z / this.cellSize) + dz;
        const k = `${cx},${cz}`;
        if (this.cells.has(k)) results.push(...this.cells.get(k));
      }
    }
    return results;
  }
}
const spatialHash = new SpatialHash(6);

/* ═══════════════════════════════════════════
   OBJECT POOL
═══════════════════════════════════════════ */
function createPool(factory, count) {
  const available = [];
  const active = new Set();
  for (let i = 0; i < count; i++) {
    const obj = factory(); obj.visible = false; available.push(obj);
  }
  return {
    get() {
      let obj = available.pop();
      if (!obj) { obj = factory(); }
      obj.visible = true; active.add(obj); return obj;
    },
    release(obj) {
      if (active.has(obj)) { active.delete(obj); obj.visible = false; available.push(obj); }
    },
    releaseAll() { for (const o of active) { o.visible = false; available.push(o); } active.clear(); },
    size() { return active.size; },
    forEach(fn) { active.forEach(fn); },
    entries() { return active; }
  };
}

   DAY/NIGHT CYCLE
═══════════════════════════════════════════ */
function updateDayNight(dt) {
  if (S.screen !== 'playing') return;
  S.dayTime = (S.dayTime + dt / CFG.dayNight.cycleDuration) % 1;

  // Sun/moon positions
  const sunAngle = S.dayTime * Math.PI * 2;
  sunLight.position.set(Math.cos(sunAngle) * 50, Math.sin(sunAngle) * 50, 20);
  moonLight.position.set(-Math.cos(sunAngle) * 50, -Math.sin(sunAngle) * 50 + 20, -20);

  // Day intensity: peaks at 0.5 (noon), 0 at midnight
  const dayIntensity = Math.max(0, Math.sin(S.dayTime * Math.PI * 2));
  const nightIntensity = Math.max(0, -Math.sin(S.dayTime * Math.PI * 2));
  const duskDawn = Math.max(0, 1 - Math.abs(dayIntensity - 0.5) * 4);

  // Sun color: orange at dawn/dusk, white at noon
  const sunHue = duskDawn > 0.3 ? new THREE.Color(1, 0.5, 0.1) : new THREE.Color(0.8, 0.85, 1.0);
  sunLight.color.lerp(sunHue, dt * 2);
  sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, dayIntensity * 1.8, dt * 1.5);
  moonLight.intensity = THREE.MathUtils.lerp(moonLight.intensity, nightIntensity * 0.5, dt * 1.5);

  // Sky color
  const skyDark = new THREE.Color(0x050510);
  const skyDay = new THREE.Color(0x050520);
  const skyDusk = new THREE.Color(0x1a0810);
  let sky = skyDark.clone();
  if (duskDawn > 0.2) sky.lerp(skyDusk, duskDawn);
  if (dayIntensity > 0.5) sky.lerp(skyDay, (dayIntensity - 0.5) * 2);
  scene.background.lerp(sky, dt * 1.5);

  // Ambient
  const biome = BIOMES[S.currentBiome];
  const targetAmbInt = biome.ambInt * (0.4 + dayIntensity * 0.6);
  ambLight.intensity = THREE.MathUtils.lerp(ambLight.intensity, targetAmbInt, dt * 1.5);

  // Update HUD indicator
  const phase = S.dayTime < 0.15 ? '🌑 NIGHT' : S.dayTime < 0.28 ? '🌅 DAWN' : S.dayTime < 0.65 ? '☀ DAY' : S.dayTime < 0.78 ? '🌆 DUSK' : '🌑 NIGHT';
  document.getElementById('dnInd').textContent = phase;

  // Bloom increases at night
  if (Q().bloom) bloomPass.strength = Q().bloomStr * (1 + nightIntensity * 0.8);
}

/* ═══════════════════════════════════════════
   BIOME SYSTEM
═══════════════════════════════════════════ */
let biomeTimer = 0;
let lastBiomeName = '';
const BIOME_DURATIONS = [45, 30, 35, 40]; // seconds per biome

function updateBiome(dt) {
  biomeTimer += dt;
  const dur = BIOME_DURATIONS[S.currentBiome];
  S.biomeProgress = biomeTimer / dur;

  if (biomeTimer >= dur) {
    biomeTimer = 0;
    S.currentBiome = (S.currentBiome + 1) % BIOMES.length;
    const biome = BIOMES[S.currentBiome];
    if (biome.name !== lastBiomeName) {
      lastBiomeName = biome.name;
      notify('ENTERING: ' + biome.name, '#8899ff');
      const biomeEl = document.getElementById('biomeInd');
      biomeEl.textContent = '— ' + biome.name + ' —';
      biomeEl.classList.add('sh');
      setTimeout(() => biomeEl.classList.remove('sh'), 3000);
    }
  }

  // Blend fog and lighting based on biome
  const biome = BIOMES[S.currentBiome];
  const targetFog = biome.fogDensity * (S.weather === 'fog' ? 2.5 : S.weather === 'storm' ? 1.8 : 1);
  scene.fog.density = THREE.MathUtils.lerp(scene.fog.density, targetFog, dt * 0.5);

  const ambCol = new THREE.Color(biome.ambCol);
  ambLight.color.lerp(ambCol, dt * 0.5);
}

/* ═══════════════════════════════════════════
   MISSION SYSTEM
═══════════════════════════════════════════ */
function startMission() {
  if (S.currentMission) return;
  const idx = Math.floor(Math.random() * MISSIONS.length);
  S.currentMission = Object.assign({}, MISSIONS[idx]);
  S.missionProgress = 0;
  S.missionStats = { near: 0, evade: 0, drift: 0 };
  document.getElementById('msnHud').classList.remove('hid');
  document.getElementById('msnTitle').textContent = S.currentMission.name;
  document.getElementById('msnDesc').textContent = S.currentMission.desc;
  document.getElementById('msnProg').style.width = '0%';
  notify('MISSION: ' + S.currentMission.name, '#ffaa00');
}

function updateMission(dt) {
  if (!S.currentMission) {
    if (Math.random() < dt * 0.08) startMission();
    return;
  }
  const m = S.currentMission;
  let prog = 0;
  switch (m.type) {
    case 'speed': prog = Math.min(m.target, S.speed * 3.6) / m.target; break;
    case 'coins': prog = Math.min(m.target, S.coins) / m.target; break;
    case 'near': prog = Math.min(m.target, S.missionStats.near) / m.target; break;
    case 'drift': prog = Math.min(m.target, S.missionStats.drift) / m.target; break;
    case 'dist': prog = Math.min(m.target, S.dist) / m.target; break;
    case 'evade': prog = Math.min(m.target, S.missionStats.evade) / m.target; break;
    case 'combo': prog = Math.min(m.target, S.combo) / m.target; break;
  }
  S.missionProgress = prog;
  document.getElementById('msnProg').style.width = (prog * 100) + '%';

  if (m.type === 'drift') S.missionStats.drift += S.drifting ? dt : 0;

  if (prog >= 1) {
    // Mission complete!
    S.totalCoins += m.reward;
    addXP(m.xpReward);
    S.missionsCompleted++;
    S.score += m.reward * 2;
    notify('✓ MISSION DONE! +' + m.reward + ' COINS', '#ffaa00');
    document.getElementById('msnHud').classList.add('hid');
    S.currentMission = null;
    // Spawn next after delay
    setTimeout(() => startMission(), 8000);
  }
}

/* ═══════════════════════════════════════════
   POWER-UP SYSTEM
═══════════════════════════════════════════ */
let puSpawnTimer = 0;

function spawnPowerup() {
  const m = powerupPool.get();
  const lane = Math.floor(Math.random() * CFG.road.lanes);
  const laneW = CFG.road.width / CFG.road.lanes;
  const puType = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  m.position.set(-CFG.road.width / 2 + laneW / 2 + lane * laneW, 1.2, playerZ + 80 + Math.random() * 80);
  m.material.color.setHex(puType.col);
  m.material.emissive = new THREE.Color(puType.col);
  m.material.emissiveIntensity = 2.0;
  powerupData.set(m, { type: puType });
}

function updatePowerups(dt) {
  puSpawnTimer += dt;
  if (puSpawnTimer > 20 && powerupData.size < 3) { puSpawnTimer = 0; spawnPowerup(); }

  for (const [m, d] of powerupData) {
    m.rotation.y += dt * 2;
    m.rotation.x += dt * 1.5;
    m.position.y = 1.2 + Math.sin(S.time * 3 + m.position.z) * 0.25;
    if (m.position.z < playerZ - 30) { powerupData.delete(m); powerupPool.release(m); }
  }

  // Update active power-ups
  const dispEl = document.getElementById('puDisp');
  dispEl.innerHTML = '';
  for (const [id, data] of Object.entries(S.activePowerups)) {
    data.time -= dt;
    if (data.time <= 0) {
      delete S.activePowerups[id];
      if (id === 'shield') S.shieldHP = 0;
      if (id === 'magnet') S.magnetRadius = 0;
      notify(id.toUpperCase() + ' EXPIRED', '#4a5580');
    } else {
      const pu = POWERUP_TYPES.find(p => p.id === id);
      if (pu) {
        const el = document.createElement('div');
        el.className = 'puItem';
        el.innerHTML = `<span class="pui">${pu.icon}</span><span class="put">${pu.name} ${data.time.toFixed(1)}s</span>`;
        dispEl.appendChild(el);
      }
    }
  }
  // Shield bar
  document.getElementById('shB').style.width = S.activePowerups.shield ? (S.activePowerups.shield.time / POWERUP_TYPES.find(p=>p.id==='shield').duration * 100) + '%' : '0%';
}

function activatePowerup(type) {
  S.activePowerups[type.id] = { time: type.duration };
  if (type.id === 'shield') S.shieldHP = 100;
  if (type.id === 'magnet') S.magnetRadius = 8;
  playCoinSound();
  notify(type.icon + ' ' + type.name + '!', '#' + type.col.toString(16).padStart(6,'0'));
}

function hasPowerup(id) { return !!S.activePowerups[id]; }

/* ═══════════════════════════════════════════
   HELICOPTER (heat 4+)
═══════════════════════════════════════════ */
function updateHelicopter(dt) {
  if (S.heat < 4) {
    if (helicopterMesh) { helicopterMesh.visible = false; S.helicopterActive = false; }
    return;
  }
  S.helicopterSpawnTimer = (S.helicopterSpawnTimer || 0) + dt;
  if (!S.helicopterActive && S.helicopterSpawnTimer > 15) {
    S.helicopterSpawnTimer = 0;
    S.helicopterActive = true;
    if (!helicopterMesh) helicopterMesh = createHelicopter();
    helicopterMesh.visible = true;
    S.helicopterX = playerX;
    S.helicopterZ = playerZ + 30;
    S.helicopterY = 22;
    notify('⚠ HELICOPTER DEPLOYED!', '#ff4400');
  }
  if (!S.helicopterActive || !helicopterMesh) return;

  // Circle/chase behaviour
  S.helicopterTimer = (S.helicopterTimer || 0) + dt;
  const targetX = playerX + Math.sin(S.helicopterTimer * 0.5) * 8;
  const targetZ = playerZ + 25;
  S.helicopterX = THREE.MathUtils.lerp(S.helicopterX, targetX, dt * 0.8);
  S.helicopterZ = THREE.MathUtils.lerp(S.helicopterZ, targetZ, dt * 1.2);
  helicopterMesh.position.set(S.helicopterX, S.helicopterY, S.helicopterZ);
  // Rotor spin
  if (helicopterMesh.userData.rotor) helicopterMesh.userData.rotor.rotation.y += dt * 15;
  helicopterMesh.rotation.z = Math.sin(S.helicopterTimer * 0.3) * 0.08;

  // Drop spike strips periodically
  if (Math.floor(S.helicopterTimer * 10) % 80 === 0 && S.spikeStrips.length < 3) {
    dropSpikeStrip(S.helicopterX, S.helicopterZ + 10);
  }

  // Despawn after 45s
  if (S.helicopterTimer > 45) {
    S.helicopterActive = false;
    S.helicopterTimer = 0;
    helicopterMesh.visible = false;
    notify('Helicopter broke off pursuit', '#4a5580');
  }
}

/* ═══════════════════════════════════════════
   SPIKE STRIPS (dropped by helicopter or placed)
═══════════════════════════════════════════ */
let spikeStripMeshes = [];
function dropSpikeStrip(x, z) {
  const m = new THREE.Mesh(GEO.spikeStrip, MAT.spikeStrip);
  m.position.set(x, 0.05, z);
  scene.add(m);
  spikeStripMeshes.push(m);
  S.spikeStrips.push({ mesh: m, z });
  notify('SPIKE STRIP DROPPED!', '#ff6600');
}

function updateSpikeStrips(dt) {
  S.spikeStrips = S.spikeStrips.filter(s => {
    if (s.z < playerZ - 60) { scene.remove(s.mesh); s.mesh.geometry.dispose(); return false; }
    // Collision
    if (!hasPowerup('ghost') && !hasPowerup('shield') &&
        Math.abs(playerZ - s.z) < 0.8 && Math.abs(playerX - s.mesh.position.x) < CFG.road.width / 2 - 1) {
      dealDamage(25, false);
      S.speed *= 0.4;
      notify('SPIKE STRIP!', '#ff4400');
      scene.remove(s.mesh); s.mesh.geometry.dispose(); return false;
    }
    return true;
  });
  spikeStripMeshes = spikeStripMeshes.filter(m => scene.children.includes(m));
}

   GHOST CAR REPLAY
═══════════════════════════════════════════ */
let replayRecordTimer = 0;
function updateReplayRecording(dt) {
  if (!S.recordingReplay) return;
  replayRecordTimer += dt;
  if (replayRecordTimer > 0.05) { // 20fps recording
    replayRecordTimer = 0;
    S.replayBuffer.push({ x: playerX, z: playerZ, ry: playerMesh ? playerMesh.rotation.y : 0, speed: S.speed });
    if (S.replayBuffer.length > 2000) S.replayBuffer.shift();
  }
}

function showGhostCar() {
  const saved = localStorage.getItem('hwyGhost6');
  if (!saved) return;
  try {
    ghostReplayData = JSON.parse(saved);
    if (!ghostMesh) {
      ghostMesh = createCar(0x00ffaa, 'ghost');
      scene.add(ghostMesh);
    }
    ghostMesh.visible = true;
    replayIndex = 0;
  } catch(e) {}
}

function updateGhostCar(dt) {
  if (!ghostMesh || !ghostMesh.visible || ghostReplayData.length === 0) return;
  replayIndex = Math.min(replayIndex + 1, ghostReplayData.length - 1);
  if (replayIndex >= ghostReplayData.length - 1) { ghostMesh.visible = false; return; }
  const f = ghostReplayData[replayIndex];
  ghostMesh.position.set(f.x, 0, f.z);
  ghostMesh.rotation.y = f.ry;
}

/* ═══════════════════════════════════════════
   ROAD GENERATION (biome-aware)
═══════════════════════════════════════════ */
const roadGroup = new THREE.Group();
scene.add(roadGroup);
const roadSegments = new Map();

function getRoadMat() {
  const b = S.currentBiome;
  const isWet = S.weather === 'rain' || S.weather === 'storm';
  if (isWet) return MAT.roadWet;
  if (b === 3) return MAT.roadDesert;
  if (b === 1) return MAT.roadTunnel;
  return MAT.road;
}

function getBarrierMat() {
  if (S.currentBiome === 3) return MAT.barrierDesert;
  if (S.currentBiome === 1) return MAT.barrierTunnel;
  return MAT.barrier;
}

function buildRoadSegment(startZ) {
  const seg = new THREE.Group();
  const L = CFG.road.segLen;
  const W = CFG.road.width;
  const biome = BIOMES[S.currentBiome];

  const road = new THREE.Mesh(new THREE.PlaneGeometry(W, L), getRoadMat());
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0, startZ + L / 2);
  seg.add(road);

  const laneW = W / CFG.road.lanes;
  for (let i = 1; i < CFG.road.lanes; i++) {
    const x = -W / 2 + i * laneW;
    for (let d = 0; d < L; d += 14) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 3.2), MAT.laneLine);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(x, 0.01, startZ + d + 1.6);
      seg.add(dash);
    }
  }

  [-W / 2 + 0.1, W / 2 - 0.1].forEach(x => {
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.15, L), MAT.neonCyan);
    edge.rotation.x = -Math.PI / 2;
    edge.position.set(x, 0.02, startZ + L / 2);
    seg.add(edge);
  });

  const barrierGeo = new THREE.BoxGeometry(0.38, 0.75, L);
  [-W / 2 - 0.28, W / 2 + 0.28].forEach(x => {
    const b = new THREE.Mesh(barrierGeo, getBarrierMat());
    b.position.set(x, 0.375, startZ + L / 2);
    seg.add(b);
  });

  // Biome-specific geometry
  if (S.currentBiome === 1) {
    // TUNNEL: ceiling and walls
    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W + 8, L), new THREE.MeshLambertMaterial({ color: 0x080810 }));
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, 8, startZ + L / 2);
    seg.add(ceiling);
    // Tunnel light strips
    for (let d = 15; d < L; d += 25) {
      const strip = new THREE.Mesh(new THREE.PlaneGeometry(W - 2, 0.3), MAT.neonCyan);
      strip.rotation.x = Math.PI / 2;
      strip.position.set(0, 7.9, startZ + d);
      seg.add(strip);
    }
  } else if (S.currentBiome === 2) {
    // BRIDGE: railings
    [-W / 2 - 1, W / 2 + 1].forEach(x => {
      for (let d = 5; d < L; d += 8) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.5, 0.15), MAT.bridgeRail);
        post.position.set(x, 1.25, startZ + d);
        seg.add(post);
      }
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, L), MAT.bridgeRail);
      rail.position.set(x, 2.5, startZ + L / 2);
      seg.add(rail);
    });
    // Bridge gap below (ocean look)
    const water = new THREE.Mesh(new THREE.PlaneGeometry(W + 30, L), new THREE.MeshLambertMaterial({ color: 0x040820 }));
    water.rotation.x = -Math.PI / 2;
    water.position.set(0, -25, startZ + L / 2);
    seg.add(water);
  } else if (S.currentBiome === 3) {
    // DESERT: sand dunes in background
    for (let side = -1; side <= 1; side += 2) {
      for (let b = 0; b < 3; b++) {
        const dune = new THREE.Mesh(new THREE.SphereGeometry(8 + Math.random() * 12, 6, 4), new THREE.MeshLambertMaterial({ color: 0x2a1808 }));
        dune.position.set(side * (W / 2 + 15 + Math.random() * 20), -3, startZ + Math.random() * L);
        seg.add(dune);
      }
    }
  } else {
    // CITY: buildings
    for (let side = -1; side <= 1; side += 2) {
      for (let b = 0; b < Q().bldPerSeg; b++) {
        const bx = side * (W / 2 + 7 + Math.random() * 20);
        const bw = 5 + Math.random() * 11;
        const [minH, maxH] = biome.buildingH;
        if (minH === 0 && maxH === 0) continue;
        const bh = minH + Math.random() * (maxH - minH);
        const bd = 7 + Math.random() * 16;
        const bz = startZ + Math.random() * L;
        const bMat = new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(0.58 + Math.random() * 0.08, 0.1, 0.035 + Math.random() * 0.035) });
        const building = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), bMat);
        building.position.set(bx, bh / 2, bz);
        seg.add(building);
        // Neon strips (animated intensity based on biome)
        const nMat = NEON_MATS[Math.floor(Math.random() * NEON_MATS.length)];
        const strips = Math.min(3, Math.floor(bh / 7));
        for (let s = 0; s < strips; s++) {
          if (Math.random() > 0.5) continue;
          const yp = 2 + s * 7;
          if (yp >= bh - 1) continue;
          const strip = new THREE.Mesh(new THREE.PlaneGeometry(bw * 0.7, 0.28), nMat.clone());
          strip.position.set(bx, yp, bz + (side > 0 ? -bd / 2 - 0.04 : bd / 2 + 0.04));
          strip.rotation.y = side > 0 ? Math.PI : 0;
          seg.add(strip);
        }
      }
    }
    // Street lights
    for (let d = 20; d < L; d += 45) {
      [-1, 1].forEach(side => {
        const x = side * (W / 2 + 2);
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 6, 6), MAT.barrier);
        pole.position.set(x, 3, startZ + d);
        seg.add(pole);
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 6), MAT.neonCyan);
        lamp.position.set(x, 6.1, startZ + d);
        seg.add(lamp);
      });
    }
  }

  roadGroup.add(seg);
  roadSegments.set(startZ, seg);
}

function updateRoad() {
  const segLen = CFG.road.segLen;
  const startZ = Math.floor((playerZ - 100) / segLen) * segLen;
  const endZ = playerZ + segLen * 5;
  for (let z = startZ; z < endZ; z += segLen) {
    if (!roadSegments.has(z)) buildRoadSegment(z);
  }
  for (const [z, seg] of roadSegments) {
    if (z < startZ - segLen) {
      roadGroup.remove(seg);
      seg.traverse(c => { if (c.isMesh) { c.geometry.dispose(); if (c.material && !isSharedMat(c.material)) c.material.dispose(); } });
      roadSegments.delete(z);
    }
  }
}

function isSharedMat(mat) { return Object.values(MAT).includes(mat); }

/* ═══════════════════════════════════════════
   PARTICLES
═══════════════════════════════════════════ */
function spawnParticles(pos, color, count = 8, spread = 2, speed = 5) {
  const n = Math.min(count, Math.max(0, Q().maxPt - particleData.size));
  for (let i = 0; i < n; i++) {
    let m; try { m = particlePool.get(); } catch(e) { break; }
    m.material.color.setHex(color);
    m.position.copy(pos);
    const v = new THREE.Vector3((Math.random()-.5)*spread*speed, Math.random()*speed*.6, (Math.random()-.5)*spread*speed);
    m.material.opacity = 1;
    m.scale.setScalar(0.5 + Math.random() * 0.6);
    particleData.set(m, { v, life: 0.28 + Math.random() * 0.38, age: 0 });
  }
}

function updateParticles(dt) {
  for (const [m, d] of particleData) {
    d.age += dt;
    if (d.age >= d.life) { particleData.delete(m); particlePool.release(m); continue; }
    m.position.addScaledVector(d.v, dt);
    d.v.y -= 9.8 * dt;
    const a = 1 - d.age / d.life;
    m.material.opacity = a;
    m.scale.setScalar(Math.max(0.01, a * 0.6));
  }
}

/* ═══════════════════════════════════════════
   SKID MARKS
═══════════════════════════════════════════ */
let skidTimer = 0;
function updateSkids(dt) {
  if (!Q().skid) return;
  skidTimer += dt;
  if (S.drifting && skidTimer > 0.1) {
    skidTimer = 0;
    for (let side of [-1, 1]) {
      let m; try { m = skidPool.get(); } catch(e) { continue; }
      m.position.set(playerX + side * 0.88, 0.012, playerZ - 1.2);
      m.rotation.z = playerMesh ? playerMesh.rotation.y : 0;
      m.material.opacity = 0.38;
      skidData.set(m, { age: 0, life: 4.5 });
    }
  }
  for (const [m, d] of skidData) {
    d.age += dt;
    if (d.age >= d.life) { skidData.delete(m); skidPool.release(m); continue; }
    m.material.opacity = Math.max(0, 0.38 * (1 - d.age / d.life));
  }
}

/* ═══════════════════════════════════════════
   RAIN
═══════════════════════════════════════════ */
let rainMesh = null;
function initRain() {
  if (rainMesh) { scene.remove(rainMesh); rainMesh.geometry.dispose(); rainMesh = null; }
  const cnt = Q().rainPts;
  if (!cnt) return;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(cnt * 3);
  for (let i = 0; i < cnt; i++) { pos[i*3]=(Math.random()-.5)*80; pos[i*3+1]=Math.random()*42; pos[i*3+2]=(Math.random()-.5)*80; }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  rainMesh = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x8899bb, size: 0.08, transparent: true, opacity: 0.4 }));
  scene.add(rainMesh);
}

function updateRain(dt) {
  if (!rainMesh) return;
  const active = S.weather === 'rain' || S.weather === 'storm';
  rainMesh.visible = active;
  if (!active) return;
  const arr = rainMesh.geometry.attributes.position.array;
  const cnt = arr.length / 3;
  const speed = S.weather === 'storm' ? 40 : 26;
  for (let i = 0; i < cnt; i++) {
    arr[i*3+1] -= speed * dt;
    if (arr[i*3+1] < 0) { arr[i*3]=playerX+(Math.random()-.5)*80; arr[i*3+1]=38+Math.random()*8; arr[i*3+2]=playerZ+(Math.random()-.5)*80; }
  }
  rainMesh.geometry.attributes.position.needsUpdate = true;
}

   INPUT

const input = { left: false, right: false, gas: false, brake: false, drift: false, nitro: false };
document.addEventListener('keydown', e => {
  if (e.code==='ArrowLeft'||e.code==='KeyA') input.left=true;
  if (e.code==='ArrowRight'||e.code==='KeyD') input.right=true;
  if (e.code==='ArrowUp'||e.code==='KeyW') input.gas=true;
  if (e.code==='ArrowDown'||e.code==='KeyS') input.brake=true;
  if (e.code==='Space') { input.drift=true; e.preventDefault(); }
  if (e.code==='ShiftLeft'||e.code==='ShiftRight') input.nitro=true;
  if (e.code==='Escape') togglePause();
});
document.addEventListener('keyup', e => {
  if (e.code==='ArrowLeft'||e.code==='KeyA') input.left=false;
  if (e.code==='ArrowRight'||e.code==='KeyD') input.right=false;
  if (e.code==='ArrowUp'||e.code==='KeyW') input.gas=false;
  if (e.code==='ArrowDown'||e.code==='KeyS') input.brake=false;
  if (e.code==='Space') input.drift=false;
  if (e.code==='ShiftLeft'||e.code==='ShiftRight') input.nitro=false;
});

function bindTouch(id, key) {
  const el = document.getElementById(id); if (!el) return;
  el.addEventListener('touchstart', e => { e.preventDefault(); input[key]=true; }, { passive: false });
  el.addEventListener('touchend', e => { e.preventDefault(); input[key]=false; }, { passive: false });
  el.addEventListener('touchcancel', () => { input[key]=false; });
}
bindTouch('sL','left'); bindTouch('sR','right'); bindTouch('bBr','brake'); bindTouch('dBr','drift'); bindTouch('nBr','nitro');
['sL','sR'].forEach(id => {
  const el = document.getElementById(id); if (!el) return;
  el.addEventListener('touchstart', () => { input.gas=true; });
  el.addEventListener('touchend', () => { if (!input.left&&!input.right) input.gas=false; });
});

const SI = { left: 0, right: 0, gas: 0, brake: 0 };

/* ═══════════════════════════════════════════
   PLAYER PHYSICS
═══════════════════════════════════════════ */
let nitroWasOff = true;
function updatePlayer(dt) {
  const speedStat = carStat('spd');
  const hanStat = carStat('han');
  const armStat = carStat('arm');
  const nitStat = carStat('nit');
  const maxSpd = CFG.player.maxSpd * speedStat * (hasPowerup('turbo') ? 1.5 : 1);

  const r = dt * 9;
  SI.left  = THREE.MathUtils.lerp(SI.left,  input.left  ? 1 : 0, r);
  SI.right = THREE.MathUtils.lerp(SI.right, input.right ? 1 : 0, r);
  SI.gas   = THREE.MathUtils.lerp(SI.gas,   input.gas   ? 1 : 0, r * 0.75);
  SI.brake = THREE.MathUtils.lerp(SI.brake, input.brake ? 1 : 0, r);

  S.speed += (SI.gas * CFG.player.acc * speedStat - CFG.player.drag * S.speed * 0.12) * dt;
  if (SI.brake > 0.08) S.speed -= CFG.player.brk * SI.brake * dt;
  S.speed = Math.max(0, Math.min(S.speed, maxSpd));

  const nitroOn = input.nitro && S.nitro > 0;
  if (nitroOn) {
    S.speed += CFG.nitro.boost * nitStat * dt;
    S.speed = Math.min(S.speed, maxSpd * 1.4);
    S.nitro -= CFG.nitro.drain * dt; S.nitro = Math.max(0, S.nitro);
    if (Math.random() < 0.3) spawnParticles(new THREE.Vector3(playerX+(Math.random()-.5)*.5,.3,playerZ-2.3),0x0066ff,1,.3,2);
    if (nitroWasOff) { playNitroSound(); nitroWasOff=false; }
  } else {
    S.nitro = Math.min(100, S.nitro + CFG.nitro.regen * dt);
    nitroWasOff = true;
  }

  if (playerMesh && playerMesh.userData.exL) {
    playerMesh.userData.exL.visible = nitroOn;
    playerMesh.userData.exR.visible = nitroOn;
    if (nitroOn) { const f=.75+Math.random()*.55; playerMesh.userData.exL.scale.set(f,f*1.4,f); playerMesh.userData.exR.scale.set(f,f*1.4,f); }
  }

  const isDrifting = input.drift;
  const steerStr = CFG.player.steer * hanStat * (isDrifting ? CFG.player.driftSteerMul : 1);
  S.lateralV += (SI.right - SI.left) * steerStr * dt;
  const latDamp = isDrifting ? CFG.player.driftLatDamp : CFG.player.latDamp;
  S.lateralV -= S.lateralV * latDamp * dt;
  S.lateralV = Math.max(-26, Math.min(26, S.lateralV));

  S.drifting = isDrifting && Math.abs(S.lateralV) > 2.2 && S.speed > 18;
  if (S.drifting) {
    S.driftTimer += dt; S.totalDrift += dt;
    addXP(dt * 2.5);
    S.score += Math.floor(CFG.combo.driftScore * S.combo * dt);
  } else {
    if (S.driftTimer > 0.5) notify('DRIFT ' + S.driftTimer.toFixed(1) + 's', '#ff6600');
    S.driftTimer = 0;
  }

  playerX += S.lateralV * dt;
  playerZ += S.speed * dt;

  const halfW = CFG.road.width / 2 - 1.1;
  if (playerX < -halfW) { playerX=-halfW; S.lateralV*=-.25; if (!hasPowerup('shield')&&!hasPowerup('ghost')) dealDamage(CFG.hp.barrierHit*dt*5/armStat,true); S.shakeAmt=.28; }
  if (playerX > halfW) { playerX=halfW; S.lateralV*=-.25; if (!hasPowerup('shield')&&!hasPowerup('ghost')) dealDamage(CFG.hp.barrierHit*dt*5/armStat,true); S.shakeAmt=.28; }

  if (playerMesh) {
    playerMesh.position.set(playerX, Math.sin(S.time*11)*.018*(S.speed/Math.max(1,maxSpd)), playerZ);
    playerMesh.rotation.y = THREE.MathUtils.lerp(playerMesh.rotation.y, -S.lateralV*.028, dt*7);
    playerMesh.rotation.z = THREE.MathUtils.lerp(playerMesh.rotation.z, S.drifting ? S.lateralV*.011 : 0, dt*5);
    // Ghost glow when powered up
    if (hasPowerup('ghost')) { playerMesh.traverse(c => { if (c.isMesh && c.material && c.material.transparent !== undefined) c.material.opacity = 0.4; }); }
    else { playerMesh.traverse(c => { if (c.isMesh && c.material && c.material !== MAT.ghostCar) { if (c.material.transparent) c.material.opacity = c.material === MAT.glass ? 0.75 : 1; } }); }
  }

  // Coin magnet
  if (S.magnetRadius > 0) {
    for (const [m] of coinData) {
      const dx = playerX - m.position.x;
      const dz = playerZ - m.position.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      if (dist < S.magnetRadius) { m.position.x += dx * 0.08; m.position.z += dz * 0.08; }
    }
  }

  S.dist = Math.floor(playerZ);
  if (S.speed > S.topSpeed) S.topSpeed = S.speed;
  if (S.invTimer > 0) S.invTimer -= dt;
  S.score += Math.floor(S.speed * 0.008 * S.combo * dt);
}

function dealDamage(amt, isBarrier = false) {
  if (hasPowerup('shield')) {
    S.shieldHP -= amt; if (S.shieldHP <= 0) { delete S.activePowerups.shield; S.shieldHP=0; notify('SHIELD BROKEN!','#aa00ff'); } return;
  }
  if (hasPowerup('ghost')) return;
  const arm = carStat('arm');
  S.hp -= amt / arm;
  S.invTimer = 0.35;
  if (amt > 5) {
    S.shakeAmt = Math.min(0.75, amt * 0.035);
    showDamageFlash(); playCrashSound();
    spawnParticles(new THREE.Vector3(playerX,1,playerZ),0xff4400,8,2,4);
    if (amt > 14) { S.slowTarget=.28; S.slowTimer=.6; document.getElementById('smOv').classList.add('sh'); }
  }
  if (S.hp <= 0) { S.hp=0; triggerGameOver(); }
}

/* ═══════════════════════════════════════════
   POLICE AI (with escalation)
═══════════════════════════════════════════ */
let policeSpawnTimer = 0;
function updatePolice(dt) {
  policeSpawnTimer += dt;
  // Freeze power-up stops police
  if (hasPowerup('freeze')) {
    for (const [m] of policeData) m.position.z = m.position.z; // still
    return;
  }
  const maxCars = Math.min(Q().maxPol, Math.floor(S.heat) + 1);
  if (policePool.size() < maxCars && policeSpawnTimer > 1.4) {
    policeSpawnTimer = 0;
    const m = policePool.get();
    const lane = Math.floor(Math.random() * CFG.road.lanes);
    const laneW = CFG.road.width / CFG.road.lanes;
    const x = -CFG.road.width/2 + laneW/2 + lane*laneW;
    m.position.set(x, 0, playerZ - CFG.police.spawnDist - Math.random()*28);
    const roles = ['chaser','chaser','blocker','flanker'];
    const role = S.heat >= 3 ? roles[Math.floor(Math.random()*roles.length)] : 'chaser';
    policeData.set(m, { speed: CFG.police.baseSpd, aggression: 0.28+S.heat*0.12, role, nmCooldown: 0 });
  }
  for (const [m, d] of policeData) {
    const targetSpeed = S.speed*(0.62+d.aggression*.52)+4;
    d.speed = THREE.MathUtils.lerp(d.speed, targetSpeed, dt*1.6);
    d.speed = Math.max(6, d.speed);
    m.position.z += d.speed*dt;
    const dx = playerX - m.position.x;
    if (d.role==='blocker'&&m.position.z<playerZ+28&&m.position.z>playerZ) { d.speed=Math.max(d.speed,S.speed*1.05); m.position.x+=dx*dt*2.8; }
    else if (d.role==='flanker') { const tx=playerX+(dx>0?4:-4); m.position.x+=(tx-m.position.x)*dt*1.8; }
    else m.position.x += dx*d.aggression*dt*2.2;
    const halfW = CFG.road.width/2-1.1;
    m.position.x = Math.max(-halfW, Math.min(halfW, m.position.x));
    m.rotation.y = -dx*0.018;
    if (m.userData.sr&&m.userData.sb) {
      const flash = Math.sin(S.time*10)>0;
      m.userData.sr.material.color.setHex(flash?0xff0000:0x330000);
      m.userData.sb.material.color.setHex(flash?0x0000ff:0x000033);
    }
    if (d.nmCooldown>0) d.nmCooldown-=dt;
    if (m.position.z<playerZ-140||m.position.z>playerZ+90) { policeData.delete(m); policePool.release(m); }
  }
}

/* ═══════════════════════════════════════════
   TRAFFIC AI
═══════════════════════════════════════════ */
let trafficSpawnTimer = 0;
function updateTraffic(dt) {
  trafficSpawnTimer += dt;
  if (trafficPool.size() < Q().maxTrf && trafficSpawnTimer > 0.65) {
    trafficSpawnTimer = 0;
    const m = trafficPool.get();
    const lane = Math.floor(Math.random()*CFG.road.lanes);
    const laneW = CFG.road.width/CFG.road.lanes;
    const x = -CFG.road.width/2+laneW/2+lane*laneW;
    const ahead = Math.random()>.3;
    m.position.set(x, 0, ahead?playerZ+50+Math.random()*95:playerZ-22-Math.random()*28);
    trafficData.set(m, { speed: CFG.traffic.baseSpd*(0.5+Math.random()*.65), lane, laneTimer:4+Math.random()*7, nmCooldown:0, frozen:0 });
  }
  for (const [m, d] of trafficData) {
    if (hasPowerup('freeze')) { d.frozen=1; }
    else { d.frozen=Math.max(0,d.frozen-dt*0.5); }
    if (d.frozen>0.5) { m.material && (m.material.color = new THREE.Color(0x88ccff)); continue; }
    m.position.z += d.speed*dt;
    d.laneTimer-=dt;
    if (d.laneTimer<=0&&Math.random()<.14) { d.laneTimer=5+Math.random()*8; d.lane=Math.max(0,Math.min(CFG.road.lanes-1,d.lane+(Math.random()>.5?1:-1))); }
    const laneW=CFG.road.width/CFG.road.lanes;
    const targetX=-CFG.road.width/2+laneW/2+d.lane*laneW;
    m.position.x+=(targetX-m.position.x)*dt*1.8;
    if (d.nmCooldown>0) d.nmCooldown-=dt;
    if (m.position.z<playerZ-75||m.position.z>playerZ+185) { trafficData.delete(m); trafficPool.release(m); }
  }
}

/* ═══════════════════════════════════════════
   PICKUPS
═══════════════════════════════════════════ */
let coinSpawnTimer=0, repairSpawnTimer=0;

  for (const [m] of repairData) { m.rotation.y+=dt*2.2; m.position.y=.82+Math.sin(S.time*2.1+m.position.z)*.14; if (m.position.z<playerZ-32) { repairData.delete(m); repairPool.release(m); } }
}

/* ═══════════════════════════════════════════
   ROADBLOCKS
═══════════════════════════════════════════ */
let roadblockTimer=0;
function updateRoadblocks(dt) {
  roadblockTimer+=dt;
  const interval=Math.max(9,32-S.heat*4);
  if (roadblockTimer>interval&&S.heat>=2&&roadblockPool.size()<8) {
    roadblockTimer=0;
    const nb=2+Math.floor(Math.random()*2);
    const startLane=Math.floor(Math.random()*(CFG.road.lanes-nb+1));
    const laneW=CFG.road.width/CFG.road.lanes;
    const bz=playerZ+85+Math.random()*55;
    for (let i=0;i<nb;i++) {
      const m=roadblockPool.get();

      roadblockData.set(m,{});
    }
  }
  for (const [m] of roadblockData) { if (m.position.z<playerZ-45) { roadblockData.delete(m); roadblockPool.release(m); } }
}

/* ═══════════════════════════════════════════
   SPATIAL HASH + COLLISION (O(1) lookup)
═══════════════════════════════════════════ */
function buildSpatialHash() {
  spatialHash.clear();
  for (const [m] of policeData) spatialHash.insert({ mesh: m, type: 'police', data: policeData.get(m) }, m.position.x, m.position.z);
  for (const [m] of trafficData) spatialHash.insert({ mesh: m, type: 'traffic', data: trafficData.get(m) }, m.position.x, m.position.z);
  for (const [m] of coinData) spatialHash.insert({ mesh: m, type: 'coin' }, m.position.x, m.position.z);
  for (const [m] of repairData) spatialHash.insert({ mesh: m, type: 'repair' }, m.position.x, m.position.z);
  for (const [m] of powerupData) spatialHash.insert({ mesh: m, type: 'powerup', data: powerupData.get(m) }, m.position.x, m.position.z);
  for (const [m] of roadblockData) spatialHash.insert({ mesh: m, type: 'roadblock' }, m.position.x, m.position.z);
}

function checkCollisions() {
  if (S.invTimer > 0) return;
  const nearby = spatialHash.query(playerX, playerZ, 8);
  for (const obj of nearby) {
    const m = obj.mesh;
    const dx = Math.abs(playerX - m.position.x);
    const dz = Math.abs(playerZ - m.position.z);

    if (obj.type === 'police' && dx < 1.8 && dz < 2.1) {
      if (!hasPowerup('ghost') && !hasPowerup('shield')) { dealDamage(CFG.hp.polHit); S.speed*=.8; }
      m.position.x += (m.position.x - playerX) * 0.5;
      if (obj.data) obj.data.speed *= 0.6;
    }
    else if (obj.type === 'traffic' && dx < 1.8 && dz < 2.1) {
      if (!hasPowerup('ghost') && !hasPowerup('shield')) { dealDamage(CFG.hp.trfHit); S.speed*=.76; }
      m.position.z += 3.5;
      if (obj.data) obj.data.speed *= 0.4;
      spawnParticles(new THREE.Vector3(playerX,1,playerZ),0xff8800,8,1.5,4);
    }
    else if (obj.type === 'roadblock' && dx < 1.5 && dz < 1.1) {
      if (hasPowerup('ghost')) { roadblockData.delete(m); roadblockPool.release(m); S.missionStats.evade++; continue; }
      if (input.nitro && S.nitro > 5) {
        spawnParticles(m.position.clone(),0xff4400,14,2,6);
        roadblockData.delete(m); roadblockPool.release(m);
        S.score+=220; addXP(28); S.missionStats.evade++;
        notify('SMASHED! +220','#ff6600');
      } else { dealDamage(CFG.hp.roadblockHit); S.speed*=.38; S.lateralV*=-.45; spawnParticles(m.position.clone(),0xff4400,8,1.5,4); roadblockData.delete(m); roadblockPool.release(m); }
    }
    else if (obj.type === 'coin' && dx < 1.95 && dz < 2.2) {
      S.coins++; S.totalCoins++; addXP(CFG.coin.xpAmt); playCoinSound();
      spawnParticles(m.position.clone(),0xffaa00,5,1,3);
      coinData.delete(m); coinPool.release(m);
    }
    else if (obj.type === 'repair' && dx < 1.95 && dz < 2.2) {
      S.hp=Math.min(100,S.hp+CFG.coin.healAmt); addXP(10);
      notify('REPAIRED +'+CFG.coin.healAmt+' HP','#00ff44');
      spawnParticles(m.position.clone(),0x00ff44,8,1,4);
      repairData.delete(m); repairPool.release(m);
    }
    else if (obj.type === 'powerup' && dx < 1.95 && dz < 2.2) {
      activatePowerup(obj.data.type);
      powerupData.delete(m); powerupPool.release(m);
    }
  }
}

function checkNearMisses() {
  const nearby = spatialHash.query(playerX, playerZ, 5);
  for (const obj of nearby) {
    if (obj.type !== 'police' && obj.type !== 'traffic') continue;
    const m = obj.mesh;
    const dx = Math.abs(playerX - m.position.x);
    const dz = Math.abs(playerZ - m.position.z);
    const d = obj.data;
    if (dz < 3.2 && dx > 1.8 && dx < 3.1) {
      if (!d.nmCooldown || d.nmCooldown <= 0) {
        S.combo += CFG.combo.nearMissBonus; S.comboTimer=0;
        const bonus=Math.floor(CFG.combo.nearMissScore*S.combo);
        S.score+=bonus; addXP(14); S.nearMissCount++;
        S.missionStats.near++;
        notify('NEAR MISS +'+bonus,'#00fff0');
        spawnParticles(new THREE.Vector3(playerX,1.5,playerZ),0x00fff0,5,1,3);
        d.nmCooldown=2;
      }
    }
  }
}

/* ═══════════════════════════════════════════
   COMBO SYSTEM
═══════════════════════════════════════════ */
function updateCombo(dt) {
  S.comboTimer+=dt;
  if (S.comboTimer>CFG.combo.resetDelay) S.combo=Math.max(1,S.combo-CFG.combo.decay*dt);
  if (S.combo>S.maxCombo) S.maxCombo=S.combo;
  const cdEl=document.getElementById('cdB');
  if (S.combo>1.1) { cdEl.classList.add('sh'); document.getElementById('cdM').textContent='x'+S.combo.toFixed(1); }
  else cdEl.classList.remove('sh');
  const drEl=document.getElementById('drB');
  if (S.drifting) { drEl.classList.add('sh'); drEl.textContent='DRIFT '+S.driftTimer.toFixed(1)+'s'; }
  else drEl.classList.remove('sh');
}

/* ═══════════════════════════════════════════
   WEATHER SYSTEM
═══════════════════════════════════════════ */
let lightningTimer=10, lightningFlash=0;
function updateWeather(dt) {
  S.weatherTimer+=dt;
  if (S.weatherTimer>28) {
    S.weatherTimer=0;
    const weathers=['clear','clear','clear','rain','rain','storm','fog'];
    S.weather=weathers[Math.floor(Math.random()*weathers.length)];
    if (S.weather!=='clear') notify(S.weather.toUpperCase()+' INCOMING','#8899bb');
  }
  const biome=BIOMES[S.currentBiome];
  let targetDensity=biome.fogDensity;
  if (S.weather==='fog')   targetDensity=0.020;
  if (S.weather==='rain')  targetDensity=Math.max(targetDensity,0.010);
  if (S.weather==='storm') targetDensity=Math.max(targetDensity,0.013);
  scene.fog.density=THREE.MathUtils.lerp(scene.fog.density,targetDensity,dt*.45);
  if (S.weather==='storm') { lightningTimer-=dt; if (lightningTimer<=0) { lightningTimer=5+Math.random()*14; lightningFlash=1; } }
  if (lightningFlash>0) lightningFlash=Math.max(0,lightningFlash-dt*6);
  S.heat=Math.min(CFG.heat.max,S.heat+CFG.heat.rate*dt);
  S.time+=dt;
}

/* ═══════════════════════════════════════════
   CAMERA
═══════════════════════════════════════════ */
function updateCamera(dt) {
  const maxSpd=CFG.player.maxSpd*carStat('spd');
  const speedRatio=Math.min(1,S.speed/Math.max(1,maxSpd));
  const followDist=12+speedRatio*5;
  const followHeight=4.5+speedRatio*2.5;
  const targetPos=new THREE.Vector3(playerX*.32,playerMesh?playerMesh.position.y+followHeight:followHeight,playerZ-followDist);
  camera.position.lerp(targetPos,dt*4);
  if (S.shakeAmt>.01) { camera.position.x+=(Math.random()-.5)*S.shakeAmt; camera.position.y+=(Math.random()-.5)*S.shakeAmt*.35; S.shakeAmt*=.85; } else S.shakeAmt=0;
  const lookTarget=new THREE.Vector3(playerX*.5,1.2,playerZ+5+speedRatio*5);
  camera.lookAt(lookTarget);
  const targetFOV=62+speedRatio*20;
  camera.fov=THREE.MathUtils.lerp(camera.fov,targetFOV,dt*2.5);
  camera.updateProjectionMatrix();
}

/* ═══════════════════════════════════════════
   SLOW MOTION
═══════════════════════════════════════════ */
function updateSlowMo(rawDt) {
  if (S.slowTimer>0) { S.slowTimer-=rawDt; if (S.slowTimer<=0) { S.slowTarget=1; document.getElementById('smOv').classList.remove('sh'); } }
  S.slowScale=THREE.MathUtils.lerp(S.slowScale,S.slowTarget,rawDt*5);
}

/* ═══════════════════════════════════════════
   HUD UPDATE
═══════════════════════════════════════════ */
const spdCtx=document.getElementById('spdC').getContext('2d');
const mmCtx=document.getElementById('mmC').getContext('2d');

function updateHUD() {
  document.getElementById('hDst').textContent=S.dist;
  document.getElementById('hScr').textContent=S.score;
  document.getElementById('hCns').textContent=S.coins;
  document.getElementById('hpB').style.width=Math.max(0,S.hp)+'%';
  document.getElementById('niB').style.width=S.nitro+'%';
  document.getElementById('xpB').style.width=S.level>0?(S.xp/xpForLevel(S.level))*100+'%':'0%';
  document.getElementById('hLv').textContent=S.level;
  let heatHTML='';
  for (let i=1;i<=5;i++) heatHTML+=`<span class="${i<=Math.floor(S.heat)?'a':''}">★</span>`;
  document.getElementById('hHt').innerHTML=heatHTML;
  document.getElementById('nVig').classList.toggle('sh',input.nitro&&S.nitro>0);
  drawSpeedometer();
  drawMinimap();
}

function drawSpeedometer() {
  const c=spdCtx,w=130,h=80;
  c.clearRect(0,0,w,h);
  const cx=w/2,cy=h-4,r=54;
  const kmh=Math.floor(S.speed*3.6);
  const maxKmh=Math.floor(CFG.player.maxSpd*carStat('spd')*3.6);
  const ratio=Math.min(1,kmh/Math.max(1,maxKmh));
  c.beginPath();c.arc(cx,cy,r,Math.PI,2*Math.PI);c.strokeStyle='rgba(255,255,255,0.06)';c.lineWidth=5;c.stroke();
  const grad=c.createLinearGradient(cx-r,cy,cx+r,cy);
  grad.addColorStop(0,'#00fff0');grad.addColorStop(.55,'#ffaa00');grad.addColorStop(1,'#ff0044');
  const endAngle=Math.PI+Math.PI*ratio;
  c.beginPath();c.arc(cx,cy,r,Math.PI,endAngle);c.strokeStyle=grad;c.lineWidth=5;c.stroke();
  c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(endAngle)*(r-7),cy+Math.sin(endAngle)*(r-7));c.strokeStyle='#ff0066';c.lineWidth=2;c.stroke();
  c.fillStyle='#00fff0';c.font='900 20px Orbitron';c.textAlign='center';c.fillText(kmh,cx,cy-15);
  c.fillStyle='rgba(255,255,255,0.32)';c.font='600 8px Orbitron';c.fillText('KM/H',cx,cy-4);
}

function drawMinimap() {
  const c=mmCtx,w=100,h=100;
  c.clearRect(0,0,w,h);
  c.fillStyle='rgba(5,5,20,0.72)';c.fillRect(0,0,w,h);
  const cx=w/2,cy=h/2,rw=26;
  c.fillStyle='rgba(30,30,50,0.5)';c.fillRect(cx-rw/2,0,rw,h);
  const px=cx+(playerX/(CFG.road.width/2))*(rw/2);
  c.fillStyle='#00ff88';c.beginPath();c.arc(px,cy,3.2,0,Math.PI*2);c.fill();
  for (const [m] of policeData) { const rx=cx+(m.position.x/(CFG.road.width/2))*(rw/2); const rz=cy-(m.position.z-playerZ)*.24; if (rz>2&&rz<h-2) { c.fillStyle='#ff0044';c.beginPath();c.arc(rx,rz,2.2,0,Math.PI*2);c.fill(); } }
  for (const [m] of trafficData) { const rx=cx+(m.position.x/(CFG.road.width/2))*(rw/2); const rz=cy-(m.position.z-playerZ)*.24; if (rz>2&&rz<h-2) { c.fillStyle='#ffaa00';c.beginPath();c.arc(rx,rz,1.6,0,Math.PI*2);c.fill(); } }
  for (const [m] of roadblockData) { const rx=cx+(m.position.x/(CFG.road.width/2))*(rw/2); const rz=cy-(m.position.z-playerZ)*.24; if (rz>2&&rz<h-2) { c.fillStyle='#ff4400';c.fillRect(rx-2,rz-1,4,2); } }
  if (S.helicopterActive) { const rx=cx+(S.helicopterX/(CFG.road.width/2))*(rw/2); const rz=cy-(S.helicopterZ-playerZ)*.24; if (rz>2&&rz<h-2) { c.fillStyle='#ffffff';c.font='8px sans-serif';c.textAlign='center';c.fillText('🚁',rx,rz); } }
  c.strokeStyle='rgba(0,255,240,0.18)';c.lineWidth=1;c.strokeRect(0,0,w,h);
}

/* ═══════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════ */
let audioCtx=null, engineOsc=null, engineGain=null, sirenOsc1=null, sirenOsc2=null, sirenGain=null;
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    engineOsc=audioCtx.createOscillator(); engineOsc.type='sawtooth'; engineOsc.frequency.value=80;
    engineGain=audioCtx.createGain(); engineGain.gain.value=0;
    const filter=audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=420;
    engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination); engineOsc.start();
    sirenOsc1=audioCtx.createOscillator(); sirenOsc1.type='sine'; sirenOsc1.frequency.value=600;
    sirenOsc2=audioCtx.createOscillator(); sirenOsc2.type='sine'; sirenOsc2.frequency.value=800;
    sirenGain=audioCtx.createGain(); sirenGain.gain.value=0;
    sirenOsc1.connect(sirenGain); sirenOsc2.connect(sirenGain); sirenGain.connect(audioCtx.destination); sirenOsc1.start(); sirenOsc2.start();
  } catch(e) {}
}

function updateAudio() {
  if (!audioCtx||S.vol<=0) return;
  const ratio=S.speed/Math.max(1,CFG.player.maxSpd*carStat('spd'));
  engineOsc.frequency.value=60+ratio*220;
  engineGain.gain.value=Math.min(0.065,ratio*0.082)*S.vol;
  let closestPoliceDist=999;
  for (const [m] of policeData) { const d=Math.hypot(m.position.x-playerX,m.position.z-playerZ); if (d<closestPoliceDist) closestPoliceDist=d; }
  sirenGain.gain.value=Math.max(0,1-closestPoliceDist/55)*0.045*S.vol;
  const wave=Math.sin(S.time*3)*200;
  sirenOsc1.frequency.value=600+wave; sirenOsc2.frequency.value=800-wave;
}

function playCrashSound() {
  if (!audioCtx||S.vol<=0) return;
  try {
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.14,audioCtx.sampleRate);
    const data=buf.getChannelData(0);
    for (let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*.038));
    const src=audioCtx.createBufferSource(); src.buffer=buf;
    const g=audioCtx.createGain(); g.gain.value=0.11*S.vol;
    src.connect(g); g.connect(audioCtx.destination); src.start();
  } catch(e) {}
}

function playCoinSound() {
  if (!audioCtx||S.vol<=0) return;
  try {
    const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.value=1300;
    const g=audioCtx.createGain(); g.gain.value=0.055*S.vol;
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.11);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.11);
  } catch(e) {}
}

function playNitroSound() {
  if (!audioCtx||S.vol<=0) return;
  try {
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.28,audioCtx.sampleRate);
    const data=buf.getChannelData(0);
    for (let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*.18*Math.exp(-i/(audioCtx.sampleRate*.1));
    const src=audioCtx.createBufferSource(); src.buffer=buf;
    const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=700;
    const g=audioCtx.createGain(); g.gain.value=0.075*S.vol;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start();
  } catch(e) {}
}

═══════════════════════════════════════════ */
function showScreen(id) {
  ['menuOv','hudOv','garOv','setOv','paOv','goOv','lbOv'].forEach(oid => {
    const el=document.getElementById(oid); el.classList.remove('on');
    const sc=el.querySelector('.sc'); if (sc) sc.classList.remove('on');
  });
  const el=document.getElementById(id);
  if (el) { el.classList.add('on'); const sc=el.querySelector('.sc'); if (sc) sc.classList.add('on'); }
  const touch=document.getElementById('tCtrl');
  touch.classList.toggle('on',id==='hudOv'&&('ontouchstart' in window));
}

function startGame() {
  initAudio(); resetGame(); S.screen='playing'; showScreen('hudOv');
  showGhostCar(); startMission();
}

function resetGame() {
  Object.assign(S, {
    score:0, dist:0, coins:0, hp:100, nitro:100, heat:1,
    speed:0, lateralV:0, topSpeed:0, time:0, weatherTimer:0,
    weather:'clear', invTimer:0, shakeAmt:0,
    combo:1, comboTimer:0, maxCombo:1, driftTimer:0, drifting:false, totalDrift:0,
    sessionXP:0, slowScale:1, slowTarget:1, slowTimer:0,
    dayTime:0.25, currentBiome:0, biomeProgress:0, biomeTransition:0,
    currentMission:null, missionProgress:0, missionsCompleted:0,
    missionStats:{ near:0, evade:0, drift:0 }, nearMissCount:0,
    activePowerups:{}, shieldHP:0, magnetRadius:0,
    helicopterActive:false, helicopterX:0, helicopterZ:0, helicopterY:20,
    helicopterTimer:0, helicopterSpawnTimer:0,
    spikeStrips:[], replayBuffer:[], recordingReplay:true,
  });
  SI.left=SI.right=SI.gas=SI.brake=0;
  playerX=0; playerZ=0;
  biomeTimer=0; lastBiomeName='';
  puSpawnTimer=0;

  for (const [m] of policeData) policePool.release(m); policeData.clear();
  for (const [m] of trafficData) trafficPool.release(m); trafficData.clear();
  for (const [m] of coinData) coinPool.release(m); coinData.clear();
  for (const [m] of repairData) repairPool.release(m); repairData.clear();
  for (const [m] of powerupData) powerupPool.release(m); powerupData.clear();
  for (const [m] of particleData) particlePool.release(m); particleData.clear();
  for (const [m] of skidData) skidPool.release(m); skidData.clear();
  for (const [m] of roadblockData) roadblockPool.release(m); roadblockData.clear();

  // Clear spike strips
  spikeStripMeshes.forEach(m => scene.remove(m));
  spikeStripMeshes = [];

  for (const [,seg] of roadSegments) {
    roadGroup.remove(seg);
    seg.traverse(c=>{ if(c.isMesh){c.geometry.dispose();if(c.material&&!isSharedMat(c.material))c.material.dispose();} });
  }
  roadSegments.clear();

  if (playerMesh) { scene.remove(playerMesh); playerMesh=null; }
  if (ghostMesh) { ghostMesh.visible=false; }
  if (helicopterMesh) { helicopterMesh.visible=false; }

  const carCfg=CARS[S.selectedCar];
  playerMesh=createCar(carCfg.col,'player');
  playerMesh.position.set(0,0,0);
  scene.add(playerMesh);

  for (let z=-CFG.road.segLen;z<CFG.road.segLen*4;z+=CFG.road.segLen) buildRoadSegment(z);

  for (let i=0;i<5;i++) {
    const m=coinPool.get();
    const lane=Math.floor(Math.random()*CFG.road.lanes);
    const laneW=CFG.road.width/CFG.road.lanes;
    m.position.set(-CFG.road.width/2+laneW/2+lane*laneW,1.05,22+i*22);
    coinData.set(m,{});
  }

  policeSpawnTimer=trafficSpawnTimer=coinSpawnTimer=repairSpawnTimer=roadblockTimer=0;
  lightningTimer=10; lightningFlash=0;
  camera.position.set(0,7,-14); camera.fov=62; camera.updateProjectionMatrix();
  scene.fog.density=0.007;
  document.getElementById('msnHud').classList.add('hid');
  document.getElementById('puDisp').innerHTML='';
}

function triggerGameOver() {
  S.screen='gameover';
  document.getElementById('tCtrl').classList.remove('on');
  setHighScore(S.score);
  // Save replay if new best
  if (S.score >= getHighScore() - 1) {
    try { localStorage.setItem('hwyGhost6', JSON.stringify(S.replayBuffer.slice(-1000))); } catch(e) {}
  }
  addToLeaderboard({ score: S.score, dist: S.dist, car: CARS[S.selectedCar].name, time: new Date().toLocaleDateString() });
  document.getElementById('goD').textContent=S.dist;
  document.getElementById('goS').textContent=S.score;
  document.getElementById('goC').textContent=S.coins;
  document.getElementById('goSp').textContent=Math.floor(S.topSpeed*3.6);
  document.getElementById('goCo').textContent='x'+S.maxCombo.toFixed(1);
  document.getElementById('goX').textContent=S.sessionXP;
  document.getElementById('goM').textContent=S.missionsCompleted;
  document.getElementById('goB').textContent=BIOMES[S.currentBiome].name;
  showScreen('goOv');
  spawnParticles(new THREE.Vector3(playerX,1,playerZ),0xff4400,28,3,7);
  spawnParticles(new THREE.Vector3(playerX,1.5,playerZ),0xffaa00,18,2,5);
  saveSave();
}

function togglePause() {
  if (S.screen==='playing') { S.screen='paused'; showScreen('paOv'); }
  else if (S.screen==='paused') { S.screen='playing'; showScreen('hudOv'); }
}

function goToMenu() {
  S.screen='menu';

function openGarage() {

function renderGarage() {
  const grid=document.getElementById('cGrd'); grid.innerHTML='';
  CARS.forEach(car => {
    const unlocked=S.unlocked.includes(car.id);
    const equipped=S.selectedCar===car.id;
    const card=document.createElement('div');
    card.className='cc'+(equipped?' sel':'')+(!unlocked?' lk':'');
    const hex='#'+car.col.toString(16).padStart(6,'0');
    const stats=[{l:'SPEED',v:car.spd,c:'#00fff0'},{l:'HANDLE',v:car.han,c:'#ffaa00'},{l:'ARMOR',v:car.arm,c:'#ff4477'},{l:'NITRO',v:car.nit,c:'#0088ff'}];
    card.innerHTML=`<div class="cn" style="color:${hex}">${car.name}</div><div class="cs" style="background:${hex}"></div>`+stats.map(s=>`<div class="sr"><span class="sl">${s.l}</span><div class="sb"><div class="sf" style="width:${Math.min(100,s.v*64)}%;background:${s.c}"></div></div></div>`).join('')+(!unlocked?`<div class="cco">🔒 ${car.cost} coins</div>`:'')+(unlocked&&!equipped?`<button class="bt s eqb" data-id="${car.id}">EQUIP</button>`:'')+( equipped?`<div class="ceq">EQUIPPED ✓</div>`:'')+(!unlocked?`<button class="bt s g byb" data-id="${car.id}">BUY (${car.cost})</button>`:'');
    grid.appendChild(card);
  });
  grid.querySelectorAll('.eqb').forEach(b=>b.addEventListener('click',()=>{ S.selectedCar=parseInt(b.dataset.id); saveSave(); renderGarage(); }));
  grid.querySelectorAll('.byb').forEach(b=>b.addEventListener('click',()=>{ const id=parseInt(b.dataset.id); const car=CARS.find(c=>c.id===id); if (S.totalCoins>=car.cost){S.totalCoins-=car.cost;S.unlocked.push(id);S.selectedCar=id;saveSave();document.getElementById('gCn').textContent=S.totalCoins;renderGarage();}  }));
}

function openLeaderboard() {

/* ═══════════════════════════════════════════
   FPS + AUTO QUALITY SCALER
═══════════════════════════════════════════ */
const fpsSamples=[];
let fpsTimer=0, autoQualityTimer=0;
function updateFPS(rawDt) {
  fpsTimer+=rawDt; fpsSamples.push(rawDt);
  if (fpsTimer>.5) {
    fpsTimer=0;
    while (fpsSamples.length>30) fpsSamples.shift();
    const avg=fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length;
    const fps=Math.round(1/Math.max(.001,avg));
    document.getElementById('fpsC').textContent=fps+' FPS';
    // Auto quality scaler: drop quality if FPS < 40
    autoQualityTimer+=0.5;
    if (autoQualityTimer>5) {
      autoQualityTimer=0;
      if (fps<40&&QL>0) { QL--; bloomPass.strength=Q().bloomStr; bloomPass.enabled=Q().bloom; notify('AUTO: Quality reduced','#4a5580'); }
      else if (fps>60&&QL<2) {} // could upgrade but let's be conservative
    }
  }
  document.getElementById('fpsC').classList.toggle('sh',S.showFps);
}

initRain();

document.getElementById('fpsC').classList.toggle('sh',S.showFps);

document.addEventListener('visibilitychange',()=>{ if (document.hidden&&S.screen==='playing') togglePause(); });

/* ═══════════════════════════════════════════
   MAIN GAME LOOP
═══════════════════════════════════════════ */
let lastTimestamp=0;
function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);
  const rawDt=Math.min((timestamp-lastTimestamp)/1000,.05);
  lastTimestamp=timestamp;
  updateFPS(rawDt);
  updateSlowMo(rawDt);
  const dt=rawDt*S.slowScale;

  if (S.screen==='playing') {
    updatePlayer(dt);
    updatePolice(dt);
    updateTraffic(dt);
    updatePickups(dt);
    updatePowerups(dt);
    updateRoadblocks(dt);
    updateHelicopter(dt);
    updateSpikeStrips(dt);
    updateParticles(dt);
    updateSkids(dt);
    updateRoad();
    updateWeather(dt);
    updateRain(dt);
    updateDayNight(dt);
    updateBiome(dt);
    updateCamera(dt);
    updateMission(dt);
    buildSpatialHash();
    checkCollisions();
    checkNearMisses();
    updateCombo(dt);
    updateReplayRecording(dt);
    updateGhostCar(dt);
    updateHUD();
    updateAudio();
  } else if (S.screen==='gameover') {
    updateParticles(rawDt);
    updateCamera(rawDt);
  }

  composer.render();
}
requestAnimationFrame(gameLoop);
